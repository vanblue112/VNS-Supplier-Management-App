<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VinaSources Supplier App</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.2/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f0f0;color:#1a1a1a}
input,select,textarea,button{font-family:inherit;outline:none}
:root{
--bg1:#fff;--bg2:#f8f8f8;--bg3:#f0f0f0;
--t1:#1a1a1a;--t2:#555;--t3:#999;
--b1:rgba(0,0,0,0.2);--b2:rgba(0,0,0,0.12);
--r1:8px;--r2:12px;
}
</style>
</head>
<body>
<div id="root"><div style="padding:2rem;color:#666;font-size:14px">Đang khởi động...</div></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;

const EDIT_PW="vinasources2026";
const AUTH_KEY="vns_auth_v1";
const SK_S="vns_sup_v3";
const SK_R="vns_rfq_v2";

// storage
const db={
  get:k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
};

const INDUSTRIES=["Accessories","Baby & Toy","Bags & Luggage","Construction Materials","Fashion Accessories","Food & Agriculture","Footwear","Furniture","Handicraft & Woven","Hardware, Tools & Equipment","Home & Kitchen","Office & Stationery","Packaging","Pet Supplies","Textiles & Apparel","Other"];
const BIZ_MODELS=["Manufacturer","Wholesaler","Trader","Service Provider","Manufacturer + Trader","Other"];
const PARTNER_TYPES=["Đối tác trực tiếp","Đối tác nền tảng","Chưa xác định"];
const LEGAL_TYPES=["Công ty TNHH MTV","Công ty TNHH 2TV trở lên","Công ty Cổ phần","Doanh nghiệp tư nhân","Hộ kinh doanh","Hợp tác xã","Văn phòng đại diện","Khác"];
const PARTNER_TYPES=["Đối tác trực tiếp","Đối tác nền tảng","Chưa xác định"];
// end constants["Hà Nội","TP. Hồ Chí Minh","Hải Phòng","Đà Nẵng","Cần Thơ","An Giang","Bà Rịa - Vũng Tàu","Bắc Giang","Bắc Kạn","Bạc Liêu","Bắc Ninh","Bến Tre","Bình Định","Bình Dương","Bình Phước","Bình Thuận","Cà Mau","Cao Bằng","Đắk Lắk","Đắk Nông","Điện Biên","Đồng Nai","Đồng Tháp","Gia Lai","Hà Giang","Hà Nam","Hà Tĩnh","Hải Dương","Hậu Giang","Hòa Bình","Hưng Yên","Khánh Hòa","Kiên Giang","Kon Tum","Lai Châu","Lâm Đồng","Lạng Sơn","Lào Cai","Long An","Nam Định","Nghệ An","Ninh Bình","Ninh Thuận","Phú Thọ","Phú Yên","Quảng Bình","Quảng Nam","Quảng Ngãi","Quảng Ninh","Quảng Trị","Sóc Trăng","Sơn La","Tây Ninh","Thái Bình","Thái Nguyên","Thanh Hóa","Thừa Thiên Huế","Tiền Giang","Trà Vinh","Tuyên Quang","Vĩnh Long","Vĩnh Phúc","Yên Bái"];
const CHANNELS=["Referral / Network","Triển lãm (HAWA, VietnamExpo...)","Outbound / LinkedIn","Alibaba / Global Sources","Google / Directory ngành"];
const MARKETS=["EU","US","Nhật Bản","Hàn Quốc","Úc","Canada","UK","Trung Đông","ASEAN","Khác"];
const STAGES=[
  {id:"B1",label:"B1 Xác định ngành",ph:1},{id:"B2",label:"B2 Longlist",ph:1},{id:"B3",label:"B3 Pre-score",ph:1},
  {id:"B4",label:"B4 Liên hệ",ph:2},{id:"B5",label:"B5 Thu hồ sơ",ph:2},{id:"B6",label:"B6 Chấm VSERF",ph:2},{id:"B7",label:"B7 Xác minh",ph:2},
  {id:"B8",label:"B8 Chuẩn hóa",ph:3},{id:"B9",label:"B9 Onboard",ph:3},{id:"B10",label:"B10 Kích hoạt RFQ",ph:3},{id:"B11",label:"B11 Theo dõi",ph:3},
];
const RFQ_ST=[
  {id:"new",label:"Mới nhận",c:"#185FA5",bg:"#E6F1FB"},
  {id:"searching",label:"Đang tìm NCC",c:"#854F0B",bg:"#FAEEDA"},
  {id:"shortlisted",label:"Đã shortlist",c:"#534AB7",bg:"#EEEDFE"},
  {id:"sent",label:"Đã gửi Sales",c:"#1D9E75",bg:"#EAF3DE"},
  {id:"closed",label:"Closed",c:"#888",bg:"#F0F0F0"},
];
const VCOLS=[
  {id:"phap_ly",l:"01 Pháp lý",d:"Giấy phép KD, MST, hồ sơ ngành nghề XK đầy đủ"},
  {id:"san_xuat",l:"02 Sản xuất",d:"Nhà xưởng riêng, công suất ≥ MOQ buyer, máy móc đủ"},
  {id:"chat_luong",l:"03 Chất lượng",d:"ISO 9001 hoặc tương đương, QC nội bộ 3 lớp"},
  {id:"xuat_khau",l:"04 Xuất khẩu",d:"Đã XK ≥ 2 năm, thông thạo Incoterms FOB/CIF"},
  {id:"chung_tu",l:"05 Chứng từ",d:"Tự lập CO, packing list, invoice EN; HS code đúng"},
  {id:"rfq",l:"06 Phản hồi RFQ",d:"Trả lời ≤24h; báo giá có cost breakdown rõ"},
  {id:"oem_odm",l:"07 OEM/ODM",d:"Có R&D; làm mẫu 7–10 ngày; tùy chỉnh theo buyer"},
  {id:"giao_tiep",l:"08 Giao tiếp",d:"Sales tiếng Anh B2+; email/Zoom không cần phiên dịch"},
  {id:"minh_bach",l:"09 Minh bạch",d:"Sẵn sàng buyer visit, factory audit, factory video"},
];

const calcTier=v=>{
  const t=Object.values(v||{}).reduce((a,b)=>a+(b||0),0);
  if((v.phap_ly||0)<3||(v.san_xuat||0)<3)return{label:"Not Qualified",c:"#A32D2D",bg:"#FCEBEB",t};
  if(t>=38)return{label:"Tier 1",c:"#3B6D11",bg:"#EAF3DE",t};
  if(t>=27)return{label:"Tier 2",c:"#185FA5",bg:"#E6F1FB",t};
  if(t>=18)return{label:"Tier 3",c:"#854F0B",bg:"#FAEEDA",t};
  return{label:"Not Qualified",c:"#A32D2D",bg:"#FCEBEB",t};
};

const newS=()=>({id:Date.now()+"s",name:"",bizModel:"",legalType:"",partnerType:"Chưa xác định",industry:"",products:"",foundedYear:"",province:"",website:"",channel:"",contactName:"",zalo:"",email:"",certs:"",capacity:"",moq:"",priceRange:"",leadTime:"",incoterm:"",serviceModel:"",paymentMethod:"",stage:"B1",notes:"",specialNotes:"",source:"proactive",vserf:{phap_ly:0,san_xuat:0,chat_luong:0,xuat_khau:0,chung_tu:0,rfq:0,oem_odm:0,giao_tiep:0,minh_bach:0},perf:{qc:0,delivery:0,comm:0,price:0,flex:0},ca:new Date().toISOString(),ua:new Date().toISOString()});
const newR=()=>({id:Date.now()+"r",code:"RFQ-"+Date.now().toString().slice(-5),sales:"",date:new Date().toISOString().slice(0,10),desc:"",markets:[],deadline:"",qty:"",certs:"",price:"",incoterm:"",notes:"",status:"new",sids:[],snotes:{},ca:new Date().toISOString(),ua:new Date().toISOString()});

// ── UI atoms ──
const iSt={padding:"7px 10px",borderRadius:6,border:"1px solid #ddd",background:"#fff",color:"#1a1a1a",fontSize:13,width:"100%"};
const gBtn={padding:"7px 14px",borderRadius:6,border:"1px solid #ddd",background:"none",cursor:"pointer",fontSize:13,color:"#555"};
const pBtn={padding:"7px 18px",borderRadius:6,border:"none",background:"#1D9E75",color:"#fff",cursor:"pointer",fontSize:13,fontWeight:500};

function Card({children,style={}}){return <div style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:12,padding:"1.4rem",...style}}>{children}</div>;}
function Sec({title,children}){return<div style={{marginBottom:"1.1rem"}}><div style={{fontSize:11,fontWeight:600,color:"#999",textTransform:"uppercase",letterSpacing:1,marginBottom:7,borderBottom:"1px solid #f0f0f0",paddingBottom:4}}>{title}</div><div style={{display:"grid",gap:8}}>{children}</div></div>;}
function Rw({l,children}){return<div style={{display:"grid",gridTemplateColumns:"140px 1fr",gap:8,alignItems:"start"}}><span style={{fontSize:13,color:"#666",paddingTop:8,lineHeight:1.3}}>{l}</span><div>{children}</div></div>;}
function IB({title,children}){return<div><div style={{fontSize:11,fontWeight:600,color:"#999",marginBottom:6,textTransform:"uppercase",letterSpacing:.8}}>{title}</div>{children}</div>;}
function IR({l,v}){return<div style={{display:"flex",gap:8,fontSize:13,padding:"3px 0"}}><span style={{color:"#777",minWidth:90,flexShrink:0}}>{l}</span><span style={{color:"#1a1a1a",flex:1}}>{v||<span style={{color:"#ccc"}}>—</span>}</span></div>;}
function Sel({val,onChange,opts}){return<select value={val} onChange={e=>onChange(e.target.value)} style={{...iSt,width:"auto"}}>{opts.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select>;}
function Empty({text}){return<div style={{textAlign:"center",padding:"3rem",color:"#aaa",fontSize:13}}>{text}</div>;}
function Modal({children,onClose}){return<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",zIndex:1000,display:"flex",alignItems:"flex-start",justifyContent:"center",overflowY:"auto",padding:"1rem"}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}><div style={{width:"100%",maxWidth:700,marginTop:"2rem",marginBottom:"2rem"}} onClick={e=>e.stopPropagation()}>{children}</div></div>;}

// ── App ──
function App(){
  const [canEdit,setCanEdit]=useState(localStorage.getItem(AUTH_KEY)==="1");
  const [sups,setSups]=useState([]);
  const [rfqs,setRfqs]=useState([]);
  const [tab,setTab]=useState("list");
  const [modal,setModal]=useState(null);
  const [toast,setToast]=useState(null);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{setSups(db.get(SK_S)||[]);setRfqs(db.get(SK_R)||[]);setLoading(false);},[]);

  const toast2=(m)=>{setToast(m);setTimeout(()=>setToast(null),2500);};
  const saveSups=useCallback(l=>{setSups(l);db.set(SK_S,l);},[]);
  const saveRfqs=useCallback(l=>{setRfqs(l);db.set(SK_R,l);},[]);

  const upsS=s=>{const u={...s,ua:new Date().toISOString()};const i=sups.findIndex(x=>x.id===u.id);saveSups(i>=0?sups.map((x,j)=>j===i?u:x):[u,...sups]);toast2(i>=0?"Đã cập nhật":"Đã thêm supplier");setModal(null);};
  const delS=id=>{if(!confirm("Xóa supplier này?"))return;saveSups(sups.filter(x=>x.id!==id));setModal(null);toast2("Đã xóa");};
  const upsR=r=>{const u={...r,ua:new Date().toISOString()};const i=rfqs.findIndex(x=>x.id===u.id);saveRfqs(i>=0?rfqs.map((x,j)=>j===i?u:x):[u,...rfqs]);toast2(i>=0?"Đã cập nhật RFQ":"Đã tạo RFQ");setModal(null);};
  const delR=id=>{if(!confirm("Xóa RFQ?"))return;saveRfqs(rfqs.filter(x=>x.id!==id));setModal(null);toast2("Đã xóa");};
  const logout=()=>{localStorage.removeItem(AUTH_KEY);setCanEdit(false);};

  if(loading)return <div style={{padding:"2rem",color:"#666"}}>Đang tải...</div>;
  const ctx={sups,rfqs,upsS,delS,upsR,delR,setModal,toast2,canEdit};

  return(
    <div style={{minHeight:"100vh",background:"#f0f0f0"}}>
      {toast&&<div style={{position:"fixed",top:14,right:14,background:"#1D9E75",color:"#fff",padding:"10px 20px",borderRadius:8,fontSize:13,zIndex:9999,fontWeight:500,boxShadow:"0 2px 12px rgba(0,0,0,0.15)"}}>{toast}</div>}
      {!canEdit&&<LoginBanner onLogin={()=>setCanEdit(true)}/>}
      {/* NAV */}
      <div style={{background:"#fff",borderBottom:"1px solid #e5e5e5",padding:"0 1rem"}}>
        <div style={{maxWidth:940,margin:"0 auto",display:"flex",alignItems:"center",gap:2}}>
          <span style={{fontWeight:700,fontSize:14,color:"#1D9E75",paddingRight:14,borderRight:"1px solid #eee",marginRight:6,letterSpacing:.3}}>🏭 VinaSources</span>
          {[{id:"list",l:"Supplier DB"},{id:"rfq",l:"RFQ Tracking"},{id:"dash",l:"Dashboard"}].map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{background:"none",border:"none",padding:"13px 11px",fontSize:13,cursor:"pointer",color:tab===t.id?"#1a1a1a":"#777",borderBottom:tab===t.id?"2px solid #1D9E75":"2px solid transparent",fontWeight:tab===t.id?600:400,position:"relative"}}>
              {t.l}
              {t.id==="rfq"&&rfqs.filter(r=>r.status==="new"||r.status==="searching").length>0&&
                <span style={{position:"absolute",top:7,right:0,background:"#E24B4A",color:"#fff",fontSize:10,fontWeight:700,borderRadius:8,padding:"0 5px"}}>{rfqs.filter(r=>r.status==="new"||r.status==="searching").length}</span>}
            </button>
          ))}
          <div style={{flex:1}}/>
          {canEdit?(
            <>
              <button onClick={()=>setModal({t:"rfq-form",d:newR()})} style={{padding:"6px 12px",borderRadius:6,border:"1px solid #185FA5",background:"none",color:"#185FA5",fontSize:12,cursor:"pointer",fontWeight:500,marginRight:6}}>+ RFQ mới</button>
              <button onClick={()=>setModal({t:"sup-form",d:newS()})} style={{padding:"6px 12px",borderRadius:6,border:"none",background:"#1D9E75",color:"#fff",fontSize:12,cursor:"pointer",fontWeight:500}}>+ Supplier</button>
              <button onClick={logout} style={{padding:"6px 10px",borderRadius:6,border:"1px solid #eee",background:"none",color:"#aaa",fontSize:11,cursor:"pointer",marginLeft:6}}>Đăng xuất</button>
            </>
          ):<span style={{fontSize:12,color:"#aaa",padding:"6px 10px"}}>👁 Chỉ xem</span>}
        </div>
      </div>
      {/* CONTENT */}
      <div style={{maxWidth:940,margin:"0 auto",padding:"1rem"}}>
        {tab==="list"&&<SupList ctx={ctx}/>}
        {tab==="rfq"&&<RFQList ctx={ctx}/>}
        {tab==="dash"&&<Dash ctx={ctx}/>}
      </div>
      {/* MODALS */}
      {modal?.t==="sup-form"&&canEdit&&<Modal onClose={()=>setModal(null)}><SupForm s={modal.d} ctx={ctx}/></Modal>}
      {modal?.t==="sup-detail"&&<Modal onClose={()=>setModal(null)}><SupDetail s={modal.d} ctx={ctx}/></Modal>}
      {modal?.t==="scoring"&&canEdit&&<Modal onClose={()=>setModal(null)}><Scoring s={modal.d} ctx={ctx}/></Modal>}
      {modal?.t==="brief"&&<Modal onClose={()=>setModal(null)}><Brief s={modal.d}/></Modal>}
      {modal?.t==="rfq-form"&&canEdit&&<Modal onClose={()=>setModal(null)}><RFQForm r={modal.d} ctx={ctx}/></Modal>}
      {modal?.t==="rfq-detail"&&<Modal onClose={()=>setModal(null)}><RFQDetail r={modal.d} ctx={ctx}/></Modal>}
      {modal?.t==="rfq-assign"&&canEdit&&<Modal onClose={()=>setModal(null)}><RFQAssign r={modal.d} ctx={ctx}/></Modal>}
    </div>
  );
}

function LoginBanner({onLogin}){
  const [pw,setPw]=useState("");const [err,setErr]=useState(false);
  const try_=()=>{if(pw===EDIT_PW){localStorage.setItem(AUTH_KEY,"1");onLogin();}else{setErr(true);setTimeout(()=>setErr(false),2000);}};
  return(
    <div style={{background:"#FAEEDA",borderBottom:"1px solid #EF9F27",padding:"9px 1rem"}}>
      <div style={{maxWidth:940,margin:"0 auto",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <span style={{fontSize:13,color:"#633806"}}>👁 Chế độ xem — Nhập mật khẩu để chỉnh sửa</span>
        <div style={{display:"flex",gap:6,marginLeft:"auto",alignItems:"center"}}>
          <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&try_()} placeholder="Mật khẩu..." style={{padding:"5px 10px",borderRadius:6,border:`1px solid ${err?"#E24B4A":"#EF9F27"}`,fontSize:13,width:160}}/>
          <button onClick={try_} style={{padding:"5px 14px",borderRadius:6,border:"none",background:"#EF9F27",color:"#fff",fontSize:13,fontWeight:500,cursor:"pointer"}}>OK</button>
          {err&&<span style={{fontSize:12,color:"#A32D2D",fontWeight:500}}>Sai mật khẩu</span>}
        </div>
      </div>
    </div>
  );
}

// ── SUPPLIER LIST ──
function SupList({ctx}){
  const {sups,setModal}=ctx;
  const [q,setQ]=useState("");const [fT,setFT]=useState("all");const [fI,setFI]=useState("all");const [fS,setFS]=useState("all");
  const inds=[...new Set(sups.map(s=>s.industry).filter(Boolean))];
  const fl=sups.filter(s=>{
    const ti=calcTier(s.vserf);
    return(fT==="all"||ti.label.startsWith(fT))&&(fI==="all"||s.industry===fI)&&(fS==="all"||s.stage===fS)&&(!q||[s.name,s.products,s.province,s.industry].some(v=>(v||"").toLowerCase().includes(q.toLowerCase())));
  });
  const csv=()=>{
    try {
      const h=["Tên","Ngành","Sản phẩm","Tỉnh/TP","Mô hình KD","Loại hình DN","Website","Contact","Zalo","Email","Stage","Tier","VSERF","Công suất","MOQ","Price Range","Lead time","Incoterm","Mô hình SX","Thanh toán","Lưu ý đặc biệt"];
      const rows=fl.map(s=>{const ti=calcTier(s.vserf);return[s.name,s.industry,s.products,s.province,s.bizModel,s.legalType,s.website,s.contactName,s.zalo,s.email,s.stage,ti.label,ti.t,s.capacity,s.moq,s.priceRange,s.leadTime,s.incoterm,s.serviceModel,s.paymentMethod,s.specialNotes].map(v=>`"${(String(v||"")).replace(/"/g,'""')}"`).join(",");});
      const content="\uFEFF"+[h.join(","),...rows].join("\r\n");
      const blob=new Blob([content],{type:"text/csv;charset=utf-8"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url;a.download="VinaSources_"+new Date().toISOString().slice(0,10)+".csv";
      document.body.appendChild(a);a.click();
      document.body.removeChild(a);URL.revokeObjectURL(url);
    } catch(e){alert("Lỗi xuất CSV: "+e.message);}
  };
  return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Tìm tên, sản phẩm, tỉnh..." style={{...iSt,flex:1,minWidth:160}}/>
        <Sel val={fT} onChange={setFT} opts={[["all","Tất cả Tier"],["Tier 1","Tier 1"],["Tier 2","Tier 2"],["Tier 3","Tier 3"],["Not","Not Qualified"]]}/>
        <Sel val={fI} onChange={setFI} opts={[["all","Tất cả ngành"],...inds.map(i=>[i,i])]}/>
        <Sel val={fS} onChange={setFS} opts={[["all","Tất cả Stage"],...STAGES.map(s=>[s.id,s.label])]}/>
        <button onClick={csv} style={gBtn}>⬇ CSV</button>
      </div>
      <div style={{fontSize:12,color:"#aaa",marginBottom:8}}>{fl.length} supplier</div>
      {fl.length===0&&<Empty text="Chưa có supplier. Nhấn + Supplier để thêm."/>}
      <div style={{display:"flex",flexDirection:"column",gap:7}}>
        {fl.map(s=>{const ti=calcTier(s.vserf);const st=STAGES.find(x=>x.id===s.stage);return(
          <div key={s.id} onClick={()=>setModal({t:"sup-detail",d:s})} style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"11px 14px",display:"flex",alignItems:"center",gap:10,cursor:"pointer",transition:"box-shadow .15s"}} onMouseEnter={e=>e.currentTarget.style.boxShadow="0 2px 8px rgba(0,0,0,0.08)"} onMouseLeave={e=>e.currentTarget.style.boxShadow="none"}>
            <div style={{width:36,height:36,borderRadius:8,background:ti.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>
              {ti.label==="Tier 1"?"🥇":ti.label==="Tier 2"?"🥈":ti.label==="Tier 3"?"🥉":"✕"}
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,fontSize:13,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.name||<span style={{color:"#ccc"}}>Chưa đặt tên</span>}</div>
              <div style={{fontSize:12,color:"#777",marginTop:2}}>{[s.industry,s.province,s.products].filter(Boolean).join(" · ")}</div>
            </div>
            {s.source==="reactive"&&<span style={{fontSize:10,padding:"2px 6px",borderRadius:4,background:"#EEEDFE",color:"#534AB7",fontWeight:600,flexShrink:0}}>RFQ</span>}
            <span style={{fontSize:11,padding:"2px 9px",borderRadius:4,background:ti.bg,color:ti.c,fontWeight:600,flexShrink:0}}>{ti.label}</span>
            <span style={{fontSize:11,padding:"2px 7px",borderRadius:4,background:"#f5f5f5",color:"#777",flexShrink:0}}>{st?.id}</span>
            <span style={{fontSize:12,color:"#aaa",minWidth:36,textAlign:"right",flexShrink:0}}>{ti.t}/45</span>
          </div>
        );})}
      </div>
    </div>
  );
}

// ── SUPPLIER DETAIL ──
function SupDetail({s,ctx}){
  const {setModal,delS,canEdit}=ctx;
  const ti=calcTier(s.vserf);
  return(
    <Card>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8,marginBottom:14}}>

// ── SCORING ──
function Scoring({s,ctx}){
  const {upsS,setModal}=ctx;
  const [sc,setSc]=useState({...s.vserf});
  const [pf,setPf]=useState({...s.perf});
  const ti=calcTier(sc);
  return(
    <Card>
      <h2 style={{margin:"0 0 4px",fontSize:15,fontWeight:600}}>VSERF — {s.name}</h2>
      <div style={{fontSize:12,color:"#777",marginBottom:12}}>9 trụ cột · 0–5 điểm · Tổng tối đa 45</div>
      <div style={{background:ti.bg,border:`1.5px solid ${ti.c}`,borderRadius:8,padding:"10px 16px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontWeight:600,color:ti.c,fontSize:14}}>{ti.label}</span>
        <span style={{fontWeight:700,color:ti.c,fontSize:20}}>{ti.t} / 45</span>
      </div>
      {VCOLS.map(c=>{const v=sc[c.id]||0;const warn=(c.id==="phap_ly"||c.id==="san_xuat")&&v<3;return(
        <div key={c.id} style={{marginBottom:12,padding:"10px 12px",border:`1px solid ${warn?"#E24B4A":"#eee"}`,borderRadius:8,background:warn?"#FFF5F5":"#fafafa"}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontWeight:600,fontSize:13,color:warn?"#A32D2D":"#1a1a1a"}}>{c.l}</span><span style={{fontWeight:600,fontSize:14,color:warn?"#A32D2D":"#1a1a1a"}}>{v}/5</span></div>
          <div style={{fontSize:11,color:"#aaa",marginBottom:6}}>{c.d}</div>
          {warn&&<div style={{fontSize:11,color:"#A32D2D",marginBottom:5}}>⚠ Bắt buộc ≥3 điểm — dưới ngưỡng → Not Qualified</div>}
          <input type="range" min={0} max={5} step={1} value={v} onChange={e=>setSc(p=>({...p,[c.id]:+e.target.value}))} style={{width:"100%"}}/>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#ccc"}}>{[0,1,2,3,4,5].map(n=><span key={n}>{n}</span>)}</div>
        </div>
      );})}
      <div style={{fontSize:13,fontWeight:600,margin:"14px 0 8px",color:"#555"}}>Hiệu suất định kỳ (nếu đã có đơn)</div>
      {[{id:"qc",l:"Pass QC lần đầu",w:"30%"},{id:"delivery",l:"Giao hàng đúng hạn",w:"25%"},{id:"comm",l:"Phản hồi & giao tiếp",w:"20%"},{id:"price",l:"Giá cạnh tranh",w:"15%"},{id:"flex",l:"Xử lý phát sinh",w:"10%"}].map(c=>(
        <div key={c.id} style={{marginBottom:10,display:"grid",gridTemplateColumns:"1fr auto",gap:8,alignItems:"center"}}>
          <div><div style={{fontSize:13,color:"#1a1a1a"}}>{c.l} <span style={{fontSize:11,color:"#aaa"}}>({c.w})</span></div><input type="range" min={0} max={5} step={1} value={pf[c.id]||0} onChange={e=>setPf(p=>({...p,[c.id]:+e.target.value}))} style={{width:"100%"}}/></div>
          <span style={{fontSize:14,fontWeight:600,minWidth:30,textAlign:"right"}}>{pf[c.id]||0}/5</span>
        </div>
      ))}
      <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:10}}>
        <button onClick={()=>setModal(null)} style={gBtn}>Hủy</button>
        <button onClick={()=>upsS({...s,vserf:sc,perf:pf})} style={pBtn}>Lưu điểm</button>
      </div>
    </Card>
  );
}

        <Rw l="Mô tả sản phẩm *"><textarea value={f.desc||""} onChange={e=>set("desc",e.target.value)} placeholder="VD: Áo polo cotton 220gsm, logo thêu..." style={{...iSt,minHeight:70,resize:"vertical",boxSizing:"border-box"}}/></Rw>
        <Rw l="Thị trường buyer"><div style={{display:"flex",flexWrap:"wrap",gap:6}}>{MARKETS.map(m=><button key={m} onClick={()=>tog(m)} style={{padding:"4px 10px",borderRadius:5,border:`1px solid ${f.markets?.includes(m)?"#185FA5":"#ddd"}`,background:f.markets?.includes(m)?"#E6F1FB":"none",color:f.markets?.includes(m)?"#185FA5":"#777",fontSize:12,cursor:"pointer"}}>{m}</button>)}</div></Rw>
        <Rw l="MOQ / Số lượng"><input value={f.qty||""} onChange={e=>set("qty",e.target.value)} placeholder="500 pcs, 1 container 20ft" style={iSt}/></Rw>
        <Rw l="Giá mục tiêu"><input value={f.price||""} onChange={e=>set("price",e.target.value)} placeholder="FOB $3.5–4.0/pcs" style={iSt}/></Rw>
        <Rw l="Incoterm"><input value={f.incoterm||""} onChange={e=>set("incoterm",e.target.value)} placeholder="FOB HCMC" style={iSt}/></Rw>
        <Rw l="Chứng chỉ yêu cầu"><textarea value={f.certs||""} onChange={e=>set("certs",e.target.value)} placeholder="VD: BSCI, REACH, CA65, ISO 9001, HACCP..." style={{...iSt,minHeight:70,resize:"vertical",boxSizing:"border-box"}}/></Rw>
        <Rw l="Ghi chú thêm"><textarea value={f.notes||""} onChange={e=>set("notes",e.target.value)} placeholder="Yêu cầu đặc biệt, packaging..." style={{...iSt,minHeight:60,resize:"vertical",boxSizing:"border-box"}}/></Rw>
      </Sec>
      <Sec title="Trạng thái"><Rw l="Status"><select value={f.status} onChange={e=>set("status",e.target.value)} style={iSt}>{RFQ_ST.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}</select></Rw></Sec>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><button onClick={()=>setModal(null)} style={gBtn}>Hủy</button><button onClick={()=>upsR(f)} style={pBtn}>Lưu RFQ</button></div>
    </Card>
  );
}

// ── RFQ DETAIL ──
function RFQDetail({r,ctx}){
  const {sups,setModal,upsR,delR,canEdit}=ctx;
  const st=RFQ_ST.find(x=>x.id===r.status)||RFQ_ST[0];
  const asgn=sups.filter(s=>r.sids?.includes(s.id));
  const urg=r.deadline&&new Date(r.deadline)<new Date(Date.now()+3*864e5);

  // format certs thành tags
  const certTags=(r.certs||"").split(/[,;•\n]+/).map(c=>c.trim()).filter(Boolean);

  return(
    <Card>
      {/* Header */}
      <div style={{marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:8}}>
          <span style={{fontSize:11,fontWeight:600,color:"#aaa",letterSpacing:.5}}>{r.code}</span>
          <div style={{display:"flex",gap:6,flexShrink:0}}>
            <span style={{fontSize:11,padding:"3px 10px",borderRadius:5,background:st.bg,color:st.c,fontWeight:600}}>{st.label}</span>
            {urg&&r.status!=="closed"&&<span style={{fontSize:11,padding:"3px 8px",borderRadius:5,background:"#FCEBEB",color:"#A32D2D",fontWeight:600}}>🔴 Gấp</span>}
          </div>
        </div>
        <h2 style={{margin:"0 0 6px",fontSize:15,fontWeight:600,lineHeight:1.5,color:"#1a1a1a"}}>{r.desc||"(Chưa mô tả)"}</h2>
        <div style={{display:"flex",gap:14,flexWrap:"wrap",fontSize:12,color:"#777"}}>
          {r.sales&&<span>👤 {r.sales}</span>}
          {r.markets?.length>0&&<span>🌍 {r.markets.join(", ")}</span>}
          {r.date&&<span>📥 Nhận: {r.date}</span>}
          {r.deadline&&<span style={{color:urg?"#A32D2D":"#777",fontWeight:urg?600:400}}>📅 Deadline: {r.deadline}</span>}
        </div>
      </div>

      {/* 3-col info strip */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:14}}>
        {[
          {l:"MOQ / Số lượng",v:r.qty},
          {l:"Giá mục tiêu",v:r.price},
          {l:"Incoterm",v:r.incoterm},
        ].map(x=>x.v?(
          <div key={x.l} style={{background:"#f8f8f8",borderRadius:8,padding:"10px 12px"}}>
            <div style={{fontSize:10,color:"#aaa",fontWeight:600,textTransform:"uppercase",letterSpacing:.8,marginBottom:4}}>{x.l}</div>
            <div style={{fontSize:13,fontWeight:500,color:"#1a1a1a"}}>{x.v}</div>
          </div>
        ):null)}
      </div>

      {/* Chứng chỉ yêu cầu — tags */}
      {certTags.length>0&&(
        <div style={{marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:600,color:"#aaa",textTransform:"uppercase",letterSpacing:.8,marginBottom:7}}>Chứng chỉ yêu cầu</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {certTags.map((c,i)=><span key={i} style={{fontSize:12,padding:"3px 10px",borderRadius:20,background:"#EAF3DE",color:"#3B6D11",fontWeight:500,border:"1px solid #C5DFA8"}}>{c}</span>)}
          </div>
        </div>
      )}

      {/* Ghi chú thêm — format đẹp */}
      {r.notes&&(
        <div style={{marginBottom:14,background:"#FAFAFA",border:"1px solid #eee",borderRadius:10,padding:"12px 16px"}}>
          <div style={{fontSize:11,fontWeight:600,color:"#aaa",textTransform:"uppercase",letterSpacing:.8,marginBottom:8}}>Ghi chú & Yêu cầu kỹ thuật</div>
          <div style={{fontSize:13,color:"#333",lineHeight:1.9,whiteSpace:"pre-wrap"}}>{r.notes}</div>
        </div>
      )}

      {/* NCC gán vào RFQ */}
      <div style={{marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:600,color:"#aaa",textTransform:"uppercase",letterSpacing:.8,marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span>NCC được gán ({asgn.length})</span>
          {canEdit&&<div style={{display:"flex",gap:6}}>
            <button onClick={()=>setModal({t:"rfq-assign",d:r})} style={{...gBtn,fontSize:11,padding:"3px 9px"}}>+ Gán từ DB</button>
            <button onClick={()=>setModal({t:"sup-form",d:{...newS(),source:"reactive"}})} style={{fontSize:11,padding:"3px 9px",borderRadius:5,border:"1px solid #534AB7",background:"none",color:"#534AB7",cursor:"pointer"}}>+ NCC mới</button>
          </div>}
        </div>
        {asgn.length===0&&<div style={{fontSize:13,color:"#bbb",padding:"8px 0"}}>Chưa có NCC. {canEdit?"Gán từ DB hoặc thêm mới.":""}</div>}
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {asgn.map(s=>{const ti=calcTier(s.vserf);const note=r.snotes?.[s.id]||"";return(
            <div key={s.id} style={{background:"#f8f8f8",border:"1px solid #eee",borderRadius:10,padding:"12px 14px",display:"flex",gap:10,alignItems:"flex-start"}}>
              <div style={{flex:1}}>
                <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginBottom:3}}>
                  <span style={{fontWeight:600,fontSize:13}}>{s.name}</span>
                  <span style={{fontSize:11,padding:"2px 8px",borderRadius:4,background:ti.bg,color:ti.c,fontWeight:600}}>{ti.label} · {ti.t}/45</span>
                  {s.bizModel&&<span style={{fontSize:11,padding:"2px 7px",borderRadius:4,background:"#f0f0f0",color:"#666"}}>{s.bizModel}</span>}
                </div>
                <div style={{fontSize:12,color:"#777"}}>{[s.products,s.province].filter(Boolean).join(" · ")}</div>
                {s.zalo&&<div style={{fontSize:12,color:"#777",marginTop:2}}>📱 {s.zalo}</div>}
                {canEdit
                  ?<input value={note} onChange={e=>upsR({...r,snotes:{...r.snotes,[s.id]:e.target.value}})} placeholder="Ghi chú báo giá, phản hồi NCC..." style={{...iSt,fontSize:12,marginTop:8,boxSizing:"border-box"}}/>
                  :note&&<div style={{fontSize:12,color:"#555",marginTop:6,padding:"6px 10px",background:"#fff",borderRadius:6,border:"1px solid #eee"}}>{note}</div>
                }
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:5,flexShrink:0}}>
                <button onClick={()=>setModal({t:"brief",d:s})} style={{fontSize:11,padding:"4px 10px",borderRadius:5,border:"none",background:"#185FA5",color:"#fff",cursor:"pointer",fontWeight:500}}>Brief</button>
                {canEdit&&<button onClick={()=>upsR({...r,sids:r.sids.filter(x=>x!==s.id)})} style={{fontSize:11,padding:"4px 10px",borderRadius:5,border:"1px solid #E24B4A",background:"none",color:"#E24B4A",cursor:"pointer"}}>Bỏ</button>}
              </div>
            </div>
          );})}
        </div>
      </div>

      {/* Footer actions */}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",paddingTop:12,borderTop:"1px solid #f0f0f0"}}>
        {canEdit&&<button onClick={()=>setModal({t:"rfq-form",d:r})} style={gBtn}>✏️ Sửa RFQ</button>}
        <div style={{display:"flex",gap:6,alignItems:"center",marginLeft:"auto"}}>
          <span style={{fontSize:12,color:"#aaa"}}>Trạng thái:</span>
          {canEdit
            ?<select value={r.status} onChange={e=>upsR({...r,status:e.target.value})} style={{...iSt,padding:"5px 8px",fontSize:12,width:"auto"}}>{RFQ_ST.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}</select>
            :<span style={{fontSize:12,padding:"4px 12px",borderRadius:5,background:st.bg,color:st.c,fontWeight:600}}>{st.label}</span>
          }
        </div>
        {canEdit&&<button onClick={()=>delR(r.id)} style={{...gBtn,color:"#E24B4A",borderColor:"#E24B4A"}}>Xóa</button>}
      </div>
    </Card>
  );
}

// ── RFQ ASSIGN ──
function RFQAssign({r,ctx}){
  const {sups,upsR,setModal}=ctx;
  const [sel,setSel]=useState(r.sids||[]);
  const [q,setQ]=useState("");
  const fl=sups.filter(s=>!q||[s.name,s.products,s.industry].some(v=>(v||"").toLowerCase().includes(q.toLowerCase())));
  const tog=id=>setSel(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  return(
    <Card>
      <h2 style={{margin:"0 0 10px",fontSize:15,fontWeight:600}}>Gán NCC vào {r.code}</h2>
      <div style={{fontSize:13,color:"#555",marginBottom:12,padding:"8px 12px",background:"#E6F1FB",borderRadius:6}}>📋 {r.desc||"—"} · {r.markets?.join(", ")||"—"} · {r.certs||"—"}</div>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Tìm NCC..." style={{...iSt,marginBottom:10,boxSizing:"border-box"}}/>
      <div style={{maxHeight:360,overflowY:"auto",display:"flex",flexDirection:"column",gap:6}}>
        {fl.map(s=>{const ti=calcTier(s.vserf);const chk=sel.includes(s.id);return(
          <div key={s.id} onClick={()=>tog(s.id)} style={{background:chk?"#f0faf6":"#fff",border:`1px solid ${chk?"#1D9E75":"#e5e5e5"}`,borderRadius:8,padding:"10px 12px",cursor:"pointer",display:"flex",gap:10,alignItems:"center"}}>
            <div style={{width:20,height:20,borderRadius:4,border:`2px solid ${chk?"#1D9E75":"#ccc"}`,background:chk?"#1D9E75":"none",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{chk&&<span style={{color:"#fff",fontSize:12,fontWeight:700}}>✓</span>}</div>
            <div style={{flex:1,minWidth:0}}><div style={{fontWeight:600,fontSize:13}}>{s.name}</div><div style={{fontSize:12,color:"#777"}}>{s.products} · {s.province}</div></div>
            <span style={{fontSize:11,padding:"2px 8px",borderRadius:4,background:ti.bg,color:ti.c,fontWeight:600,flexShrink:0}}>{ti.label} · {ti.t}/45</span>
          </div>
        );})}
      </div>
      <div style={{display:"flex",gap:8,justifyContent:"space-between",alignItems:"center",marginTop:12}}>
        <span style={{fontSize:13,color:"#777"}}>{sel.length} NCC được chọn</span>
        <div style={{display:"flex",gap:8}}><button onClick={()=>setModal(null)} style={gBtn}>Hủy</button><button onClick={()=>{upsR({...r,sids:sel,status:sel.length>0?"shortlisted":r.status});setModal(null);}} style={pBtn}>Lưu</button></div>
      </div>
    </Card>
  );
}

// ── DASHBOARD ──
function Dash({ctx}){
  const {sups,rfqs}=ctx;
  const ti={t1:0,t2:0,t3:0,nq:0};let tv=0,vc=0;
  sups.forEach(s=>{const t=calcTier(s.vserf);if(t.label==="Tier 1")ti.t1++;else if(t.label==="Tier 2")ti.t2++;else if(t.label==="Tier 3")ti.t3++;else ti.nq++;if(t.t>0){tv+=t.t;vc++;}});
  const av=vc?Math.round(tv/vc):0;const t12=sups.length?Math.round((ti.t1+ti.t2)/sups.length*100):0;
  const sc={};sups.forEach(s=>{sc[s.stage]=(sc[s.stage]||0)+1;});
  const ind={};sups.forEach(s=>{if(s.industry)ind[s.industry]=(ind[s.industry]||0)+1;});
  const kpis=[{l:"Tổng supplier",v:sups.length,t:"—",c:"#185FA5"},{l:"Tier 1+2",v:ti.t1+ti.t2,t:"≥40%",c:"#1D9E75"},{l:"Tỷ lệ T1+T2",v:t12+"%",t:"≥40%",c:t12>=40?"#1D9E75":"#E24B4A"},{l:"VSERF TB",v:av+"/45",t:"≥32/45",c:av>=32?"#1D9E75":"#E24B4A"},{l:"RFQ đang mở",v:rfqs.filter(r=>r.status!=="closed").length,t:"—",c:"#534AB7"},{l:"RFQ đã gửi Sales",v:rfqs.filter(r=>r.status==="sent").length,t:"—",c:"#854F0B"}];
  return(
    <div>
      <div style={{fontSize:15,fontWeight:600,marginBottom:14}}>Dashboard Management</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:8,marginBottom:14}}>
        {kpis.map(k=><div key={k.l} style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"14px 16px"}}><div style={{fontSize:11,color:"#aaa",marginBottom:4}}>{k.l}</div><div style={{fontSize:22,fontWeight:700,color:k.c}}>{k.v}</div><div style={{fontSize:10,color:"#ccc",marginTop:2}}>Mục tiêu: {k.t}</div></div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
        <div style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"1rem"}}>
          <div style={{fontSize:13,fontWeight:600,marginBottom:10}}>Phân bổ Tier</div>
          {[{l:"Tier 1 Export-Ready",v:ti.t1,c:"#1D9E75"},{l:"Tier 2 Nearly Ready",v:ti.t2,c:"#185FA5"},{l:"Tier 3 Developing",v:ti.t3,c:"#854F0B"},{l:"Not Qualified",v:ti.nq,c:"#A32D2D"}].map(r=><div key={r.l} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><div style={{width:8,height:8,borderRadius:2,background:r.c,flexShrink:0}}/><span style={{fontSize:12,color:"#777",flex:1}}>{r.l}</span><span style={{fontSize:13,fontWeight:600,color:r.c}}>{r.v}</span></div>)}
        </div>
        <div style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"1rem"}}>
          <div style={{fontSize:13,fontWeight:600,marginBottom:10}}>RFQ theo trạng thái</div>
          {RFQ_ST.map(st=>{const cnt=rfqs.filter(r=>r.status===st.id).length;return<div key={st.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><div style={{width:8,height:8,borderRadius:2,background:st.c,flexShrink:0}}/><span style={{fontSize:12,color:"#777",flex:1}}>{st.label}</span><span style={{fontSize:13,fontWeight:600,color:st.c}}>{cnt}</span></div>;})}
        </div>
      </div>
      <div style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"1rem",marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:600,marginBottom:10}}>Pipeline</div>
        {STAGES.map(st=>{const cnt=sc[st.id]||0;const max=Math.max(...Object.values(sc),1);return<div key={st.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}><span style={{fontSize:10,color:"#aaa",minWidth:22,flexShrink:0}}>{st.id}</span><span style={{fontSize:12,color:"#555",minWidth:140,flexShrink:0}}>{st.label.replace(st.id+" ","")}</span><div style={{flex:1,height:8,background:"#f0f0f0",borderRadius:4,overflow:"hidden"}}><div style={{height:"100%",width:(cnt/max*100)+"%",background:st.ph===1?"#9FE1CB":st.ph===2?"#B5D4F4":"#EEEDFE",borderRadius:4}}/></div><span style={{fontSize:12,fontWeight:600,minWidth:20,textAlign:"right",color:cnt>0?"#1a1a1a":"#ccc"}}>{cnt}</span></div>;})}
      </div>
      {Object.keys(ind).length>0&&<div style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"1rem"}}>
        <div style={{fontSize:13,fontWeight:600,marginBottom:8}}>Ngành hàng</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>{Object.entries(ind).sort((a,b)=>b[1]-a[1]).map(([i,c])=><div key={i} style={{padding:"4px 12px",borderRadius:20,background:"#f5f5f5",fontSize:12,color:"#555"}}>{i} <b style={{color:"#1a1a1a"}}>{c}</b></div>)}</div>
      </div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
