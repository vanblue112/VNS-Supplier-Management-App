<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VinaSources Supplier App</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0f0}
:root{
  --color-background-primary:#ffffff;
  --color-background-secondary:#f8f8f8;
  --color-background-tertiary:#f0f0f0;
  --color-text-primary:#1a1a1a;
  --color-text-secondary:#555555;
  --color-text-tertiary:#999999;
  --color-border-tertiary:rgba(0,0,0,0.12);
  --color-border-secondary:rgba(0,0,0,0.2);
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --border-radius-md:8px;
  --border-radius-lg:12px;
}
input,select,textarea,button{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
// ── storage polyfill ──
window.storage = {
  get: async k => { try { const v=localStorage.getItem(k); return v?{key:k,value:v}:null; } catch{return null;} },
  set: async (k,v) => { try { localStorage.setItem(k,v); return {key:k,value:v}; } catch{return null;} },
  delete: async k => { try { localStorage.removeItem(k); return {key:k,deleted:true}; } catch{return null;} },
  list: async p => { try { const keys=Object.keys(localStorage).filter(k=>!p||k.startsWith(p)); return {keys}; } catch{return{keys:[]};} }
};

const {useState,useEffect,useCallback} = React;

const INDUSTRIES=["Dệt may","Giày dép","Thực phẩm / FMCG","Cà phê / Nông sản","Điện tử / Cơ khí","Gỗ / Nội thất","Nhựa / Bao bì","Thủ công mỹ nghệ","Khác"];
const PROVINCES=["Hà Nội","TP. Hồ Chí Minh","Hải Phòng","Đà Nẵng","Cần Thơ","An Giang","Bà Rịa - Vũng Tàu","Bắc Giang","Bắc Kạn","Bạc Liêu","Bắc Ninh","Bến Tre","Bình Định","Bình Dương","Bình Phước","Bình Thuận","Cà Mau","Cao Bằng","Đắk Lắk","Đắk Nông","Điện Biên","Đồng Nai","Đồng Tháp","Gia Lai","Hà Giang","Hà Nam","Hà Tĩnh","Hải Dương","Hậu Giang","Hòa Bình","Hưng Yên","Khánh Hòa","Kiên Giang","Kon Tum","Lai Châu","Lâm Đồng","Lạng Sơn","Lào Cai","Long An","Nam Định","Nghệ An","Ninh Bình","Ninh Thuận","Phú Thọ","Phú Yên","Quảng Bình","Quảng Nam","Quảng Ngãi","Quảng Ninh","Quảng Trị","Sóc Trăng","Sơn La","Tây Ninh","Thái Bình","Thái Nguyên","Thanh Hóa","Thừa Thiên Huế","Tiền Giang","Trà Vinh","Tuyên Quang","Vĩnh Long","Vĩnh Phúc","Yên Bái"];
const CHANNELS=["Referral / Network","Triển lãm (HAWA, VietnamExpo...)","Outbound / LinkedIn","Alibaba / Global Sources","Google / Directory ngành"];
const BUSINESS_TYPES=["Manufacturer","Wholesaler","Trader","Service Provider","Manufacturer + Trader","Khác"];
const MARKETS=["EU","US","Nhật Bản","Hàn Quốc","Úc","Canada","UK","Trung Đông","ASEAN","Khác"];
const STAGES=[
  {id:"B1",label:"B1 Xác định ngành",phase:1},{id:"B2",label:"B2 Longlist",phase:1},{id:"B3",label:"B3 Pre-score",phase:1},
  {id:"B4",label:"B4 Liên hệ",phase:2},{id:"B5",label:"B5 Thu hồ sơ",phase:2},{id:"B6",label:"B6 Chấm VSERF",phase:2},{id:"B7",label:"B7 Xác minh",phase:2},
  {id:"B8",label:"B8 Chuẩn hóa",phase:3},{id:"B9",label:"B9 Onboard",phase:3},{id:"B10",label:"B10 Kích hoạt RFQ",phase:3},{id:"B11",label:"B11 Theo dõi",phase:3},
];
const RFQ_STATUSES=[
  {id:"new",label:"Mới nhận",color:"#185FA5",bg:"#E6F1FB"},
  {id:"searching",label:"Đang tìm NCC",color:"#854F0B",bg:"#FAEEDA"},
  {id:"shortlisted",label:"Đã shortlist",color:"#534AB7",bg:"#EEEDFE"},
  {id:"sent",label:"Đã gửi Sales",color:"#1D9E75",bg:"#EAF3DE"},
  {id:"closed",label:"Closed",color:"#888",bg:"#F0F0F0"},
];
const VSERF_COLS=[
  {id:"phap_ly",label:"01 Pháp lý",desc:"Giấy phép KD, MST, hồ sơ ngành nghề XK đầy đủ"},
  {id:"san_xuat",label:"02 Sản xuất",desc:"Nhà xưởng riêng, công suất ≥ MOQ buyer, máy móc đủ"},
  {id:"chat_luong",label:"03 Chất lượng",desc:"ISO 9001 hoặc tương đương, QC nội bộ 3 lớp"},
  {id:"xuat_khau",label:"04 Xuất khẩu",desc:"Đã XK ≥ 2 năm, thông thạo Incoterms FOB/CIF"},
  {id:"chung_tu",label:"05 Chứng từ",desc:"Tự lập CO, packing list, invoice EN; HS code đúng"},
  {id:"rfq",label:"06 Phản hồi RFQ",desc:"Trả lời ≤24h; báo giá có cost breakdown rõ"},
  {id:"oem_odm",label:"07 OEM/ODM",desc:"Có R&D; làm mẫu 7–10 ngày; tùy chỉnh theo buyer"},
  {id:"giao_tiep",label:"08 Giao tiếp",desc:"Sales tiếng Anh B2+; email/Zoom không cần phiên dịch"},
  {id:"minh_bach",label:"09 Minh bạch",desc:"Sẵn sàng buyer visit, factory audit, factory video"},
];

const calcTier=v=>{
  const t=Object.values(v||{}).reduce((a,b)=>a+(b||0),0);
  if((v.phap_ly||0)<3||(v.san_xuat||0)<3)return{tier:"Not Qualified",color:"#A32D2D",bg:"#FCEBEB",total:t};
  if(t>=38)return{tier:"Tier 1 — Export-Ready",color:"#3B6D11",bg:"#EAF3DE",total:t};
  if(t>=27)return{tier:"Tier 2 — Nearly Ready",color:"#185FA5",bg:"#E6F1FB",total:t};
  if(t>=18)return{tier:"Tier 3 — Developing",color:"#854F0B",bg:"#FAEEDA",total:t};
  return{tier:"Not Qualified",color:"#A32D2D",bg:"#FCEBEB",total:t};
};
const calcPerf=p=>{
  const w={qc:.3,delivery:.25,comm:.2,price:.15,flex:.1};
  const s=((p.qc||0)*w.qc+(p.delivery||0)*w.delivery+(p.comm||0)*w.comm+(p.price||0)*w.price+(p.flex||0)*w.flex)/5*100;
  if(s>=85)return{label:"Preferred",color:"#3B6D11",bg:"#EAF3DE",score:Math.round(s)};
  if(s>=65)return{label:"Active",color:"#185FA5",bg:"#E6F1FB",score:Math.round(s)};
  if(s>=45)return{label:"Probation",color:"#854F0B",bg:"#FAEEDA",score:Math.round(s)};
  return{label:"Inactive",color:"#A32D2D",bg:"#FCEBEB",score:Math.round(s)};
};
const emptyS=()=>({id:Date.now()+"_s",name:"",bizType:"",industry:"",products:"",foundedYear:"",province:"",website:"",contactName:"",zalo:"",email:"",channel:"",stage:"B1",notes:"",specialNotes:"",certs:"",capacity:"",moq:"",priceRange:"",leadTime:"",incoterm:"",serviceModel:"",paymentMethod:"",vserf:{phap_ly:0,san_xuat:0,chat_luong:0,xuat_khau:0,chung_tu:0,rfq:0,oem_odm:0,giao_tiep:0,minh_bach:0},perf:{qc:0,delivery:0,comm:0,price:0,flex:0},source:"proactive",createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
const emptyR=()=>({id:Date.now()+"_r",rfqCode:"RFQ-"+Date.now().toString().slice(-5),salesPerson:"",receivedDate:new Date().toISOString().slice(0,10),productDesc:"",buyerMarket:[],deadline:"",moqQty:"",certRequirements:"",priceTarget:"",incoterm:"",additionalNotes:"",status:"new",supplierIds:[],supplierNotes:{},createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});

const SK_S="vns_suppliers_v2",SK_R="vns_rfqs_v1";
const storeGet=async k=>{try{const r=await window.storage.get(k);return r?JSON.parse(r.value):null;}catch{return null;}};
const storeSet=async(k,v)=>{try{await window.storage.set(k,JSON.stringify(v));}catch{}};

const iSt={padding:"7px 10px",borderRadius:6,border:"0.5px solid var(--color-border-secondary)",background:"var(--color-background-primary)",color:"var(--color-text-primary)",fontSize:13,width:"100%"};
const gBtn={padding:"7px 14px",borderRadius:6,border:"0.5px solid var(--color-border-secondary)",background:"none",cursor:"pointer",fontSize:13,color:"var(--color-text-secondary)"};
const pBtn={padding:"7px 18px",borderRadius:6,border:"none",background:"#1D9E75",color:"#fff",cursor:"pointer",fontSize:13,fontWeight:500};

function Card({children}){return <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:12,padding:"1.4rem"}}>{children}</div>;}
function Sec({title,children}){return <div style={{marginBottom:"1.1rem"}}><div style={{fontSize:11,fontWeight:500,color:"var(--color-text-tertiary)",textTransform:"uppercase",letterSpacing:1,marginBottom:7,borderBottom:"0.5px solid var(--color-border-tertiary)",paddingBottom:4}}>{title}</div><div style={{display:"grid",gap:7}}>{children}</div></div>;}
function Rw({l,children}){return <div style={{display:"grid",gridTemplateColumns:"130px 1fr",gap:8,alignItems:"start"}}><span style={{fontSize:13,color:"var(--color-text-secondary)",paddingTop:8}}>{l}</span><div>{children}</div></div>;}
function IB({title,children}){return <div><div style={{fontSize:11,fontWeight:500,color:"var(--color-text-tertiary)",marginBottom:5}}>{title}</div>{children}</div>;}
function IR({l,v}){return <div style={{display:"flex",gap:8,fontSize:13,padding:"2px 0"}}><span style={{color:"var(--color-text-secondary)",minWidth:75}}>{l}</span><span style={{flex:1}}>{v||<span style={{color:"var(--color-text-tertiary)"}}>—</span>}</span></div>;}
function Sel({value,onChange,opts}){return <select value={value} onChange={e=>onChange(e.target.value)} style={{padding:"7px 10px",borderRadius:6,border:"0.5px solid var(--color-border-secondary)",background:"var(--color-background-primary)",color:"var(--color-text-primary)",fontSize:13}}>{opts.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select>;}
function Empty({text}){return <div style={{textAlign:"center",padding:"2.5rem",color:"var(--color-text-secondary)",fontSize:13}}>{text}</div>;}
function ModalWrap({children,onClose}){return <div style={{position:"fixed",inset:0,background:"#0007",zIndex:1000,display:"flex",alignItems:"flex-start",justifyContent:"center",overflowY:"auto",padding:"1rem"}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}><div style={{width:"100%",maxWidth:720,marginTop:"2rem",marginBottom:"2rem"}} onClick={e=>e.stopPropagation()}>{children}</div></div>;}

function App(){
  const [tab,setTab]=useState("list");
  const [suppliers,setSuppliers]=useState([]);
  const [rfqs,setRfqs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(null);
  const [toast,setToast]=useState(null);

  useEffect(()=>{Promise.all([storeGet(SK_S),storeGet(SK_R)]).then(([s,r])=>{setSuppliers(s||[]);setRfqs(r||[]);setLoading(false);});},[]);

  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(null),2400);};
  const saveSup=useCallback(async l=>{setSuppliers(l);await storeSet(SK_S,l);},[]);
  const saveRfq=useCallback(async l=>{setRfqs(l);await storeSet(SK_R,l);},[]);

  const upsertS=async s=>{const u={...s,updatedAt:new Date().toISOString()};const i=suppliers.findIndex(x=>x.id===u.id);const n=i>=0?suppliers.map((x,j)=>j===i?u:x):[u,...suppliers];await saveSup(n);showToast(i>=0?"Đã cập nhật":"Đã thêm supplier mới");setModal(null);};
  const delS=async id=>{if(!confirm("Xóa supplier này?"))return;await saveSup(suppliers.filter(x=>x.id!==id));setModal(null);showToast("Đã xóa");};
  const upsertR=async r=>{const u={...r,updatedAt:new Date().toISOString()};const i=rfqs.findIndex(x=>x.id===u.id);const n=i>=0?rfqs.map((x,j)=>j===i?u:x):[u,...rfqs];await saveRfq(n);showToast(i>=0?"Đã cập nhật RFQ":"Đã tạo RFQ mới");setModal(null);};
  const delR=async id=>{if(!confirm("Xóa RFQ này?"))return;await saveRfq(rfqs.filter(x=>x.id!==id));setModal(null);showToast("Đã xóa RFQ");};

  if(loading)return <div style={{padding:"2rem",fontSize:14,color:"#666"}}>Đang tải...</div>;
  const ctx={suppliers,rfqs,upsertS,delS,upsertR,delR,modal,setModal,showToast};

  return (
    <div style={{fontFamily:"var(--font-sans)",minHeight:"100vh",background:"var(--color-background-tertiary)"}}>
      {toast&&<div style={{position:"fixed",top:14,right:14,background:"#1D9E75",color:"#fff",padding:"9px 18px",borderRadius:8,fontSize:13,zIndex:9999,fontWeight:500}}>{toast}</div>}
      <div style={{background:"var(--color-background-primary)",borderBottom:"0.5px solid var(--color-border-tertiary)",padding:"0 1rem"}}>
        <div style={{maxWidth:920,margin:"0 auto",display:"flex",alignItems:"center",gap:4}}>
          <span style={{fontWeight:600,fontSize:14,color:"#1D9E75",paddingRight:12,borderRight:"0.5px solid var(--color-border-tertiary)",marginRight:4}}>🏭 VinaSources</span>
          {[{id:"list",label:"Supplier DB"},{id:"rfq",label:"RFQ Tracking"},{id:"dashboard",label:"Dashboard"}].map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{background:"none",border:"none",padding:"12px 10px",fontSize:13,cursor:"pointer",color:tab===t.id?"var(--color-text-primary)":"var(--color-text-secondary)",borderBottom:tab===t.id?"2px solid #1D9E75":"2px solid transparent",fontWeight:tab===t.id?500:400,position:"relative"}}>
              {t.label}
              {t.id==="rfq"&&rfqs.filter(r=>r.status==="new"||r.status==="searching").length>0&&<span style={{position:"absolute",top:6,right:0,background:"#E24B4A",color:"#fff",fontSize:10,fontWeight:700,borderRadius:8,padding:"0 5px"}}>{rfqs.filter(r=>r.status==="new"||r.status==="searching").length}</span>}
            </button>
          ))}
          <div style={{flex:1}}/>
          <button onClick={()=>setModal({type:"rfq-form",data:emptyR()})} style={{padding:"6px 12px",borderRadius:6,border:"0.5px solid #185FA5",background:"none",color:"#185FA5",fontSize:12,cursor:"pointer",fontWeight:500,marginRight:6}}>+ RFQ mới</button>
          <button onClick={()=>setModal({type:"sup-form",data:emptyS()})} style={{padding:"6px 12px",borderRadius:6,border:"none",background:"#1D9E75",color:"#fff",fontSize:12,cursor:"pointer",fontWeight:500}}>+ Supplier</button>
        </div>
      </div>
      <div style={{maxWidth:920,margin:"0 auto",padding:"1rem"}}>
        {tab==="list"&&<SupList ctx={ctx}/>}
        {tab==="rfq"&&<RFQList ctx={ctx}/>}
        {tab==="dashboard"&&<Dash ctx={ctx}/>}
      </div>
      {modal?.type==="sup-form"&&<ModalWrap onClose={()=>setModal(null)}><SupForm s={modal.data} ctx={ctx}/></ModalWrap>}
      {modal?.type==="sup-detail"&&<ModalWrap onClose={()=>setModal(null)}><SupDetail s={modal.data} ctx={ctx}/></ModalWrap>}
      {modal?.type==="scoring"&&<ModalWrap onClose={()=>setModal(null)}><Scoring s={modal.data} ctx={ctx}/></ModalWrap>}
      {modal?.type==="brief"&&<ModalWrap onClose={()=>setModal(null)}><Brief s={modal.data} ctx={ctx}/></ModalWrap>}
      {modal?.type==="rfq-form"&&<ModalWrap onClose={()=>setModal(null)}><RFQForm r={modal.data} ctx={ctx}/></ModalWrap>}
      {modal?.type==="rfq-detail"&&<ModalWrap onClose={()=>setModal(null)}><RFQDetail r={modal.data} ctx={ctx}/></ModalWrap>}
      {modal?.type==="rfq-assign"&&<ModalWrap onClose={()=>setModal(null)}><RFQAssign r={modal.data} ctx={ctx}/></ModalWrap>}
    </div>
  );
}

function SupList({ctx}){
  const {suppliers,setModal}=ctx;
  const [q,setQ]=useState(""),[fT,setFT]=useState("all"),[fI,setFI]=useState("all"),[fS,setFS]=useState("all");
  const inds=[...new Set(suppliers.map(s=>s.industry).filter(Boolean))];
  const fl=suppliers.filter(s=>{
    const t=calcTier(s.vserf);
    return (fT==="all"||t.tier.startsWith(fT))&&(fI==="all"||s.industry===fI)&&(fS==="all"||s.stage===fS)&&(!q||[s.name,s.products,s.province,s.industry].some(v=>(v||"").toLowerCase().includes(q.toLowerCase())));
  });
  const exportCSV=()=>{
    const h=["Tên","Ngành","Sản phẩm","Tỉnh/TP","Website","Contact","Zalo","Email","Stage","Tier","VSERF","Lưu ý đặc biệt"];
    const rows=fl.map(s=>{const t=calcTier(s.vserf);return[s.name,s.industry,s.products,s.province,s.website,s.contactName,s.zalo,s.email,s.stage,t.tier,t.total,s.specialNotes].map(v=>`"${(v||"").replace(/"/g,'""')}"`).join(",");});
    const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,\uFEFF"+encodeURIComponent([h.join(","),...rows].join("\n"));a.download="VinaSources.csv";a.click();
  };
  return (
    <div>
      <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Tìm tên, sản phẩm, tỉnh..." style={iSt}/>
        <Sel value={fT} onChange={setFT} opts={[["all","Tất cả Tier"],["Tier 1","Tier 1"],["Tier 2","Tier 2"],["Tier 3","Tier 3"],["Not","Not Qualified"]]}/>
        <Sel value={fI} onChange={setFI} opts={[["all","Tất cả ngành"],...inds.map(i=>[i,i])]}/>
        <Sel value={fS} onChange={setFS} opts={[["all","Tất cả Stage"],...STAGES.map(s=>[s.id,s.label])]}/>
        <button onClick={exportCSV} style={gBtn}>⬇ CSV</button>
      </div>
      <div style={{fontSize:12,color:"var(--color-text-tertiary)",marginBottom:8}}>{fl.length} supplier</div>
      {fl.length===0&&<Empty text="Chưa có supplier. Nhấn + Supplier để thêm."/>}
      <div style={{display:"flex",flexDirection:"column",gap:7}}>
        {fl.map(s=>{const t=calcTier(s.vserf);const st=STAGES.find(x=>x.id===s.stage);return(
          <div key={s.id} onClick={()=>setModal({type:"sup-detail",data:s})} style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:10,padding:"11px 14px",display:"flex",alignItems:"center",gap:10,cursor:"pointer"}}>
            <div style={{width:34,height:34,borderRadius:8,background:t.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,flexShrink:0}}>{t.tier.startsWith("Tier 1")?"🥇":t.tier.startsWith("Tier 2")?"🥈":t.tier.startsWith("Tier 3")?"🥉":"✕"}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:500,fontSize:13,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.name||<span style={{color:"var(--color-text-tertiary)"}}>Chưa đặt tên</span>}</div>
              <div style={{fontSize:12,color:"var(--color-text-secondary)"}}>{[s.industry,s.province,s.products].filter(Boolean).join(" · ")}</div>
            </div>
            {s.source==="reactive"&&<span style={{fontSize:10,padding:"2px 6px",borderRadius:4,background:"#EEEDFE",color:"#534AB7",fontWeight:500,flexShrink:0}}>RFQ</span>}
            <span style={{fontSize:11,padding:"2px 8px",borderRadius:4,background:t.bg,color:t.color,fontWeight:500,flexShrink:0}}>{t.tier.split("—")[0].trim()}</span>
            <span style={{fontSize:11,padding:"2px 7px",borderRadius:4,background:"var(--color-background-secondary)",color:"var(--color-text-secondary)",flexShrink:0}}>{st?.id}</span>
            <span style={{fontSize:12,color:"var(--color-text-tertiary)",minWidth:32,textAlign:"right",flexShrink:0}}>{t.total}/45</span>
          </div>
        );})}
      </div>
    </div>
  );
}

function SupDetail({s,ctx}){
  const {setModal,delS}=ctx;
  const t=calcTier(s.vserf);const p=calcPerf(s.perf);
  return(
    <Card>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8,marginBottom:14}}>
        <div><h2 style={{margin:0,fontSize:17,fontWeight:500}}>{s.name||"(Chưa có tên)"}</h2><div style={{fontSize:13,color:"var(--color-text-secondary)",marginTop:3}}>{s.industry} · {s.province}</div></div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <span style={{fontSize:12,padding:"3px 10px",borderRadius:5,background:t.bg,color:t.color,fontWeight:500}}>{t.tier} · {t.total}/45</span>
          {s.perf?.qc>0&&<span style={{fontSize:12,padding:"3px 10px",borderRadius:5,background:p.bg,color:p.color,fontWeight:500}}>{p.label} · {p.score}%</span>}
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"1rem",marginBottom:12}}>
        <IB title="Thông tin cơ bản">
          <IR l="Loại hình KD" v={s.bizType}/>
          <IR l="Sản phẩm" v={s.products}/>
          <IR l="Năm thành lập" v={s.foundedYear}/>
          <IR l="Website" v={s.website}/>
          <IR l="Kênh" v={s.channel}/>
          <IR l="Stage" v={STAGES.find(x=>x.id===s.stage)?.label||s.stage}/>
        </IB>
        <IB title="Đầu mối liên hệ"><IR l="Tên" v={s.contactName}/><IR l="Zalo/SĐT" v={s.zalo}/><IR l="Email" v={s.email}/></IB>
        <IB title="Năng lực">
          <IR l="Chứng nhận" v={s.certs}/>

function Scoring({s,ctx}){
  const {upsertS,setModal}=ctx;

        <span style={{fontWeight:600,color:t.color,fontSize:18}}>{t.total} / 45</span>
      </div>
      {VSERF_COLS.map(c=>{const v=sc[c.id]||0;const warn=(c.id==="phap_ly"||c.id==="san_xuat")&&v<3;return(

          <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontWeight:500,fontSize:13,color:warn?"#A32D2D":"var(--color-text-primary)"}}>{c.label}</span><span style={{fontWeight:500,fontSize:14,color:warn?"#A32D2D":"var(--color-text-primary)"}}>{v}/5</span></div>

        <span style={{fontSize:12,padding:"4px 12px",borderRadius:5,background:st.bg,color:st.color,fontWeight:500}}>{st.label}</span>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"1rem",marginBottom:14}}>
        <IB title="Yêu cầu"><IR l="Thị trường" v={r.buyerMarket?.join(", ")}/><IR l="MOQ / SL" v={r.moqQty}/><IR l="Giá mục tiêu" v={r.priceTarget}/><IR l="Chứng chỉ" v={r.certRequirements}/></IB>
        <IB title="Timeline"><IR l="Ngày nhận" v={r.receivedDate}/><IR l="Deadline" v={r.deadline}/></IB>
      </div>
      <div style={{marginBottom:12}}>
        <div style={{fontSize:12,fontWeight:500,color:"var(--color-text-tertiary)",textTransform:"uppercase",letterSpacing:1,marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span>NCC được gán ({assigned.length})</span>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>setModal({type:"rfq-assign",data:r})} style={{...gBtn,fontSize:11,padding:"3px 8px"}}>+ Gán NCC từ DB</button>
            <button onClick={()=>setModal({type:"sup-form",data:{...emptyS(),source:"reactive"}})} style={{fontSize:11,padding:"3px 8px",borderRadius:5,border:"0.5px solid #534AB7",background:"none",color:"#534AB7",cursor:"pointer"}}>+ NCC mới</button>
          </div>
        </div>
        {assigned.length===0&&<div style={{fontSize:13,color:"var(--color-text-tertiary)",padding:"10px 0"}}>Chưa có NCC. Gán từ DB hoặc thêm mới.</div>}
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {assigned.map(s=>{const t=calcTier(s.vserf);const note=r.supplierNotes?.[s.id]||"";return(
            <div key={s.id} style={{background:"var(--color-background-secondary)",borderRadius:8,padding:"10px 12px",display:"flex",gap:10,alignItems:"flex-start"}}>
              <div style={{flex:1}}>
                <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}><span style={{fontWeight:500,fontSize:13}}>{s.name}</span><span style={{fontSize:11,padding:"1px 7px",borderRadius:4,background:t.bg,color:t.color,fontWeight:500}}>{t.tier.split("—")[0].trim()} · {t.total}/45</span></div>
                <div style={{fontSize:12,color:"var(--color-text-secondary)",marginTop:2}}>{s.products} · {s.province}</div>
                {s.zalo&&<div style={{fontSize:12,color:"var(--color-text-secondary)"}}>📱 {s.zalo}</div>}
                <input value={note} onChange={e=>{upsertR({...r,supplierNotes:{...r.supplierNotes,[s.id]:e.target.value}});}} placeholder="Ghi chú báo giá, phản hồi..." style={{...iSt,fontSize:12,marginTop:6,boxSizing:"border-box"}}/>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:4,flexShrink:0}}>
                <button onClick={()=>setModal({type:"brief",data:s})} style={{fontSize:11,padding:"3px 8px",borderRadius:5,border:"none",background:"#185FA5",color:"#fff",cursor:"pointer"}}>Brief</button>
                <button onClick={()=>upsertR({...r,supplierIds:r.supplierIds.filter(x=>x!==s.id)})} style={{fontSize:11,padding:"3px 8px",borderRadius:5,border:"0.5px solid #E24B4A",background:"none",color:"#E24B4A",cursor:"pointer"}}>Bỏ</button>
              </div>
            </div>
          );})}
        </div>
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        <button onClick={()=>setModal({type:"rfq-form",data:r})} style={gBtn}>Sửa RFQ</button>
        <div style={{display:"flex",gap:6,alignItems:"center",marginLeft:"auto"}}>
          <span style={{fontSize:12,color:"var(--color-text-secondary)"}}>Trạng thái:</span>
          <select value={r.status} onChange={e=>upsertR({...r,status:e.target.value})} style={{...iSt,padding:"4px 8px",fontSize:12,width:"auto"}}>{RFQ_STATUSES.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}</select>
        </div>
        <button onClick={()=>delR(r.id)} style={{...gBtn,color:"#E24B4A",borderColor:"#E24B4A"}}>Xóa</button>
      </div>
    </Card>
  );
}

function RFQAssign({r,ctx}){
  const {suppliers,upsertR,setModal}=ctx;
  const [sel,setSel]=useState(r.supplierIds||[]);
  const [q,setQ]=useState("");
  const fl=suppliers.filter(s=>!q||[s.name,s.products,s.industry].some(v=>(v||"").toLowerCase().includes(q.toLowerCase())));
  const tog=id=>setSel(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  return(
    <Card>
      <h2 style={{margin:"0 0 10px",fontSize:15,fontWeight:500}}>Gán NCC vào {r.rfqCode}</h2>
      <div style={{fontSize:13,color:"var(--color-text-secondary)",marginBottom:12,padding:"8px 12px",background:"#E6F1FB",borderRadius:6}}>📋 {r.productDesc||"—"} · {r.buyerMarket?.join(", ")||"—"} · {r.certRequirements||"—"}</div>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Tìm NCC..." style={{...iSt,marginBottom:10,boxSizing:"border-box"}}/>
      <div style={{maxHeight:380,overflowY:"auto",display:"flex",flexDirection:"column",gap:6}}>
        {fl.map(s=>{const t=calcTier(s.vserf);const chk=sel.includes(s.id);return(
          <div key={s.id} onClick={()=>tog(s.id)} style={{background:chk?"var(--color-background-secondary)":"var(--color-background-primary)",border:`0.5px solid ${chk?"#1D9E75":"var(--color-border-tertiary)"}`,borderRadius:8,padding:"10px 12px",cursor:"pointer",display:"flex",gap:10,alignItems:"center"}}>
            <div style={{width:18,height:18,borderRadius:4,border:`2px solid ${chk?"#1D9E75":"#ccc"}`,background:chk?"#1D9E75":"none",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{chk&&<span style={{color:"#fff",fontSize:11,lineHeight:1}}>✓</span>}</div>
            <div style={{flex:1,minWidth:0}}><div style={{fontWeight:500,fontSize:13}}>{s.name}</div><div style={{fontSize:12,color:"var(--color-text-secondary)"}}>{s.products} · {s.province}</div></div>
            <span style={{fontSize:11,padding:"2px 7px",borderRadius:4,background:t.bg,color:t.color,fontWeight:500,flexShrink:0}}>{t.tier.split("—")[0].trim()} · {t.total}/45</span>
          </div>
        );})}
      </div>
      <div style={{display:"flex",gap:8,justifyContent:"space-between",alignItems:"center",marginTop:12}}>
        <span style={{fontSize:13,color:"var(--color-text-secondary)"}}>{sel.length} NCC được chọn</span>
        <div style={{display:"flex",gap:8}}><button onClick={()=>setModal(null)} style={gBtn}>Hủy</button><button onClick={()=>{upsertR({...r,supplierIds:sel,status:sel.length>0?"shortlisted":r.status});setModal(null);}} style={pBtn}>Lưu & cập nhật RFQ</button></div>
      </div>
    </Card>
  );
}

function Dash({ctx}){
  const {suppliers,rfqs}=ctx;
  const tiers={t1:0,t2:0,t3:0,nq:0};let tv=0,vc=0;
  suppliers.forEach(s=>{const t=calcTier(s.vserf);if(t.tier.startsWith("Tier 1"))tiers.t1++;else if(t.tier.startsWith("Tier 2"))tiers.t2++;else if(t.tier.startsWith("Tier 3"))tiers.t3++;else tiers.nq++;if(t.total>0){tv+=t.total;vc++;}});
  const av=vc?Math.round(tv/vc):0;const t12=suppliers.length?Math.round((tiers.t1+tiers.t2)/suppliers.length*100):0;
  const sc={};suppliers.forEach(s=>{sc[s.stage]=(sc[s.stage]||0)+1;});
  const ind={};suppliers.forEach(s=>{if(s.industry)ind[s.industry]=(ind[s.industry]||0)+1;});
  const kpis=[{l:"Tổng supplier",v:suppliers.length,t:"—",c:"#185FA5"},{l:"Tier 1+2",v:tiers.t1+tiers.t2,t:"≥40%",c:"#1D9E75"},{l:"Tỷ lệ T1+T2",v:t12+"%",t:"≥40%",c:t12>=40?"#1D9E75":"#E24B4A"},{l:"VSERF TB",v:av+"/45",t:"≥32/45",c:av>=32?"#1D9E75":"#E24B4A"},{l:"RFQ đang mở",v:rfqs.filter(r=>r.status!=="closed").length,t:"—",c:"#534AB7"},{l:"RFQ đã gửi Sales",v:rfqs.filter(r=>r.status==="sent").length,t:"—",c:"#854F0B"}];
  return(
    <div>
      <div style={{fontSize:15,fontWeight:500,marginBottom:12}}>Dashboard Management</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:8,marginBottom:14}}>{kpis.map(k=><div key={k.l} style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:10,padding:"12px 14px"}}><div style={{fontSize:11,color:"var(--color-text-secondary)",marginBottom:3}}>{k.l}</div><div style={{fontSize:20,fontWeight:500,color:k.c}}>{k.v}</div><div style={{fontSize:10,color:"var(--color-text-tertiary)"}}>Mục tiêu: {k.t}</div></div>)}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
        <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:10,padding:"1rem"}}><div style={{fontSize:13,fontWeight:500,marginBottom:10}}>Phân bổ Tier</div>{[{l:"Tier 1 Export-Ready",v:tiers.t1,c:"#1D9E75"},{l:"Tier 2 Nearly Ready",v:tiers.t2,c:"#185FA5"},{l:"Tier 3 Developing",v:tiers.t3,c:"#854F0B"},{l:"Not Qualified",v:tiers.nq,c:"#A32D2D"}].map(r=><div key={r.l} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><div style={{width:8,height:8,borderRadius:2,background:r.c,flexShrink:0}}/><span style={{fontSize:12,color:"var(--color-text-secondary)",flex:1}}>{r.l}</span><span style={{fontSize:13,fontWeight:500,color:r.c}}>{r.v}</span></div>)}</div>
        <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:10,padding:"1rem"}}><div style={{fontSize:13,fontWeight:500,marginBottom:10}}>RFQ theo trạng thái</div>{RFQ_STATUSES.map(st=>{const cnt=rfqs.filter(r=>r.status===st.id).length;return<div key={st.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><div style={{width:8,height:8,borderRadius:2,background:st.color,flexShrink:0}}/><span style={{fontSize:12,color:"var(--color-text-secondary)",flex:1}}>{st.label}</span><span style={{fontSize:13,fontWeight:500,color:st.color}}>{cnt}</span></div>;})}</div>
      </div>
      <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:10,padding:"1rem",marginBottom:12}}><div style={{fontSize:13,fontWeight:500,marginBottom:10}}>Pipeline</div>{STAGES.map(st=>{const cnt=sc[st.id]||0;const max=Math.max(...Object.values(sc),1);return<div key={st.id} style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}><span style={{fontSize:10,color:"var(--color-text-tertiary)",minWidth:22}}>{st.id}</span><div style={{flex:1,height:8,background:"var(--color-background-secondary)",borderRadius:4,overflow:"hidden"}}><div style={{height:"100%",width:(cnt/max*100)+"%",background:st.phase===1?"#9FE1CB":st.phase===2?"#B5D4F4":"#EEEDFE",borderRadius:4}}/></div><span style={{fontSize:12,fontWeight:500,minWidth:18,textAlign:"right"}}>{cnt}</span></div>;})}</div>
      {Object.keys(ind).length>0&&<div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:10,padding:"1rem"}}><div style={{fontSize:13,fontWeight:500,marginBottom:8}}>Ngành hàng</div><div style={{display:"flex",flexWrap:"wrap",gap:6}}>{Object.entries(ind).sort((a,b)=>b[1]-a[1]).map(([i,c])=><div key={i} style={{padding:"4px 10px",borderRadius:16,background:"var(--color-background-secondary)",fontSize:12,color:"var(--color-text-secondary)"}}>{i} <b style={{color:"var(--color-text-primary)"}}>{c}</b></div>)}</div></div>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
