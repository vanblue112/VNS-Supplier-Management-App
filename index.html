function parseCSVRow(line){const res=[];let cur="";let inQ=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}else if(c===','&&!inQ){res.push(cur.trim());cur="";}else cur+=c;}res.push(cur.trim());return res;}
function parseCSVFile(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2)return{error:"File không có dữ liệu",rows:[]};
  const headers=parseCSVRow(lines[0]);
  if(!headers.includes("Tên"))return{error:"Không tìm thấy cột 'Tên' — vui lòng dùng đúng template",rows:[]};
  const rows=[];
  for(let i=1;i<lines.length;i++){
    if(!lines[i].trim())continue;
    const cols=parseCSVRow(lines[i]);
    const get=h=>{const idx=headers.indexOf(h);return idx>=0?(cols[idx]||""):""};

  }

}

function App(){

  const [sups,setSups]=useState([]);
  const [rfqs,setRfqs]=useState([]);
  const [tab,setTab]=useState("list");
  const [modal,setModal]=useState(null);
  const [toast,setToast]=useState(null);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{

  const saveRfqs=useCallback(async l=>{setRfqs(l);setSaving(true);try{await apiSave("RFQs",l);}finally{setSaving(false);};},[]);

  const upsS=async s=>{const u={...s,ua:new Date().toISOString()};const i=sups.findIndex(x=>x.id===u.id);await saveSups(i>=0?sups.map((x,j)=>j===i?u:x):[u,...sups]);toast2(i>=0?"Đã cập nhật":"Đã thêm supplier");setModal(null);};
  const delS=async id=>{if(!confirm("Xóa supplier này?"))return;await saveSups(sups.filter(x=>x.id!==id));setModal(null);toast2("Đã xóa");};
  const upsR=async r=>{const u={...r,ua:new Date().toISOString()};const i=rfqs.findIndex(x=>x.id===u.id);await saveRfqs(i>=0?rfqs.map((x,j)=>j===i?u:x):[u,...rfqs]);toast2(i>=0?"Đã cập nhật RFQ":"Đã tạo RFQ");setModal(null);};
  const delR=async id=>{if(!confirm("Xóa RFQ?"))return;await saveRfqs(rfqs.filter(x=>x.id!==id));setModal(null);toast2("Đã xóa");};
  const logout=()=>{localStorage.removeItem(AUTH_KEY);setCanEdit(false);};
  const batchImport=async list=>{
    const cur=[...sups];
    list.forEach(s=>{const i=cur.findIndex(x=>x.name.toLowerCase()===s.name.toLowerCase());if(i>=0)cur[i]={...cur[i],...s,id:cur[i].id};else cur.unshift(s);});
    await saveSups(cur);toast2("Đã import "+list.length+" supplier");setModal(null);
  };

  const ctx={sups,rfqs,upsS,delS,upsR,delR,setModal,toast2,canEdit,batchImport,saveSups};

  return(
    <div style={{minHeight:"100vh",background:"#f0f0f0"}}>
      {toast&&<div style={{position:"fixed",top:14,right:14,background:"#1D9E75",color:"#fff",padding:"10px 20px",borderRadius:8,fontSize:13,zIndex:9999,fontWeight:500,boxShadow:"0 2px 12px rgba(0,0,0,0.15)"}}>{toast}</div>}
      {saving&&<div style={{position:"fixed",bottom:14,right:14,background:"#185FA5",color:"#fff",padding:"7px 14px",borderRadius:6,fontSize:12,zIndex:9999}}>💾 Đang lưu...</div>}
      {syncErr&&<div style={{background:"#FCEBEB",borderBottom:"1px solid #E24B4A",padding:"8px 1rem",fontSize:13,color:"#A32D2D",textAlign:"center"}}>⚠ Không kết nối được Google Sheets — kiểm tra lại Apps Script URL</div>}

          {[{id:"list",l:"Supplier DB"},{id:"rfq",l:"RFQ/INQ"},{id:"kraljic",l:"Kraljic"},{id:"dash",l:"Dashboard"}].map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{background:"none",border:"none",padding:"13px 11px",fontSize:13,cursor:"pointer",color:tab===t.id?"#1a1a1a":"#777",borderBottom:tab===t.id?"2px solid #1D9E75":"2px solid transparent",fontWeight:tab===t.id?600:400,position:"relative"}}>
              {t.l}
              {t.id==="rfq"&&rfqs.filter(r=>r.status==="new"||r.status==="searching").length>0&&<span style={{position:"absolute",top:7,right:0,background:"#E24B4A",color:"#fff",fontSize:10,fontWeight:700,borderRadius:8,padding:"0 5px"}}>{rfqs.filter(r=>r.status==="new"||r.status==="searching").length}</span>}
            </button>

function SupList({ctx}){

    return(fT==="all"||ti.label.startsWith(fT))&&(fI==="all"||s.industry===fI)&&(fS==="all"||s.stage===fS)&&(!q||[s.name,s.products,s.province,s.industry].some(v=>(v||"").toLowerCase().includes(q.toLowerCase())));
  });
  const csv=()=>{
    try{
      const rows=fl.map(s=>{const ti=calcTier(s.vserf);return[s.name,s.industry,s.products,s.province,s.bizModel,s.legalType,s.partnerType,s.website,s.contactName,s.zalo,s.email,s.stage,ti.label,ti.t,s.capacity,s.moq,s.priceRange,s.leadTime,s.incoterm,s.serviceModel,s.paymentMethod,s.specialNotes].map(v=>`"${(String(v||"")).replace(/"/g,'""')}"`).join(",");});

      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="VinaSources_"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();document.body.removeChild(a);

function VSERFChecklist({supplier,ctx}){
  const {upsS,setModal,toast2}=ctx;
  const [answers,setAnswers]=useState(()=>{
    const init={};
    VCOLS.forEach((c,i)=>{
      const v=supplier.vserf[c.id]||0;
      if(v>0)init[i+1]={pts:v,text:vserfCriteria[i]?.opts[v]?.text||""};
    });
    return init;
  });
  const [hints,setHints]=useState({});
  const [saved,setSaved]=useState(false);

  const total=Object.values(answers).reduce((s,v)=>s+v.pts,0);
  const answered=Object.keys(answers).length;
  const complete=answered===9;
  const tier=complete?getTier(total):null;

  const selectOpt=(cid,opt)=>{setSaved(false);setAnswers(p=>({...p,[cid]:opt}));};
  const toggleHint=id=>setHints(p=>({...p,[id]:!p[id]}));

  const handleSave=async()=>{
    if(!complete)return;
    const vserf={};
    vserfCriteria.forEach((c,i)=>{vserf[VCOLS[i].id]=answers[c.id]?.pts||0;});
    await upsS({...supplier,vserf});
    setSaved(true);
    toast2&&toast2("Đã lưu VSERF");
  };

  return(
    <Card style={{maxHeight:"85vh",overflowY:"auto"}}>
      <div style={{marginBottom:14}}>
        <h2 style={{fontSize:16,fontWeight:600,margin:0}}>📋 VSERF Checklist — {supplier.name}</h2>
        <div style={{fontSize:12,color:"#777",marginTop:4}}>Chọn mức mô tả đúng nhất · Tổng tối đa 45 điểm</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>
        {[{l:"Tổng điểm",v:`${total}/45`},{l:"Đã trả lời",v:`${answered}/9`},{l:"TB/tiêu chí",v:answered>0?(total/answered).toFixed(1):"—"}].map(m=>(
          <div key={m.l} style={{background:"#f8f8f8",borderRadius:8,padding:"10px",textAlign:"center"}}>
            <div style={{fontSize:11,color:"#aaa",marginBottom:3}}>{m.l}</div>
            <div style={{fontSize:18,fontWeight:700}}>{m.v}</div>
          </div>
        ))}
      </div>
      <div style={{height:8,background:"#f0f0f0",borderRadius:4,marginBottom:14}}>
        <div style={{height:8,borderRadius:4,background:"#1D9E75",width:`${Math.round(total/45*100)}%`,transition:"width .3s"}}/>
      </div>
      {tier&&<div style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderRadius:8,background:tier.bg,border:`1.5px solid ${tier.c}`,marginBottom:14}}>
        <span style={{fontSize:22}}>{tier.badge}</span>
        <div><div style={{fontSize:14,fontWeight:700,color:tier.c}}>{tier.label}</div><div style={{fontSize:12,color:"#555",marginTop:2}}>{tier.action}</div></div>
        <div style={{marginLeft:"auto",fontSize:24,fontWeight:800,color:tier.c}}>{total}</div>
      </div>}
      {vserfCriteria.map(cr=>{
        const sel=answers[cr.id];
        const warn=cr.id<=2&&sel?.pts<3;
        return(
          <div key={cr.id} style={{border:`1px solid ${warn?"#E24B4A":"#eee"}`,borderRadius:10,padding:"12px 14px",marginBottom:10,background:sel?"#fafffe":"#fff"}}>
            <div style={{display:"flex",alignItems:"flex-start",gap:10,marginBottom:8}}>
              <span style={{fontSize:11,fontWeight:700,minWidth:26,height:26,borderRadius:"50%",background:sel?"#E1F5EE":"#f3f4f6",color:sel?"#0F6E56":"#6b7280",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{String(cr.id).padStart(2,"0")}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:600}}>{cr.icon} {cr.label}{sel&&<span style={{marginLeft:8,fontSize:11,fontWeight:600,color:"#0F6E56",background:"#E1F5EE",padding:"1px 8px",borderRadius:20}}>{sel.pts} điểm</span>}</div>
                <div style={{fontSize:12,color:"#777",marginTop:2}}>{cr.desc}</div>
              </div>
              <button onClick={()=>toggleHint(cr.id)} style={{fontSize:11,color:"#9ca3af",background:"none",border:"none",cursor:"pointer",padding:"2px 6px",borderRadius:4,flexShrink:0}}>💡 gợi ý</button>
            </div>
            {hints[cr.id]&&<div style={{fontSize:12,color:"#374151",background:"#fffbeb",border:"1px solid #fde68a",borderRadius:6,padding:"8px 10px",marginBottom:8,lineHeight:1.5}}>{cr.hint}</div>}
            {warn&&<div style={{fontSize:11,color:"#A32D2D",marginBottom:6}}>⚠ Tiêu chí bắt buộc — dưới 3 điểm → tự động Not Qualified</div>}
            <div style={{display:"flex",flexDirection:"column",gap:5}}>
              {cr.opts.map((opt,i)=>{
                const isSel=sel?.pts===opt.pts&&sel?.text===opt.text;
                return(
                  <label key={i} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"7px 10px",borderRadius:7,cursor:"pointer",border:isSel?"1.5px solid #1D9E75":"1px solid #eee",background:isSel?"#E1F5EE":"#fff"}}>
                    <input type="radio" name={`vserf_${cr.id}`} checked={isSel} onChange={()=>selectOpt(cr.id,opt)} style={{marginTop:3,accentColor:"#1D9E75",flexShrink:0}}/>
                    <span style={{fontSize:13,lineHeight:1.45,flex:1}}>{opt.text}</span>
                    <span style={{fontSize:11,fontWeight:600,minWidth:44,textAlign:"right",flexShrink:0,color:isSel?"#0F6E56":"#aaa"}}>{opt.pts} điểm</span>
                  </label>
                );
              })}
            </div>
          </div>
        );
      })}
      <div style={{display:"flex",gap:8,marginTop:8,position:"sticky",bottom:0,background:"#fff",paddingTop:12,borderTop:"1px solid #f0f0f0"}}>
        <button onClick={handleSave} disabled={!complete||saved} style={{flex:1,padding:"9px 0",borderRadius:8,fontWeight:600,fontSize:13,cursor:complete&&!saved?"pointer":"not-allowed",background:saved?"#E1F5EE":complete?"#1D9E75":"#e5e7eb",color:saved?"#0F6E56":complete?"#fff":"#aaa",border:"none"}}>
          {saved?"✓ Đã lưu":"Lưu kết quả VSERF"}
        </button>
        <button onClick={()=>setModal(null)} style={gBtn}>Đóng</button>
      </div>
    </Card>
  );
}

function ImportCSV({ctx}){
  const {sups,batchImport,setModal}=ctx;
  const [rows,setRows]=useState([]);
  const [err,setErr]=useState("");
  const [step,setStep]=useState(1);
  const [sel,setSel]=useState({});
  const [drag,setDrag]=useState(false);
  const fileRef=useRef();

  const processFile=f=>{
    if(!f)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const {error,rows:parsed}=parseCSVFile(ev.target.result);
      if(error){setErr(error);return;}
      setErr("");
      const initSel={};parsed.forEach((_,i)=>{initSel[i]=true;});
      setRows(parsed);setSel(initSel);setStep(2);
    };
    reader.onerror=()=>setErr("Không đọc được file.");
    reader.readAsText(f,"UTF-8");
  };
  const onFile=e=>{if(e.target.files[0])processFile(e.target.files[0]);};
  const onDrop=e=>{e.preventDefault();setDrag(false);if(e.dataTransfer.files[0])processFile(e.dataTransfer.files[0]);};
  const onPaste=e=>{
    const text=e.target.value;
    if(!text.trim())return;
    const {error,rows:parsed}=parseCSVFile(text);
    if(error){setErr(error);return;}
    setErr("");
    const initSel={};parsed.forEach((_,i)=>{initSel[i]=true;});
    setRows(parsed);setSel(initSel);setStep(2);
  };

  const doImport=()=>{
    const toImport=rows.filter((_,i)=>sel[i]&&rows[i]._valid);
    if(!toImport.length)return;
    batchImport(toImport);
  };
  const validCount=rows.filter((_,i)=>sel[i]&&rows[i]._valid).length;
  const dupCount=rows.filter(r=>sups.some(s=>s.name.toLowerCase()===r.name.toLowerCase())).length;

  return(
    <Card>
      <h2 style={{margin:"0 0 4px",fontSize:15,fontWeight:600}}>Import Supplier từ CSV</h2>
      <div style={{fontSize:12,color:"#aaa",marginBottom:14}}>Upload file hoặc paste nội dung CSV · Preview trước khi lưu</div>
      {step===1&&(
        <div>
          <div style={{background:"#F0F9F5",border:"1px solid #C5DFA8",borderRadius:10,padding:"14px 16px",marginBottom:14}}>
            <div style={{fontSize:13,fontWeight:600,color:"#3B6D11",marginBottom:4}}>Bước 1 — Tải template CSV</div>
            <div style={{fontSize:12,color:"#555",marginBottom:10,lineHeight:1.6}}>Download file mẫu → điền thông tin → save → upload lên.<br/><b>Cột bắt buộc:</b> Tên · Ngành · Sản phẩm</div>
            <button onClick={downloadTemplate} style={{...pBtn,background:"#3B6D11",fontSize:12}}>⬇ Download Template CSV</button>
          </div>
          <div onDrop={onDrop} onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)} onClick={()=>fileRef.current.click()} style={{border:`2px dashed ${drag?"#1D9E75":"#ddd"}`,borderRadius:10,padding:"1.5rem",textAlign:"center",cursor:"pointer",background:drag?"#F0F9F5":"#fafafa",marginBottom:10}}>
            <div style={{fontSize:24,marginBottom:6}}>{drag?"📥":"📂"}</div>
            <div style={{fontSize:13,fontWeight:600,color:drag?"#1D9E75":"#555",marginBottom:2}}>{drag?"Thả file vào đây":"Click để chọn file CSV"}</div>
            <div style={{fontSize:11,color:"#aaa"}}>hoặc kéo thả file vào đây</div>
            <input ref={fileRef} type="file" accept=".csv,text/csv" onChange={onFile} style={{display:"none"}}/>
          </div>
          <div style={{marginBottom:10}}>
            <div style={{fontSize:11,color:"#aaa",textAlign:"center",marginBottom:6}}>— hoặc paste nội dung CSV trực tiếp —</div>
            <textarea onChange={onPaste} placeholder={"Tên,Ngành,Sản phẩm,...\nCông ty A,Footwear,Giày da,..."} style={{...iSt,minHeight:80,resize:"vertical",boxSizing:"border-box",fontSize:11,fontFamily:"monospace"}}/>
          </div>
          {err&&<div style={{padding:"8px 12px",background:"#FCEBEB",borderRadius:6,fontSize:13,color:"#A32D2D",marginBottom:10}}>{err}</div>}
        </div>
      )}
      {step===2&&(
        <div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>
            {[{l:"Tổng dòng",v:rows.length,c:"#185FA5"},{l:"Sẽ import",v:validCount,c:"#1D9E75"},{l:"Trùng (cập nhật)",v:dupCount,c:"#854F0B"}].map(x=>(
              <div key={x.l} style={{background:"#f8f8f8",borderRadius:8,padding:"10px",textAlign:"center"}}><div style={{fontSize:20,fontWeight:700,color:x.c}}>{x.v}</div><div style={{fontSize:11,color:"#aaa",marginTop:2}}>{x.l}</div></div>
            ))}
          </div>

function RFQList({ctx}){
  const {rfqs,setModal,canEdit}=ctx;
  const [fType,setFType]=useState("all");
  const [fUrgent,setFUrgent]=useState("all");
  const [fStatus,setFStatus]=useState("all");

  const urgentCount=rfqs.filter(r=>r.urgent&&r.status!=="closed"&&r.status!=="inq_closed"&&r.status!=="inq_converted").length;
  const fl=rfqs.filter(r=>{
    const typeOk=fType==="all"||(fType==="rfq"&&r.type!=="inq")||(fType==="inq"&&r.type==="inq");
    const urgentOk=fUrgent==="all"||(fUrgent==="urgent"&&r.urgent)||(fUrgent==="normal"&&!r.urgent);
    const statusOk=fStatus==="all"||r.status===fStatus;
    return typeOk&&urgentOk&&statusOk;
  });
  const allStatuses=[...RFQ_ST,...INQ_ST];

  return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:10,alignItems:"center",flexWrap:"wrap"}}>
        <span style={{fontSize:14,fontWeight:600}}>RFQ / Inquiry</span>
        {urgentCount>0&&<span style={{fontSize:11,padding:"2px 8px",borderRadius:4,background:"#FCEBEB",color:"#A32D2D",fontWeight:600}}>🔴 {urgentCount} gấp</span>}
        <div style={{flex:1}}/>
        <Sel val={fType} onChange={setFType} opts={[["all","RFQ + INQ"],["rfq","Chỉ RFQ"],["inq","Chỉ INQ"]]}/>
        <Sel val={fUrgent} onChange={setFUrgent} opts={[["all","Tất cả"],["urgent","🔴 Gấp"],["normal","Không gấp"]]}/>
        <Sel val={fStatus} onChange={setFStatus} opts={[["all","Tất cả trạng thái"],...allStatuses.map(s=>[s.id,s.label])]}/>
      </div>
      {fl.length===0&&<Empty text="Chưa có RFQ/INQ. Nhấn + INQ hoặc + RFQ để tạo."/>}
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {fl.map(r=>{
          const isInq=r.type==="inq";
          const statusList=isInq?INQ_ST:RFQ_ST;
          const st=statusList.find(x=>x.id===r.status)||statusList[0];
          const deadlineUrgent=r.deadline&&new Date(r.deadline)<new Date(Date.now()+3*864e5);
          return(
            <div key={r.id} onClick={()=>setModal({t:isInq?"inq-detail":"rfq-detail",d:r})} style={{background:"#fff",border:`1px solid ${(r.urgent||deadlineUrgent)&&r.status!=="closed"&&r.status!=="inq_closed"?"#E24B4A":"#e5e5e5"}`,borderRadius:10,padding:"12px 14px",cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.boxShadow="0 2px 8px rgba(0,0,0,0.08)"} onMouseLeave={e=>e.currentTarget.style.boxShadow="none"}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <span style={{fontSize:10,padding:"2px 7px",borderRadius:4,fontWeight:700,background:isInq?"#EEEDFE":"#E6F1FB",color:isInq?"#534AB7":"#185FA5"}}>{isInq?"INQ":"RFQ"}</span>
                <span style={{fontWeight:600,fontSize:12,color:"#aaa",minWidth:70}}>{r.code}</span>
                <span style={{fontWeight:600,fontSize:14,flex:1}}>{r.desc||"(Chưa mô tả)"}</span>
                <span style={{fontSize:11,padding:"2px 9px",borderRadius:4,background:st.bg,color:st.c,fontWeight:600}}>{st.label}</span>
                {r.urgent&&<span style={{fontSize:11,padding:"2px 7px",borderRadius:4,background:"#FCEBEB",color:"#A32D2D",fontWeight:600}}>🔴 Gấp</span>}
                {!r.urgent&&deadlineUrgent&&<span style={{fontSize:11,padding:"2px 7px",borderRadius:4,background:"#FAEEDA",color:"#854F0B",fontWeight:600}}>⏰ Sắp hết hạn</span>}
              </div>
              <div style={{fontSize:12,color:"#777",marginTop:5,display:"flex",gap:14,flexWrap:"wrap"}}>
                {r.markets?.length>0&&<span>🌍 {r.markets.join(", ")}</span>}
                {r.deadline&&<span>📅 {r.deadline}</span>}
                {r.sales&&<span>👤 {r.sales}</span>}
                {r.sids?.length>0&&<span>🏭 {r.sids.length} NCC</span>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {asgn.map(s=>{const ti=calcTier(s.vserf);const note=r.snotes?.[s.id]||"";return(
            <div key={s.id} style={{background:"#f8f8f8",border:"1px solid #eee",borderRadius:10,padding:"12px 14px",display:"flex",gap:10,alignItems:"flex-start"}}>
              <div style={{flex:1}}>
                <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginBottom:3}}><span style={{fontWeight:600,fontSize:13}}>{s.name}</span><span style={{fontSize:11,padding:"2px 8px",borderRadius:4,background:ti.bg,color:ti.c,fontWeight:600}}>{ti.label} · {ti.t}/45</span></div>
                <div style={{fontSize:12,color:"#777"}}>{[s.products,s.province].filter(Boolean).join(" · ")}</div>
                {s.zalo&&<div style={{fontSize:12,color:"#777",marginTop:2}}>📱 {s.zalo}</div>}
                {canEdit?<input value={note} onChange={e=>upsR({...r,snotes:{...r.snotes,[s.id]:e.target.value}})} placeholder="Ghi chú báo giá..." style={{...iSt,fontSize:12,marginTop:8,boxSizing:"border-box"}}/>:note&&<div style={{fontSize:12,color:"#555",marginTop:6,padding:"6px 10px",background:"#fff",borderRadius:6,border:"1px solid #eee"}}>{note}</div>}
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:5,flexShrink:0}}>
                <button onClick={()=>setModal({t:"brief",d:s})} style={{fontSize:11,padding:"4px 10px",borderRadius:5,border:"none",background:"#185FA5",color:"#fff",cursor:"pointer"}}>Brief</button>
                {canEdit&&<button onClick={()=>upsR({...r,sids:r.sids.filter(x=>x!==s.id)})} style={{fontSize:11,padding:"4px 10px",borderRadius:5,border:"1px solid #E24B4A",background:"none",color:"#E24B4A",cursor:"pointer"}}>Bỏ</button>}
              </div>
            </div>
          );})}
        </div>
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",paddingTop:12,borderTop:"1px solid #f0f0f0"}}>
        {canEdit&&<button onClick={()=>setModal({t:"rfq-form",d:r})} style={gBtn}>✏️ Sửa RFQ</button>}
        <div style={{display:"flex",gap:6,alignItems:"center",marginLeft:"auto"}}>
          <span style={{fontSize:12,color:"#aaa"}}>Trạng thái:</span>
          {canEdit?<select value={r.status} onChange={e=>upsR({...r,status:e.target.value})} style={{...iSt,padding:"5px 8px",fontSize:12,width:"auto"}}>{RFQ_ST.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}</select>:<span style={{fontSize:12,padding:"4px 12px",borderRadius:5,background:st.bg,color:st.c,fontWeight:600}}>{st.label}</span>}
        </div>
        {canEdit&&<button onClick={()=>delR(r.id)} style={{...gBtn,color:"#E24B4A",borderColor:"#E24B4A"}}>Xóa</button>}
      </div>
    </Card>
  );
}

function RFQAssign({r,ctx}){
  const {sups,upsR,setModal}=ctx;
  const [sel,setSel]=useState(r.sids||[]);
  const [q,setQ]=useState("");
  const fl=sups.filter(s=>!q||[s.name,s.products,s.industry].some(v=>(v||"").toLowerCase().includes(q.toLowerCase())));
  const tog=id=>setSel(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  return(
    <Card>
      <h2 style={{margin:"0 0 10px",fontSize:15,fontWeight:600}}>Gán NCC vào {r.code}</h2>
      <div style={{fontSize:13,color:"#555",marginBottom:12,padding:"8px 12px",background:"#E6F1FB",borderRadius:6}}>📋 {r.desc||"—"} · {r.markets?.join(", ")||"—"}</div>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Tìm NCC..." style={{...iSt,marginBottom:10,boxSizing:"border-box"}}/>
      <div style={{maxHeight:360,overflowY:"auto",display:"flex",flexDirection:"column",gap:6}}>
        {fl.map(s=>{const ti=calcTier(s.vserf);const chk=sel.includes(s.id);return(
          <div key={s.id} onClick={()=>tog(s.id)} style={{background:chk?"#f0faf6":"#fff",border:`1px solid ${chk?"#1D9E75":"#e5e5e5"}`,borderRadius:8,padding:"10px 12px",cursor:"pointer",display:"flex",gap:10,alignItems:"center"}}>
            <div style={{width:20,height:20,borderRadius:4,border:`2px solid ${chk?"#1D9E75":"#ccc"}`,background:chk?"#1D9E75":"none",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{chk&&<span style={{color:"#fff",fontSize:12,fontWeight:700}}>✓</span>}</div>
            <div style={{flex:1,minWidth:0}}><div style={{fontWeight:600,fontSize:13}}>{s.name}</div><div style={{fontSize:12,color:"#777"}}>{s.products} · {s.province}</div></div>
            <span style={{fontSize:11,padding:"2px 8px",borderRadius:4,background:ti.bg,color:ti.c,fontWeight:600,flexShrink:0}}>{ti.label} · {ti.t}/45</span>
          </div>
        );})}
      </div>
      <div style={{display:"flex",gap:8,justifyContent:"space-between",alignItems:"center",marginTop:12}}>
        <span style={{fontSize:13,color:"#777"}}>{sel.length} NCC được chọn</span>
        <div style={{display:"flex",gap:8}}><button onClick={()=>setModal(null)} style={gBtn}>Hủy</button><button onClick={()=>{upsR({...r,sids:sel,status:sel.length>0?"shortlisted":r.status});setModal(null);}} style={pBtn}>Lưu</button></div>
      </div>
    </Card>
  );
}

function Kraljic({ctx}){
  const {sups,upsS,setModal,canEdit}=ctx;
  const grouped={strategic:[],leverage:[],bottleneck:[],routine:[],unclassified:[]};
  sups.forEach(s=>{
    if(s.kraljic&&grouped[s.kraljic])grouped[s.kraljic].push(s);
    else grouped.unclassified.push(s);
  });
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}>
        <div>
          <div style={{fontSize:15,fontWeight:600}}>Ma trận Kraljic — Phân loại NCC</div>
          <div style={{fontSize:12,color:"#777",marginTop:2}}>Phân loại nhà cung cấp theo tác động tài chính và rủi ro cung ứng</div>
        </div>
        {grouped.unclassified.length>0&&<div style={{fontSize:12,padding:"4px 10px",borderRadius:6,background:"#FAEEDA",color:"#854F0B",fontWeight:500}}>{grouped.unclassified.length} NCC chưa phân loại</div>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
        {KRALJIC_QUADRANTS.map(q=>(
          <div key={q.id} style={{background:q.bg,border:`1.5px solid ${q.c}`,borderRadius:12,padding:"1rem"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
              <span style={{fontSize:20}}>{q.icon}</span>
              <div>
                <div style={{fontSize:13,fontWeight:700,color:q.c}}>{q.label} <span style={{fontWeight:400,fontSize:12}}>({q.labelVi})</span></div>
                <div style={{fontSize:11,color:"#666"}}>{q.desc}</div>
              </div>
              <span style={{marginLeft:"auto",fontSize:18,fontWeight:700,color:q.c}}>{grouped[q.id].length}</span>
            </div>
            <div style={{fontSize:11,color:"#555",background:"rgba(255,255,255,0.6)",borderRadius:6,padding:"6px 8px",marginBottom:8,lineHeight:1.5}}>💡 {q.strategy}</div>
            <div style={{display:"flex",flexDirection:"column",gap:4}}>
              {grouped[q.id].map(s=>{
                const ti=calcTier(s.vserf);
                return(
                  <div key={s.id} style={{background:"#fff",borderRadius:6,padding:"6px 10px",display:"flex",alignItems:"center",gap:8}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.name}</div>
                      <div style={{fontSize:11,color:"#777"}}>{s.industry||"—"}</div>
                    </div>
                    <span style={{fontSize:10,padding:"1px 6px",borderRadius:3,background:ti.bg,color:ti.c,fontWeight:600,flexShrink:0}}>{ti.label}</span>
                    {canEdit&&<button onClick={()=>setModal({t:"kraljic-edit",d:s})} style={{fontSize:10,padding:"2px 6px",borderRadius:4,border:"1px solid #ddd",background:"none",cursor:"pointer",color:"#777",flexShrink:0}}>Đổi</button>}
                  </div>
                );
              })}
              {grouped[q.id].length===0&&<div style={{fontSize:12,color:"#aaa",textAlign:"center",padding:"8px 0"}}>Chưa có NCC</div>}
            </div>
          </div>
        ))}
      </div>
      {grouped.unclassified.length>0&&(
        <div style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:12,padding:"1rem"}}>
          <div style={{fontSize:13,fontWeight:600,marginBottom:10,color:"#777"}}>📋 Chưa phân loại ({grouped.unclassified.length} NCC)</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:8}}>
            {grouped.unclassified.map(s=>{
              const ti=calcTier(s.vserf);
              return(
                <div key={s.id} style={{border:"1px solid #eee",borderRadius:8,padding:"10px 12px",display:"flex",alignItems:"center",gap:8}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.name}</div>
                    <div style={{fontSize:11,color:"#777"}}>{s.industry} · {ti.label} · {ti.t}/45</div>
                  </div>
                  {canEdit&&<button onClick={()=>setModal({t:"kraljic-edit",d:s})} style={{...pBtn,fontSize:11,padding:"4px 10px",background:"#534AB7",flexShrink:0}}>Phân loại</button>}
                </div>
              );
            })}
          </div>
        </div>
      )}
      <div style={{marginTop:12,padding:"10px 14px",background:"#f8f8f8",borderRadius:8,fontSize:12,color:"#666"}}>
        <div style={{fontWeight:600,marginBottom:6}}>Hướng dẫn phân loại:</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4}}>
          <div><b style={{color:"#A32D2D"}}>⭐ Strategic:</b> NCC độc quyền, khó thay thế, ảnh hưởng lớn đến doanh thu</div>
          <div><b style={{color:"#3B6D11"}}>💪 Leverage:</b> Nhiều NCC thay thế, giá trị mua lớn — có thể thương lượng mạnh</div>
          <div><b style={{color:"#854F0B"}}>⚠️ Bottleneck:</b> Khó tìm thay thế nhưng giá trị không cao — cần dự phòng</div>
          <div><b style={{color:"#185FA5"}}>📦 Routine:</b> Dễ mua, giá trị thấp — tối ưu quy trình và chi phí giao dịch</div>
        </div>
      </div>
    </div>
  );
}

function KraljicEdit({s,ctx}){
  const {upsS,setModal}=ctx;
  const [selected,setSelected]=useState(s.kraljic||"");
  return(
    <Card>
      <h2 style={{margin:"0 0 4px",fontSize:15,fontWeight:600}}>Phân loại Kraljic — {s.name}</h2>
      <div style={{fontSize:12,color:"#777",marginBottom:16}}>Chọn nhóm phù hợp với vai trò của NCC này trong chuỗi cung ứng</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
        {KRALJIC_QUADRANTS.map(q=>(
          <div key={q.id} onClick={()=>setSelected(q.id)} style={{border:`2px solid ${selected===q.id?q.c:"#eee"}`,borderRadius:10,padding:"12px 14px",cursor:"pointer",background:selected===q.id?q.bg:"#fff",transition:"all .15s"}}>
            <div style={{fontSize:18,marginBottom:4}}>{q.icon}</div>
            <div style={{fontSize:13,fontWeight:700,color:q.c}}>{q.label}</div>
            <div style={{fontSize:11,color:"#777",marginBottom:6}}>{q.labelVi} · {q.desc}</div>
            <div style={{fontSize:11,color:"#555",lineHeight:1.5}}>→ {q.strategy}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:8,justifyContent:"space-between",alignItems:"center"}}>
        {s.kraljic&&<button onClick={()=>{upsS({...s,kraljic:""});setModal(null);}} style={{...gBtn,color:"#E24B4A"}}>Bỏ phân loại</button>}
        <div style={{display:"flex",gap:8,marginLeft:"auto"}}>
          <button onClick={()=>setModal(null)} style={gBtn}>Hủy</button>
          <button onClick={()=>{upsS({...s,kraljic:selected});setModal(null);}} disabled={!selected} style={{...pBtn,background:"#534AB7",opacity:selected?1:.5}}>Lưu phân loại</button>
        </div>
      </div>
    </Card>
  );
}

function Dash({ctx}){
  const {sups,rfqs}=ctx;
  const ti={t1:0,t2:0,t3:0,nq:0};let tv=0,vc=0;
  sups.forEach(s=>{const t=calcTier(s.vserf);if(t.label==="Tier 1")ti.t1++;else if(t.label==="Tier 2")ti.t2++;else if(t.label==="Tier 3")ti.t3++;else ti.nq++;if(t.t>0){tv+=t.t;vc++;}});
  const av=vc?Math.round(tv/vc):0;const t12=sups.length?Math.round((ti.t1+ti.t2)/sups.length*100):0;
  const sc={};sups.forEach(s=>{sc[s.stage]=(sc[s.stage]||0)+1;});
  const ind={};sups.forEach(s=>{if(s.industry)ind[s.industry]=(ind[s.industry]||0)+1;});
  const kpis=[{l:"Tổng supplier",v:sups.length,t:"—",c:"#185FA5"},{l:"Tier 1+2",v:ti.t1+ti.t2,t:"≥40%",c:"#1D9E75"},{l:"Tỷ lệ T1+T2",v:t12+"%",t:"≥40%",c:t12>=40?"#1D9E75":"#E24B4A"},{l:"VSERF TB",v:av+"/45",t:"≥32/45",c:av>=32?"#1D9E75":"#E24B4A"},{l:"RFQ đang mở",v:rfqs.filter(r=>r.status!=="closed").length,t:"—",c:"#534AB7"},{l:"RFQ đã gửi Sales",v:rfqs.filter(r=>r.status==="sent").length,t:"—",c:"#854F0B"}];
  return(
    <div>
      <div style={{fontSize:15,fontWeight:600,marginBottom:14}}>Dashboard · dữ liệu từ Google Sheets</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:8,marginBottom:14}}>{kpis.map(k=><div key={k.l} style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"14px 16px"}}><div style={{fontSize:11,color:"#aaa",marginBottom:4}}>{k.l}</div><div style={{fontSize:22,fontWeight:700,color:k.c}}>{k.v}</div><div style={{fontSize:10,color:"#ccc",marginTop:2}}>Mục tiêu: {k.t}</div></div>)}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
        <div style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"1rem"}}><div style={{fontSize:13,fontWeight:600,marginBottom:10}}>Phân bổ Tier</div>{[{l:"Tier 1 Export-Ready",v:ti.t1,c:"#1D9E75"},{l:"Tier 2 Nearly Ready",v:ti.t2,c:"#185FA5"},{l:"Tier 3 Developing",v:ti.t3,c:"#854F0B"},{l:"Not Qualified",v:ti.nq,c:"#A32D2D"}].map(r=><div key={r.l} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><div style={{width:8,height:8,borderRadius:2,background:r.c,flexShrink:0}}/><span style={{fontSize:12,color:"#777",flex:1}}>{r.l}</span><span style={{fontSize:13,fontWeight:600,color:r.c}}>{r.v}</span></div>)}</div>
        <div style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"1rem"}}><div style={{fontSize:13,fontWeight:600,marginBottom:10}}>RFQ theo trạng thái</div>{RFQ_ST.map(st=>{const cnt=rfqs.filter(r=>r.status===st.id).length;return<div key={st.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><div style={{width:8,height:8,borderRadius:2,background:st.c,flexShrink:0}}/><span style={{fontSize:12,color:"#777",flex:1}}>{st.label}</span><span style={{fontSize:13,fontWeight:600,color:st.c}}>{cnt}</span></div>;})}</div>
      </div>
      <div style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"1rem",marginBottom:12}}><div style={{fontSize:13,fontWeight:600,marginBottom:10}}>Pipeline</div>{STAGES.map(st=>{const cnt=sc[st.id]||0;const max=Math.max(...Object.values(sc),1);return<div key={st.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}><span style={{fontSize:10,color:"#aaa",minWidth:22,flexShrink:0}}>{st.id}</span><span style={{fontSize:12,color:"#555",minWidth:140,flexShrink:0}}>{st.label.replace(st.id+" ","")}</span><div style={{flex:1,height:8,background:"#f0f0f0",borderRadius:4,overflow:"hidden"}}><div style={{height:"100%",width:(cnt/max*100)+"%",background:st.ph===1?"#9FE1CB":st.ph===2?"#B5D4F4":"#EEEDFE",borderRadius:4}}/></div><span style={{fontSize:12,fontWeight:600,minWidth:20,textAlign:"right",color:cnt>0?"#1a1a1a":"#ccc"}}>{cnt}</span></div>;})}</div>
      {Object.keys(ind).length>0&&<div style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"1rem"}}><div style={{fontSize:13,fontWeight:600,marginBottom:8}}>Ngành hàng</div><div style={{display:"flex",flexWrap:"wrap",gap:6}}>{Object.entries(ind).sort((a,b)=>b[1]-a[1]).map(([i,c])=><div key={i} style={{padding:"4px 12px",borderRadius:20,background:"#f5f5f5",fontSize:12,color:"#555"}}>{i} <b style={{color:"#1a1a1a"}}>{c}</b></div>)}</div></div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
