// ── API ──
async function api(action,sheet,body={}){
  if(action==="getAll"||action==="getOne"||action==="getByField"){
    const p=new URLSearchParams({action,sheet,...body});
    const r=await fetch(`${API_URL}?${p}`);
    return r.json();
  }
  const r=await fetch(API_URL,{method:"POST",body:JSON.stringify({action,sheet,...body})});
  return r.json();
}

const calcTier=v=>{
  if(!v)return{label:"Not Qualified",c:"#A32D2D",bg:"#FCEBEB",t:0};
  const t=Object.values(v).reduce((a,b)=>a+(b||0),0);
  if((v.phap_ly||0)<3||(v.san_xuat||0)<3)return{label:"Not Qualified",c:"#A32D2D",bg:"#FCEBEB",t};
  if(t>=38)return{label:"Tier 1",c:"#3B6D11",bg:"#EAF3DE",t};
  if(t>=27)return{label:"Tier 2",c:"#185FA5",bg:"#E6F1FB",t};
  if(t>=18)return{label:"Tier 3",c:"#854F0B",bg:"#FAEEDA",t};
  return{label:"Not Qualified",c:"#A32D2D",bg:"#FCEBEB",t};
};
const calcSupPerf=(supId,orders)=>{
  const closed=(orders||[]).filter(o=>o.supId===supId&&o.stage==="closed");
  if(!closed.length)return null;
  const ratings=closed.map(o=>o.rating).filter(Boolean);
  const avgRating=ratings.length?Math.round(ratings.reduce((a,b)=>a+b,0)/ratings.length*10)/10:0;
  const onTime=closed.map(o=>parseFloat(o.onTimeRate)).filter(v=>!isNaN(v));
  const avgOnTime=onTime.length?Math.round(onTime.reduce((a,b)=>a+b,0)/onTime.length):null;
  const quality=closed.map(o=>parseFloat(o.qualityRate)).filter(v=>!isNaN(v));
  const avgQuality=quality.length?Math.round(quality.reduce((a,b)=>a+b,0)/quality.length):null;
  return{orders:closed.length,rating:avgRating,onTime:avgOnTime,quality:avgQuality};
};

// ── RFQ DESC RENDERER ──
// Parses "— TIÊU ĐỀ —" as section headers, "• item" as bullets, blank lines as spacers
function RFQDesc({text}){
  if(!text)return<span style={{color:"#ccc"}}>—</span>;
  const lines=text.split("\n");
  const els=[];let buf=[];
  const flushBuf=()=>{
    if(!buf.length)return;
    els.push(<div key={els.length} style={{display:"flex",flexDirection:"column",gap:3,marginBottom:4}}>{buf.map((l,i)=><div key={i} style={{fontSize:13,color:"#333",lineHeight:1.7}}>{l}</div>)}</div>);
    buf=[];
  };
  lines.forEach((raw,i)=>{
    const line=raw.trim();
    // Section header: — TEXT — or -- TEXT --
    if(/^[-—]{1,2}\s*.+\s*[-—]{1,2}$/.test(line)){
      flushBuf();
      const label=line.replace(/^[-—\s]+|[-—\s]+$/g,"").trim();
      els.push(<div key={els.length} style={{fontSize:10,fontWeight:700,color:"#999",textTransform:"uppercase",letterSpacing:1,marginTop:els.length?12:0,marginBottom:4,paddingBottom:3,borderBottom:"1px solid #f0f0f0"}}>{label}</div>);
      return;
    }
    // Bullet: starts with • or - or *
    if(/^[•\-\*]\s/.test(line)){
      flushBuf();
      const content=line.replace(/^[•\-\*]\s+/,"");
      els.push(<div key={els.length} style={{display:"flex",gap:8,alignItems:"flex-start",padding:"2px 0"}}><span style={{color:"#1D9E75",fontWeight:700,flexShrink:0,marginTop:1}}>•</span><span style={{fontSize:13,color:"#333",lineHeight:1.7,flex:1}}>{content}</span></div>);
      return;
    }
    // Empty line
    if(!line){flushBuf();return;}
    buf.push(line);
  });
  flushBuf();
  return<div>{els}</div>;
}

function exportSupCSV(sups){
  const header=SUP_CSV_FIELDS.join(",");
  const esc=v=>{const s=String(v??""
  );return s.includes(",")||s.includes("\n")||s.includes('"')?`"${s.replace(/"/g,'""')}"`:s;};
  const rows=sups.map(s=>SUP_CSV_FIELDS.map(f=>esc(s[f])).join(","));
  const csv=[header,...rows].join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=`VinaSources_Suppliers_${today()}.csv`;a.click();
  URL.revokeObjectURL(url);
}

function ImportModal({ctx,onClose}){
  const {upsS,toast2}=ctx;
  const [preview,setPreview]=useState(null);
  const [importing,setImporting]=useState(false);
  const [done,setDone]=useState(false);
  const fileRef=useRef();

  const parseCSV=text=>{
    const lines=text.split(/\r?\n/).filter(Boolean);
    if(lines.length<2)return[];
    const headers=lines[0].split(",").map(h=>h.replace(/^"|"$/g,"").trim());
    return lines.slice(1).map(line=>{
      const vals=[];let cur="",inQ=false;
      for(let i=0;i<line.length;i++){
        if(line[i]==='"'){inQ=!inQ;}
        else if(line[i]===","&&!inQ){vals.push(cur.trim());cur="";}
        else cur+=line[i];
      }
      vals.push(cur.trim());
      const obj={};
      headers.forEach((h,i)=>{obj[h]=(vals[i]||"").replace(/^"|"$/g,"").replace(/""/g,'"');});
      return obj;
    }).filter(r=>r.name);
  };

  const handleFile=e=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const text=ev.target.result.replace(/^\uFEFF/,"");
      const rows=parseCSV(text);
      setPreview(rows);
    };
    reader.readAsText(file,"utf-8");
  };

  const handleImport=async()=>{
    if(!preview?.length)return;
    setImporting(true);
    let ok=0;
    for(const row of preview){
      try{
        const s=normSup({...newS(),...row,id:row.id||newId("s"),ca:row.ca||now(),ua:now()});
        await upsS(s);ok++;
      }catch(e){console.error(e);}
    }
    setImporting(false);setDone(true);
    toast2&&toast2(`Đã import ${ok}/${preview.length} supplier`);
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",zIndex:1100,display:"flex",alignItems:"flex-start",justifyContent:"center",overflowY:"auto",padding:"1rem"}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{width:"100%",maxWidth:560,marginTop:"2rem",marginBottom:"2rem",background:"#fff",borderRadius:12,border:"1px solid #e5e5e5",overflow:"hidden"}} onClick={e=>e.stopPropagation()}>
        <div style={{padding:"14px 18px",borderBottom:"1px solid #f0f0f0",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{fontWeight:600,fontSize:15}}>📥 Import Supplier từ CSV</span>
          <button onClick={onClose} style={{fontSize:18,background:"none",border:"none",cursor:"pointer",color:"#aaa"}}>×</button>
        </div>
        <div style={{padding:"16px 18px"}}>
          {/* Instructions */}
          <div style={{background:"#F0F9F5",border:"1px solid #C5DFA8",borderRadius:8,padding:"10px 14px",marginBottom:14,fontSize:12,color:"#0F6E56",lineHeight:1.7}}>
            <b>Định dạng CSV:</b> hàng đầu là header, các cột: <span style={{fontFamily:"monospace",background:"#E1F5EE",padding:"1px 4px",borderRadius:3"}}>name, industry, products, province, stage</span>... Tải file mẫu từ nút Export trước để xem đúng format.
          </div>
          <input ref={fileRef} type="file" accept=".csv" onChange={handleFile} style={{display:"none"}}/>
          <button onClick={()=>fileRef.current.click()} style={{...gBtn,width:"100%",marginBottom:12,padding:"10px",textAlign:"center"}}>
            📂 Chọn file CSV...
          </button>
          {preview&&(
            <div>
              <div style={{fontSize:12,color:"#777",marginBottom:8}}>
                Tìm thấy <b style={{color:"#1a1a1a"}}>{preview.length} supplier</b> — xem trước 3 dòng đầu:
              </div>
              <div style={{border:"1px solid #e5e5e5",borderRadius:8,overflow:"auto",maxHeight:160,marginBottom:12}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                  <thead><tr style={{background:"#f5f5f5"}}>{["Tên","Ngành","Tỉnh","Stage"].map(h=><th key={h} style={{padding:"6px 10px",textAlign:"left",fontWeight:600,color:"#666",borderBottom:"1px solid #eee"}}>{h}</th>)}</tr></thead>
                  <tbody>{preview.slice(0,3).map((r,i)=><tr key={i} style={{borderBottom:"1px solid #f5f5f5"}}>{[r.name,r.industry,r.province,r.stage].map((v,j)=><td key={j} style={{padding:"6px 10px",color:"#333"}}>{v||"—"}</td>)}</tr>)}</tbody>
                </table>
              </div>
              {done
                ?<div style={{textAlign:"center",padding:"10px",color:"#1D9E75",fontWeight:600,fontSize:13}}>✅ Import hoàn tất!</div>
                :<button onClick={handleImport} disabled={importing} style={{...pBtn,width:"100%",padding:"10px",fontSize:13}}>
                  {importing?<span style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8}}><Spin/>Đang import...</span>:`Import ${preview.length} supplier`}
                </button>
              }
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function SupList({ctx}){
  const {sups,setModal}=ctx;
  const [q,setQ]=useState("");const [fT,setFT]=useState("all");const [fI,setFI]=useState("all");const [fS,setFS]=useState("all");
  const [page,setPage]=useState(1);
  const PAGE_SIZE=50;
  const inds=[...new Set(sups.map(s=>s.industry).filter(Boolean))];
  const fl=useMemo(()=>sups.filter(s=>{
    const ti=calcTier(s.vserf);
    return(fT==="all"||ti.label.startsWith(fT))&&(fI==="all"||s.industry===fI)&&(fS==="all"||s.stage===fS)&&(!q||[s.name,s.products,s.province,s.industry].some(v=>(v||"").toLowerCase().includes(q.toLowerCase())));
  }),[sups,q,fT,fI,fS]);

  // Reset page khi filter thay đổi
  const setFilter=(fn)=>(...args)=>{fn(...args);setPage(1);};

  const totalPages=Math.max(1,Math.ceil(fl.length/PAGE_SIZE));
  const paginated=fl.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);

  return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
        <input value={q} onChange={e=>{setQ(e.target.value);setPage(1);}} placeholder="Tìm tên, sản phẩm, tỉnh..." style={{...iSt,flex:1,minWidth:160}}/>
        <Sel val={fT} onChange={setFilter(setFT)} opts={[["all","Tất cả Tier"],["Tier 1","Tier 1"],["Tier 2","Tier 2"],["Tier 3","Tier 3"],["Not","Not Qualified"]]}/>
        <Sel val={fI} onChange={setFilter(setFI)} opts={[["all","Tất cả ngành"],...inds.map(i=>[i,i])]}/>
        <Sel val={fS} onChange={setFilter(setFS)} opts={[["all","Tất cả Stage"],...STAGES.map(s=>[s.id,s.label])]}/>
      </div>
      <div style={{fontSize:12,color:"#aaa",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span>{fl.length} supplier{fl.length!==sups.length?` (lọc từ ${sups.length})`:""} · Google Sheets</span>
        {totalPages>1&&<span>Trang {page}/{totalPages}</span>}
      </div>
      {fl.length===0&&<Empty text="Không tìm thấy supplier nào."/>}
      <div style={{display:"flex",flexDirection:"column",gap:7}}>
        {paginated.map(s=>{
          const ti=calcTier(s.vserf);const st=STAGES.find(x=>x.id===s.stage);
          return(
            <div key={s.id} onClick={()=>setModal({t:"sup-detail",d:s})} style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"11px 14px",display:"flex",alignItems:"center",gap:10,cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.boxShadow="0 2px 8px rgba(0,0,0,0.08)"} onMouseLeave={e=>e.currentTarget.style.boxShadow="none"}>
              <div style={{width:36,height:36,borderRadius:8,background:ti.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>{ti.label==="Tier 1"?"🥇":ti.label==="Tier 2"?"🥈":ti.label==="Tier 3"?"🥉":"✕"}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:600,fontSize:13,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.name||<span style={{color:"#ccc"}}>Chưa đặt tên</span>}</div>
                <div style={{fontSize:12,color:"#777",marginTop:2}}>{[s.industry,s.province,s.products].filter(Boolean).join(" · ")}</div>
              </div>
              {s.partnerType&&s.partnerType!=="Chưa xác định"&&<span style={{fontSize:10,padding:"2px 7px",borderRadius:4,background:s.partnerType==="Đối tác trực tiếp"?"#EAF3DE":"#E6F1FB",color:s.partnerType==="Đối tác trực tiếp"?"#3B6D11":"#185FA5",fontWeight:600,flexShrink:0}}>{s.partnerType==="Đối tác trực tiếp"?"Trực tiếp":"Nền tảng"}</span>}
              <span style={{fontSize:11,padding:"2px 9px",borderRadius:4,background:ti.bg,color:ti.c,fontWeight:600,flexShrink:0}}>{ti.label}</span>
              <span style={{fontSize:11,padding:"2px 7px",borderRadius:4,background:"#f5f5f5",color:"#777",flexShrink:0}}>{st?.id}</span>
              <span style={{fontSize:12,color:"#aaa",minWidth:36,textAlign:"right",flexShrink:0}}>{ti.t}/45</span>
            </div>
          );
        })}
      </div>
      {/* Pagination */}
      {totalPages>1&&<div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,marginTop:14,flexWrap:"wrap"}}>
        <button onClick={()=>setPage(1)} disabled={page===1} style={{...gBtn,padding:"5px 10px",fontSize:12,opacity:page===1?.4:1}}>«</button>
        <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1} style={{...gBtn,padding:"5px 12px",fontSize:12,opacity:page===1?.4:1}}>‹ Trước</button>
        {Array.from({length:totalPages},(_,i)=>i+1)
          .filter(p=>p===1||p===totalPages||Math.abs(p-page)<=2)
          .reduce((acc,p,i,arr)=>{
            if(i>0&&p-arr[i-1]>1)acc.push("...");
            acc.push(p);return acc;
          },[])
          .map((p,i)=>p==="..."
            ?<span key={"e"+i} style={{fontSize:12,color:"#aaa",padding:"0 4px"}}>…</span>
            :<button key={p} onClick={()=>setPage(p)} style={{...gBtn,padding:"5px 10px",fontSize:12,minWidth:32,background:page===p?"#1D9E75":"none",color:page===p?"#fff":"#555",border:page===p?"none":"1px solid #ddd",fontWeight:page===p?700:400}}>{p}</button>
          )
        }
        <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={page===totalPages} style={{...gBtn,padding:"5px 12px",fontSize:12,opacity:page===totalPages?.4:1}}>Tiếp ›</button>
        <button onClick={()=>setPage(totalPages)} disabled={page===totalPages} style={{...gBtn,padding:"5px 10px",fontSize:12,opacity:page===totalPages?.4:1}}>»</button>
      </div>}
    </div>
  );
}

// ── SHARED CHECKLIST ENGINE ──
function ChecklistEngine({criteria,scores,setScores,maxPer=5,mandatoryIds=[],title,accentColor="#1D9E75",accentBg="#EAF3DE"}){
  const [hints,setHints]=useState({});
  const total=Object.values(scores).reduce((a,b)=>a+(b??0),0);
  const answered=criteria.filter(c=>scores[c.id]!==undefined).length;
  const pct=Math.round(answered/criteria.length*100);
  const isMandatoryFail=mandatoryIds.some(id=>(scores[id]??0)<3);
  const maxTotal=criteria.length*maxPer;
  return(
    <div>
      {/* Progress */}
      <div style={{background:"#f8f8f8",borderRadius:8,padding:"10px 14px",marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:6}}>
          <span style={{color:"#777"}}>{answered}/{criteria.length} tiêu chí đã chấm</span>
          <span style={{fontWeight:700,color:accentColor}}>{total}/{maxTotal} điểm</span>
        </div>
        <div style={{height:6,background:"#e5e5e5",borderRadius:3,overflow:"hidden"}}>
          <div style={{height:"100%",width:pct+"%",background:accentColor,borderRadius:3,transition:"width .3s"}}/>
        </div>
      </div>
      {isMandatoryFail&&<div style={{background:"#FCEBEB",border:"1px solid #E24B4A",borderRadius:8,padding:"8px 12px",marginBottom:10,fontSize:12,color:"#A32D2D"}}>
        ⚠ Tiêu chí bắt buộc chưa đạt ≥ 3 điểm → kết quả sẽ là <b>Not Qualified</b>
      </div>}
      {/* Criteria */}
      {criteria.map(c=>{
        const val=scores[c.id];
        const done=val!==undefined;
        const isMand=mandatoryIds.includes(c.id);
        const isWarn=isMand&&(val??0)<3&&done;
        return(
          <div key={c.id} style={{border:`1.5px solid ${isWarn?"#E24B4A":done?accentColor:"#e5e5e5"}`,borderRadius:10,padding:"12px 14px",marginBottom:8,background:done?accentBg:"#fff",transition:"all .2s"}}>
            <div style={{display:"flex",alignItems:"flex-start",gap:8,marginBottom:8}}>
              <div style={{width:28,height:28,borderRadius:"50%",background:done?accentColor:"#f0f0f0",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:done?"#fff":"#aaa",flexShrink:0}}>{done?val:"?"}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                  <span style={{fontSize:13,fontWeight:600}}>{c.icon} {c.label}</span>
                  {isMand&&<span style={{fontSize:10,padding:"1px 6px",borderRadius:3,background:"#FCEBEB",color:"#A32D2D",fontWeight:600}}>bắt buộc ≥3</span>}
                  {done&&<span style={{fontSize:11,padding:"1px 7px",borderRadius:3,background:accentColor,color:"#fff",fontWeight:600,marginLeft:"auto"}}>{val}/{maxPer}</span>}
                </div>
                <div style={{fontSize:11,color:"#999",marginTop:2}}>{c.desc}</div>
              </div>
              <button onClick={()=>setHints(h=>({...h,[c.id]:!h[c.id]}))} style={{fontSize:11,padding:"2px 7px",borderRadius:4,border:"1px solid #e5e5e5",background:"none",cursor:"pointer",color:"#aaa",flexShrink:0}}>💡</button>
            </div>
            {hints[c.id]&&<div style={{background:"#FFFBF0",border:"1px solid #F0C040",borderRadius:7,padding:"8px 11px",marginBottom:8,fontSize:12,color:"#5C4000",lineHeight:1.6}}>{c.hint}</div>}
            <div style={{display:"flex",flexDirection:"column",gap:4}}>
              {c.opts.map(opt=>{
                const sel=val===opt.p;
                return(
                  <label key={opt.p} onClick={()=>setScores(s=>({...s,[c.id]:opt.p}))} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"7px 10px",borderRadius:7,border:`1px solid ${sel?accentColor:"#e5e5e5"}`,background:sel?"#fff":"#fff",cursor:"pointer",opacity:sel?1:0.85}}>
                    <input type="radio" readOnly checked={sel} style={{marginTop:3,accentColor,flexShrink:0}}/>
                    <span style={{fontSize:12,lineHeight:1.5,flex:1,color:"#333"}}>{opt.t}</span>
                    <span style={{fontSize:11,fontWeight:700,color:sel?accentColor:"#ccc",flexShrink:0,minWidth:40,textAlign:"right"}}>{opt.p} đ</span>
                  </label>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function PreScoreChecklist({supplier,ctx}){
  const {upsS,setModal,toast2}=ctx;

  const total=Object.values(scores).reduce((a,b)=>a+(b??0),0);
  const answered=PRESCORE_CRITERIA.filter(c=>scores[c.id]!==undefined).length;

  };
  const verdict=getVerdict();
  const handleSave=async()=>{
    const merged=Object.fromEntries(PRESCORE_CRITERIA.map(c=>[c.id,scores[c.id]??0]));
    await upsS({...supplier,prescore:JSON.stringify(merged)});

function RFQList({ctx}){

  const fl=rfqs.filter(r=>{
    const typeOk=fType==="all"||(fType==="rfq"&&r.type!=="inq")||(fType==="inq"&&r.type==="inq");
    const statusOk=fStatus==="all"||r.status===fStatus;

        <Sel val={fType} onChange={setFType} opts={[["all","RFQ + INQ"],["rfq","Chỉ RFQ"],["inq","Chỉ INQ"]]}/>

        {["Loại","Mô tả","Trạng thái","Thị trường","Deadline","NCC"].map(h=>(
          <span key={h} style={{fontSize:11,fontWeight:600,color:"#999",textTransform:"uppercase",letterSpacing:.5}}>{h}</span>

          const isInq=r.type==="inq";
          const stList=isInq?INQ_ST:RFQ_ST;
          const st=stList.find(x=>x.id===r.status)||stList[0];
          const mkts=parseJ(r.markets)||[];

          return(
            <div key={r.id} onClick={()=>setModal({t:isInq?"inq-detail":"rfq-detail",d:r})}

              onMouseEnter={e=>e.currentTarget.style.background=r.urgent?"#FFF5F5":"#FAFAFA"}
              onMouseLeave={e=>e.currentTarget.style.background=r.urgent&&!["closed","inq_closed"].includes(r.status)?"#FFFAFA":"#fff"}>
              {/* Col 1: type badge + code */}
              <div style={{display:"flex",flexDirection:"column",gap:3}}>
                <span style={{fontSize:10,padding:"1px 6px",borderRadius:3,fontWeight:700,background:isInq?"#EEEDFE":"#E6F1FB",color:isInq?"#534AB7":"#185FA5",alignSelf:"flex-start"}}>{isInq?"INQ":"RFQ"}</span>

              </div>

              <div style={{minWidth:0,paddingRight:8}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  {r.urgent&&<span style={{fontSize:10,color:"#A32D2D",fontWeight:700,flexShrink:0}}>🔴</span>}

                </div>

              </div>
              {/* Col 3: status */}
              <div><span style={{fontSize:11,padding:"3px 9px",borderRadius:4,background:st.bg,color:st.c,fontWeight:600,whiteSpace:"nowrap"}}>{st.label}</span></div>

              <div style={{fontSize:11,color:"#777",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{mkts.length>0?mkts.join(", "):"—"}</div>

        })}

  );

function RFQAssign({r,ctx}){
  const {sups,upsR,setModal}=ctx;
  const [sel,setSel]=useState(parseJ(r.sids)||[]);
  const [q,setQ]=useState("");
  const fl=sups.filter(s=>!q||[s.name,s.products,s.industry].some(v=>(v||"").toLowerCase().includes(q.toLowerCase())));
  const tog=id=>setSel(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  return(
    <Card>
      <h2 style={{margin:"0 0 10px",fontSize:15,fontWeight:600}}>Gán NCC vào {r.code}</h2>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Tìm NCC..." style={{...iSt,marginBottom:10,boxSizing:"border-box"}}/>
      <div style={{maxHeight:360,overflowY:"auto",display:"flex",flexDirection:"column",gap:6}}>
        {fl.map(s=>{const ti=calcTier(s.vserf);const chk=sel.includes(s.id);return(
          <div key={s.id} onClick={()=>tog(s.id)} style={{background:chk?"#f0faf6":"#fff",border:`1px solid ${chk?"#1D9E75":"#e5e5e5"}`,borderRadius:8,padding:"10px 12px",cursor:"pointer",display:"flex",gap:10,alignItems:"center"}}>
            <div style={{width:20,height:20,borderRadius:4,border:`2px solid ${chk?"#1D9E75":"#ccc"}`,background:chk?"#1D9E75":"none",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{chk&&<span style={{color:"#fff",fontSize:12,fontWeight:700}}>✓</span>}</div>
            <div style={{flex:1,minWidth:0}}><div style={{fontWeight:600,fontSize:13}}>{s.name}</div><div style={{fontSize:12,color:"#777"}}>{s.products} · {s.province}</div></div>
            <span style={{fontSize:11,padding:"2px 8px",borderRadius:4,background:ti.bg,color:ti.c,fontWeight:600,flexShrink:0}}>{ti.label}</span>
          </div>
        );})}
      </div>
      <div style={{display:"flex",gap:8,justifyContent:"space-between",marginTop:12}}>
        <span style={{fontSize:13,color:"#777"}}>{sel.length} NCC được chọn</span>
        <div style={{display:"flex",gap:8}}><button onClick={()=>setModal(null)} style={gBtn}>Hủy</button><button onClick={()=>{upsR({...r,sids:sel,status:sel.length>0?"shortlisted":r.status});setModal(null);}} style={pBtn}>Lưu</button></div>
      </div>
    </Card>
  );
}

function OrderList({ctx}){
  const {orders,sups,rfqs,setModal,canEdit}=ctx;
  const [fStage,setFStage]=useState("all");
  const fl=(orders||[]).filter(o=>fStage==="all"||o.stage===fStage);
  return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:10,alignItems:"center",flexWrap:"wrap"}}>
        <span style={{fontSize:14,fontWeight:600}}>Orders</span>
        <div style={{flex:1}}/>
        <Sel val={fStage} onChange={setFStage} opts={[["all","Tất cả"],...ORDER_STAGES.map(s=>[s.id,s.icon+" "+s.label])]}/>
        {canEdit&&<button onClick={()=>setModal({t:"order-form",d:newO()})} style={{...pBtn,fontSize:12}}>+ Order</button>}
      </div>
      {fl.length===0&&<Empty text="Chưa có order."/>}
      <div style={{display:"flex",flexDirection:"column",gap:7}}>
        {fl.map(o=>{
          const sup=(sups||[]).find(s=>s.id===o.supId);
          const rfq=(rfqs||[]).find(r=>r.id===o.rfqId);
          const st=ORDER_STAGES.find(s=>s.id===o.stage)||ORDER_STAGES[0];
          const overdue=o.etd&&new Date(o.etd)<new Date()&&!["shipment","payment","closed"].includes(o.stage);
          return(
            <div key={o.id} onClick={()=>setModal({t:"order-detail",d:o})} style={{background:"#fff",border:`1px solid ${overdue?"#E24B4A":"#e5e5e5"}`,borderRadius:10,padding:"11px 14px",cursor:"pointer",display:"flex",gap:10,alignItems:"center"}} onMouseEnter={e=>e.currentTarget.style.boxShadow="0 2px 8px rgba(0,0,0,0.08)"} onMouseLeave={e=>e.currentTarget.style.boxShadow="none"}>
              <div style={{fontSize:22,flexShrink:0}}>{st.icon}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:600,fontSize:13}}>{o.code}{sup?<span style={{fontWeight:400,color:"#777"}}> · {sup.name}</span>:""}</div>
                <div style={{fontSize:12,color:"#777",marginTop:2}}>{rfq?rfq.desc:""}{o.poValue?` · ${o.currency} ${o.poValue}`:""}</div>
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4,flexShrink:0}}>
                <span style={{fontSize:11,padding:"2px 9px",borderRadius:4,background:st.bg,color:st.c,fontWeight:600}}>{st.label}</span>
                {o.etd&&<span style={{fontSize:11,color:overdue?"#E24B4A":"#aaa"}}>ETD {o.etd}</span>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

              <label key={ps.id} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"8px 10px",borderRadius:7,border:`1.5px solid ${f.prodStatus===ps.id?ps.c:"#e5e5e5"}`,background:f.prodStatus===ps.id?ps.bg:"#fff",cursor:"pointer"}}>

        <Rw l="Nhận xét"><textarea value={f.perfNotes||""} onChange={e=>set("perfNotes",e.target.value)} style={{...iSt,minHeight:60,resize:"vertical",boxSizing:"border-box"}}/></Rw>
      </Sec>}
      <Sec title="Ghi chú"><textarea value={f.notes||""} onChange={e=>set("notes",e.target.value)} style={{...iSt,minHeight:60,resize:"vertical",boxSizing:"border-box"}}/></Sec>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><button onClick={()=>setModal(null)} style={gBtn}>Hủy</button><button onClick={()=>upsO(f)} style={pBtn}>Lưu Order</button></div>

function OrderDetail({o,ctx}){
  const {sups,rfqs,upsO,delO,setModal,canEdit}=ctx;
  const sup=(sups||[]).find(s=>s.id===o.supId);
  const rfq=(rfqs||[]).find(r=>r.id===o.rfqId);
  const st=ORDER_STAGES.find(s=>s.id===o.stage)||ORDER_STAGES[0];
  const stageIdx=ORDER_STAGES.findIndex(s=>s.id===o.stage);
  const numVal=o.poValue?parseFloat(String(o.poValue).replace(/,/g,"")):0;
  const depositAmt=numVal?`${o.currency} ${(numVal*(o.depositPct||30)/100).toLocaleString()}`:"—";
  const balanceAmt=numVal?`${o.currency} ${(numVal*(100-(o.depositPct||30))/100).toLocaleString()}`:"—";
  const qcColor=o.qcResult==="Pass"?"#1D9E75":o.qcResult==="Fail"?"#E24B4A":"#854F0B";
  const qcBg=o.qcResult==="Pass"?"#EAF3DE":o.qcResult==="Fail"?"#FCEBEB":"#FAEEDA";
  return(
    <Card style={{maxHeight:"85vh",overflowY:"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14,flexWrap:"wrap",gap:8}}>
        <div><div style={{fontSize:12,color:"#aaa",marginBottom:2}}>{rfq?rfq.code+" · ":""}{sup?.name||"—"}</div><h2 style={{margin:0,fontSize:17,fontWeight:700}}>{o.code}</h2>{rfq&&<div style={{fontSize:13,color:"#555",marginTop:3}}>{rfq.desc}</div>}</div>
        <span style={{fontSize:13,padding:"5px 14px",borderRadius:6,background:st.bg,color:st.c,fontWeight:700}}>{st.icon} {st.label}</span>
      </div>
      <div style={{display:"flex",gap:0,marginBottom:16,borderRadius:8,overflow:"hidden",border:"1px solid #eee"}}>
        {ORDER_STAGES.map((s,i)=><div key={s.id} title={s.label} style={{flex:1,padding:"7px 4px",textAlign:"center",fontSize:13,background:i<=stageIdx?s.bg:"#fafafa",color:i<=stageIdx?s.c:"#ccc",borderRight:i<ORDER_STAGES.length-1?"1px solid #eee":"none"}}>{s.icon}</div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"1.2rem",marginBottom:14}}>
        <IB title="Thông tin PO"><IR l="Ngày PO" v={o.poDate}/><IR l="Giá trị" v={o.poValue?`${o.currency} ${o.poValue}`:"—"}/><IR l="ETD" v={o.etd}/><IR l="ETA" v={o.eta}/></IB>
        <IB title="Payment">
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,padding:"5px 0",borderBottom:"1px solid #f5f5f5"}}>
            <span style={{color:"#777"}}>Deposit ({o.depositPct||30}%)</span>
            <div style={{textAlign:"right"}}><div style={{fontWeight:600}}>{depositAmt}</div><div style={{fontSize:11,color:o.depositPaid?"#1D9E75":"#E24B4A",fontWeight:600}}>{o.depositPaid?`✓ ${o.depositDate||""}`:"⏳ Chưa TT"}</div></div>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,padding:"5px 0"}}>
            <span style={{color:"#777"}}>Balance ({100-(o.depositPct||30)}%)</span>
            <div style={{textAlign:"right"}}><div style={{fontWeight:600}}>{balanceAmt}</div><div style={{fontSize:11,color:o.balancePaid?"#1D9E75":"#E24B4A",fontWeight:600}}>{o.balancePaid?`✓ ${o.balanceDate||""}`:"⏳ Chưa TT"}</div></div>
          </div>
        </IB>
      </div>
      {/* Production Status */}
      {o.prodStatus&&(()=>{
        const ps=PROD_STATUS.find(x=>x.id===o.prodStatus);
        if(!ps)return null;
        return(
          <div style={{background:ps.bg,border:`1.5px solid ${ps.c}`,borderRadius:10,padding:"12px 16px",marginBottom:14}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
              <div style={{fontSize:13,fontWeight:700,color:ps.c}}>{ps.icon} Production Status — {ps.label}</div>
              {ps.who&&<span style={{fontSize:11,padding:"2px 8px",borderRadius:4,background:"rgba(0,0,0,0.07)",color:ps.c,fontWeight:600}}>👥 {ps.who}</span>}
            </div>
            <div style={{fontSize:12,color:"#555",lineHeight:1.6}}>{ps.action}</div>
          </div>
        );
      })()}
      {(o.qcType||o.qcResult)&&<div style={{background:o.qcResult?qcBg:"#f8f8f8",border:`1px solid ${o.qcResult?qcColor:"#eee"}`,borderRadius:8,padding:"10px 14px",marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:600,color:"#aaa",textTransform:"uppercase",marginBottom:6}}>🔍 QC</div>
        <div style={{display:"flex",gap:16,flexWrap:"wrap",fontSize:13}}>
          {o.qcType&&<span><span style={{color:"#777"}}>Loại: </span>{o.qcType}</span>}
          {o.qcDate&&<span><span style={{color:"#777"}}>Ngày: </span>{o.qcDate}</span>}
          {o.qcResult&&<span style={{fontWeight:700,color:qcColor}}>{o.qcResult==="Pass"?"✅":o.qcResult==="Fail"?"❌":"⚠"} {o.qcResult}</span>}
        </div>
        {o.qcNotes&&<div style={{fontSize:12,color:"#555",marginTop:6}}>{o.qcNotes}</div>}
      </div>}
      {o.stage==="closed"&&o.rating>0&&<div style={{background:"#F0F9F5",border:"1px solid #C5DFA8",borderRadius:8,padding:"10px 14px",marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:600,color:"#0F6E56",textTransform:"uppercase",marginBottom:6}}>Đánh giá</div>
        <div style={{display:"flex",gap:16,flexWrap:"wrap",alignItems:"center"}}>
          <div style={{fontSize:18}}>{[1,2,3,4,5].map(n=><span key={n} style={{opacity:o.rating>=n?1:0.2}}>⭐</span>)}</div>
          {o.onTimeRate&&<span style={{fontSize:13}}><span style={{color:"#777"}}>On-time: </span><b>{o.onTimeRate}%</b></span>}
          {o.qualityRate&&<span style={{fontSize:13}}><span style={{color:"#777"}}>Quality: </span><b>{o.qualityRate}%</b></span>}
        </div>
      </div>}

      {/* QC Tracker + Biên bản links */}
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <a href={`qc-tracker.html?orderId=${o.id}&orderCode=${o.code}`} target="_blank" rel="noopener noreferrer"
          style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"10px 14px",borderRadius:8,background:"#FFF3DC",border:"1px solid #BA7517",color:"#854F0B",fontWeight:600,fontSize:13,textDecoration:"none"}}>
          🔍 Mở QC Tracker
        </a>
        <a href={`bienban.html?orderId=${o.id}&orderCode=${o.code}&supplier=${encodeURIComponent(sup?.name||"")}&desc=${encodeURIComponent(rfq?.desc||"")}`} target="_blank" rel="noopener noreferrer"
          style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"10px 14px",borderRadius:8,background:"#E6F1FB",border:"1px solid #185FA5",color:"#185FA5",fontWeight:600,fontSize:13,textDecoration:"none"}}>
          📄 Xuất Biên bản
        </a>
      </div>

      {canEdit&&<div style={{background:"#f8f8f8",borderRadius:8,padding:"10px 14px",marginBottom:14}}>
        <div style={{fontSize:11,color:"#aaa",marginBottom:8,fontWeight:600,textTransform:"uppercase"}}>Cập nhật nhanh stage</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {ORDER_STAGES.map(s=><button key={s.id} onClick={()=>upsO({...o,stage:s.id})} style={{fontSize:11,padding:"4px 10px",borderRadius:5,border:`1px solid ${o.stage===s.id?s.c:"#ddd"}`,background:o.stage===s.id?s.bg:"#fff",color:o.stage===s.id?s.c:"#777",cursor:"pointer",fontWeight:o.stage===s.id?700:400}}>{s.icon} {s.label}</button>)}
        </div>
      </div>}
      <div style={{display:"flex",gap:8}}>
        {canEdit&&<button onClick={()=>setModal({t:"order-form",d:o})} style={gBtn}>✏️ Sửa</button>}
        {canEdit&&<button onClick={()=>delO(o.id)} style={{...gBtn,color:"#E24B4A",borderColor:"#E24B4A",marginLeft:"auto"}}>Xóa</button>}
      </div>
    </Card>
  );
}

function Kraljic({ctx}){
  const {sups,setModal,canEdit}=ctx;
  const grouped={strategic:[],leverage:[],bottleneck:[],routine:[],unclassified:[]};
  sups.forEach(s=>{if(s.kraljic&&grouped[s.kraljic])grouped[s.kraljic].push(s);else grouped.unclassified.push(s);});
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}>
        <div><div style={{fontSize:15,fontWeight:600}}>Ma trận Kraljic</div><div style={{fontSize:12,color:"#777",marginTop:2}}>Phân loại NCC theo tác động tài chính và rủi ro</div></div>
        {grouped.unclassified.length>0&&<div style={{fontSize:12,padding:"4px 10px",borderRadius:6,background:"#FAEEDA",color:"#854F0B"}}>{grouped.unclassified.length} NCC chưa phân loại</div>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
        {KRALJIC_QUADRANTS.map(q=>(
          <div key={q.id} style={{background:q.bg,border:`1.5px solid ${q.c}`,borderRadius:12,padding:"1rem"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}><span style={{fontSize:20}}>{q.icon}</span><div><div style={{fontSize:13,fontWeight:700,color:q.c}}>{q.label} <span style={{fontWeight:400,fontSize:12}}>({q.labelVi})</span></div><div style={{fontSize:11,color:"#666"}}>{q.desc}</div></div><span style={{marginLeft:"auto",fontSize:18,fontWeight:700,color:q.c}}>{grouped[q.id].length}</span></div>
            <div style={{fontSize:11,color:"#555",background:"rgba(255,255,255,0.6)",borderRadius:6,padding:"6px 8px",marginBottom:8}}>💡 {q.strategy}</div>
            <div style={{display:"flex",flexDirection:"column",gap:4}}>
              {grouped[q.id].map(s=>{const ti=calcTier(s.vserf);return(
                <div key={s.id} style={{background:"#fff",borderRadius:6,padding:"6px 10px",display:"flex",alignItems:"center",gap:8}}>
                  <div style={{flex:1,minWidth:0}}><div style={{fontSize:12,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.name}</div><div style={{fontSize:11,color:"#777"}}>{s.industry||"—"}</div></div>
                  <span style={{fontSize:10,padding:"1px 6px",borderRadius:3,background:ti.bg,color:ti.c,fontWeight:600,flexShrink:0}}>{ti.label}</span>
                  {canEdit&&<button onClick={()=>setModal({t:"kraljic-edit",d:s})} style={{fontSize:10,padding:"2px 6px",borderRadius:4,border:"1px solid #ddd",background:"none",cursor:"pointer",color:"#777",flexShrink:0}}>Đổi</button>}
                </div>
              );})}
              {grouped[q.id].length===0&&<div style={{fontSize:12,color:"#aaa",textAlign:"center",padding:"8px 0"}}>Chưa có NCC</div>}
            </div>
          </div>
        ))}
      </div>
      {grouped.unclassified.length>0&&<div style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:12,padding:"1rem"}}>
        <div style={{fontSize:13,fontWeight:600,marginBottom:10,color:"#777"}}>📋 Chưa phân loại ({grouped.unclassified.length})</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:8}}>
          {grouped.unclassified.map(s=>{const ti=calcTier(s.vserf);return(
            <div key={s.id} style={{border:"1px solid #eee",borderRadius:8,padding:"10px 12px",display:"flex",alignItems:"center",gap:8}}>
              <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.name}</div><div style={{fontSize:11,color:"#777"}}>{s.industry} · {ti.label}</div></div>
              {canEdit&&<button onClick={()=>setModal({t:"kraljic-edit",d:s})} style={{...pBtn,fontSize:11,padding:"4px 10px",background:"#534AB7",flexShrink:0}}>Phân loại</button>}
            </div>
          );})}
        </div>
      </div>}
    </div>
  );
}

function KraljicEdit({s,ctx}){
  const {upsS,setModal}=ctx;const [selected,setSelected]=useState(s.kraljic||"");
  return(
    <Card>
      <h2 style={{margin:"0 0 4px",fontSize:15,fontWeight:600}}>Phân loại Kraljic — {s.name}</h2>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,margin:"16px 0"}}>
        {KRALJIC_QUADRANTS.map(q=><div key={q.id} onClick={()=>setSelected(q.id)} style={{border:`2px solid ${selected===q.id?q.c:"#eee"}`,borderRadius:10,padding:"12px 14px",cursor:"pointer",background:selected===q.id?q.bg:"#fff"}}><div style={{fontSize:18,marginBottom:4}}>{q.icon}</div><div style={{fontSize:13,fontWeight:700,color:q.c}}>{q.label}</div><div style={{fontSize:11,color:"#777"}}>{q.desc}</div></div>)}
      </div>
      <div style={{display:"flex",gap:8,justifyContent:"space-between"}}>
        {s.kraljic&&<button onClick={()=>{upsS({...s,kraljic:""});setModal(null);}} style={{...gBtn,color:"#E24B4A"}}>Bỏ phân loại</button>}
        <div style={{display:"flex",gap:8,marginLeft:"auto"}}><button onClick={()=>setModal(null)} style={gBtn}>Hủy</button><button onClick={()=>{upsS({...s,kraljic:selected});setModal(null);}} disabled={!selected} style={{...pBtn,background:"#534AB7",opacity:selected?1:.5}}>Lưu</button></div>
      </div>
    </Card>
  );
}

function Dash({ctx}){
  const {sups,rfqs,orders}=ctx;
  const ti={t1:0,t2:0,t3:0,nq:0};let tv=0,vc=0;
  sups.forEach(s=>{const t=calcTier(s.vserf);if(t.label==="Tier 1")ti.t1++;else if(t.label==="Tier 2")ti.t2++;else if(t.label==="Tier 3")ti.t3++;else ti.nq++;if(t.t>0){tv+=t.t;vc++;}});
  const av=vc?Math.round(tv/vc):0;const t12=sups.length?Math.round((ti.t1+ti.t2)/sups.length*100):0;
  const sc={};sups.forEach(s=>{sc[s.stage]=(sc[s.stage]||0)+1;});
  const ind={};sups.forEach(s=>{if(s.industry)ind[s.industry]=(ind[s.industry]||0)+1;});
  const ptCount={};sups.forEach(s=>{const k=s.partnerType||"Chưa xác định";ptCount[k]=(ptCount[k]||0)+1;});
  const ptData=Object.entries(ptCount).sort((a,b)=>b[1]-a[1]);
  const ptColors={"Đối tác trực tiếp":"#1D9E75","Đối tác nền tảng":"#185FA5","Cả hai hình thức":"#534AB7","Chưa xác định":"#aaa"};
  const indData=Object.entries(ind).sort((a,b)=>b[1]-a[1]);
  const indMax=indData.length?indData[0][1]:1;
  const kpis=[{l:"Tổng supplier",v:sups.length,c:"#185FA5"},{l:"Tier 1+2",v:ti.t1+ti.t2,c:"#1D9E75"},{l:"Tỷ lệ T1+T2",v:t12+"%",c:t12>=40?"#1D9E75":"#E24B4A"},{l:"VSERF TB",v:av+"/45",c:av>=32?"#1D9E75":"#E24B4A"},{l:"Orders active",v:(orders||[]).filter(o=>o.stage!=="closed").length,c:"#534AB7"},{l:"RFQ đang mở",v:rfqs.filter(r=>!["closed","inq_closed","inq_converted"].includes(r.status)).length,c:"#854F0B"}];
  return(
    <div>
      <div style={{fontSize:15,fontWeight:600,marginBottom:14}}>Dashboard</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:8,marginBottom:14}}>{kpis.map(k=><div key={k.l} style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"14px 16px"}}><div style={{fontSize:11,color:"#aaa",marginBottom:4}}>{k.l}</div><div style={{fontSize:22,fontWeight:700,color:k.c}}>{k.v}</div></div>)}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
        <div style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"1rem"}}><div style={{fontSize:13,fontWeight:600,marginBottom:10}}>Phân bổ Tier</div>{[{l:"Tier 1",v:ti.t1,c:"#1D9E75"},{l:"Tier 2",v:ti.t2,c:"#185FA5"},{l:"Tier 3",v:ti.t3,c:"#854F0B"},{l:"Not Qualified",v:ti.nq,c:"#A32D2D"}].map(r=><div key={r.l} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><div style={{width:8,height:8,borderRadius:2,background:r.c,flexShrink:0}}/><span style={{fontSize:12,color:"#777",flex:1}}>{r.l}</span><span style={{fontSize:13,fontWeight:600,color:r.c}}>{r.v}</span></div>)}</div>
        <div style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"1rem"}}><div style={{fontSize:13,fontWeight:600,marginBottom:10}}>Orders theo stage</div>{ORDER_STAGES.map(st=>{const cnt=(orders||[]).filter(o=>o.stage===st.id).length;return<div key={st.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}><span style={{fontSize:13}}>{st.icon}</span><span style={{fontSize:12,color:"#777",flex:1}}>{st.label}</span><span style={{fontSize:13,fontWeight:600,color:st.c}}>{cnt}</span></div>;})}</div>
      </div>
      <div style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"1rem",marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:600,marginBottom:12}}>Hình thức hợp tác VNS</div>
        {ptData.length===0?<div style={{fontSize:12,color:"#aaa"}}>Chưa có dữ liệu</div>:ptData.map(([k,v])=>{
          const pct=sups.length?Math.round(v/sups.length*100):0;const c=ptColors[k]||"#aaa";
          return(<div key={k} style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span style={{color:"#555",fontWeight:500}}>{k}</span><span style={{color:"#777"}}>{v} supplier · <b style={{color:c}}>{pct}%</b></span></div><div style={{height:10,background:"#f0f0f0",borderRadius:5,overflow:"hidden"}}><div style={{height:"100%",width:pct+"%",background:c,borderRadius:5}}/></div></div>);
        })}
      </div>
      <div style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"1rem",marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:600,marginBottom:12}}>Phân bổ ngành hàng</div>
        {indData.length===0?<div style={{fontSize:12,color:"#aaa"}}>Chưa có dữ liệu</div>:indData.map(([k,v])=>{
          const pct=sups.length?Math.round(v/sups.length*100):0;const barW=Math.round(v/indMax*100);
          return(<div key={k} style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span style={{color:"#555",fontWeight:500}}>{k}</span><span style={{color:"#777"}}>{v} supplier · <b style={{color:"#534AB7"}}>{pct}%</b></span></div><div style={{height:10,background:"#f0f0f0",borderRadius:5,overflow:"hidden"}}><div style={{height:"100%",width:barW+"%",background:"#534AB7",borderRadius:5}}/></div></div>);
        })}
      </div>
      <div style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"1rem",marginBottom:12}}><div style={{fontSize:13,fontWeight:600,marginBottom:10}}>Pipeline Supplier</div>{STAGES.map(st=>{const cnt=sc[st.id]||0;const max=Math.max(...Object.values(sc),1);return<div key={st.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}><span style={{fontSize:10,color:"#aaa",minWidth:22,flexShrink:0}}>{st.id}</span><span style={{fontSize:12,color:"#555",minWidth:140,flexShrink:0}}>{st.label.replace(st.id+" ","")}</span><div style={{flex:1,height:8,background:"#f0f0f0",borderRadius:4,overflow:"hidden"}}><div style={{height:"100%",width:(cnt/max*100)+"%",background:st.ph===1?"#9FE1CB":st.ph===2?"#B5D4F4":"#EEEDFE",borderRadius:4}}/></div><span style={{fontSize:12,fontWeight:600,minWidth:20,textAlign:"right",color:cnt>0?"#1a1a1a":"#ccc"}}>{cnt}</span></div>;})}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
