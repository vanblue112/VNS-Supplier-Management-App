async function api(action,sheet,body={}){
  if(["getAll","getOne","getByField"].includes(action)){
    const p=new URLSearchParams({action,sheet,...body});
    return(await fetch(`${API_URL}?${p}`)).json();
  }
  return(await fetch(API_URL,{method:"POST",body:JSON.stringify({action,sheet,...body})})).json();
}

const normDate=v=>{
  if(!v)return"";
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  if(s.includes("T")||s.includes("Z")){
    const d=new Date(s);
    if(!isNaN(d))return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)){const[mo,dd,yy]=s.split("/");return`${yy}-${mo.padStart(2,"0")}-${dd.padStart(2,"0")}`;}
  return s;
};
const calcTier=v=>{
  if(!v)return{label:"Not Qualified",c:"#A32D2D",bg:"#FCEBEB",t:0};
  const t=Object.values(v).reduce((a,b)=>a+(b||0),0);
  if((v.phap_ly||0)<3||(v.san_xuat||0)<3)return{label:"Not Qualified",c:"#A32D2D",bg:"#FCEBEB",t};
  if(t>=38)return{label:"Tier 1",c:"#3B6D11",bg:"#EAF3DE",t};
  if(t>=27)return{label:"Tier 2",c:"#185FA5",bg:"#E6F1FB",t};
  if(t>=18)return{label:"Tier 3",c:"#854F0B",bg:"#FAEEDA",t};
  return{label:"Not Qualified",c:"#A32D2D",bg:"#FCEBEB",t};
};
const calcSupPerf=(supId,orders)=>{
  const closed=(orders||[]).filter(o=>o.supId===supId&&o.stage==="closed");
  if(!closed.length)return null;
  const ratings=closed.map(o=>o.rating).filter(Boolean);
  const avgRating=ratings.length?Math.round(ratings.reduce((a,b)=>a+b,0)/ratings.length*10)/10:0;
  const onTime=closed.map(o=>parseFloat(o.onTimeRate)).filter(v=>!isNaN(v));
  const avgOnTime=onTime.length?Math.round(onTime.reduce((a,b)=>a+b,0)/onTime.length):null;
  const quality=closed.map(o=>parseFloat(o.qualityRate)).filter(v=>!isNaN(v));
  const avgQuality=quality.length?Math.round(quality.reduce((a,b)=>a+b,0)/quality.length):null;
  return{orders:closed.length,rating:avgRating,onTime:avgOnTime,quality:avgQuality};
};
const INDUSTRY_GROUPS=[
  ["Furniture","Handicraft & Woven","Home & Kitchen"],
  ["Textiles & Apparel","Fashion Accessories","Footwear","Bags & Luggage"],
  ["Food & Agriculture"],
  ["Hardware, Tools & Equipment","Construction Materials"],
  ["Baby & Toy","Office & Stationery"],
  ["Packaging","Other"],
];
const sameGroup=(a,b)=>{
  if(!a||!b)return false;
  return INDUSTRY_GROUPS.some(g=>g.includes(a)&&g.includes(b));
};

const calcMatch=(sup,r)=>{
  let score=0;
  const breakdown=[];
  const ti=calcTier(sup.vserf);
  const tierPts=ti.label==="Tier 1"?40:ti.label==="Tier 2"?28:ti.label==="Tier 3"?14:0;
  score+=tierPts;
  if(tierPts>0)breakdown.push(`${ti.label} (+${tierPts})`);
  const rInd=r.industry||"";
  const sInd=sup.industry||"";
  let indPts=0,indWarn=false,indLabel="";
  if(rInd&&sInd){
    if(rInd===sInd){indPts=20;indLabel=`Đúng ngành: ${rInd} (+20)`;}
    else if(sameGroup(rInd,sInd)){indPts=10;indLabel=`Ngành liên quan (+10)`;}
    else{indPts=0;indWarn=true;indLabel=`Khác ngành RFQ`;}
  } else if(!rInd){
    const desc=(r.desc||"").toLowerCase();
    const prod=(sup.products||"").toLowerCase();
    const kw=prod.split(" ").filter(w=>w.length>3&&desc.includes(w));
    if(kw.length>0){indPts=8;indLabel=`Keyword match (+8)`;}
    else if(sInd){indPts=3;indLabel=`Có ngành hàng (+3)`;}
  }
  score+=indPts;
  if(indLabel)breakdown.push(indLabel);
  const xkPts=Math.round((sup.vserf?.xuat_khau||0)/5*25);
  score+=xkPts;
  if(xkPts>0)breakdown.push(`XK exp (+${xkPts})`);
  const isCustomRFQ=r.isCustom===true||r.isCustom==="true"||r.isCustom==="TRUE";
  const oemScore=sup.vserf?.oem_odm||0;
  const oemMax=isCustomRFQ?20:15;
  const oemPts=Math.round(oemScore/5*oemMax);
  score+=oemPts;
  if(oemPts>0)breakdown.push(`OEM/ODM (+${oemPts})${isCustomRFQ?" ×custom":""}`);
  return{score:Math.min(100,score),breakdown,indWarn};
};

const genCode=(prefix,existing)=>{
  const d=new Date();
  const yy=String(d.getFullYear()).slice(2);
  const mm=String(d.getMonth()+1).padStart(2,"0");
  const dd=String(d.getDate()).padStart(2,"0");
  const dateStr=`${yy}${mm}${dd}`;
  const todayCodes=existing.filter(r=>{
    const c=String(r.code||"");
    return c.startsWith(`${prefix}-${dateStr}-`);
  });
  const maxSeq=todayCodes.reduce((max,r)=>{
    const parts=String(r.code||"").split("-");
    const seq=parseInt(parts[parts.length-1])||0;
    return Math.max(max,seq);
  },0);
  return`${prefix}-${dateStr}-${String(maxSeq+1).padStart(3,"0")}`;
};

function RFQDesc({text}){
  if(!text)return<span style={{color:"#ccc"}}>—</span>;
  const lines=text.split("\n");
  const els=[];let buf=[];
  const flushBuf=()=>{if(!buf.length)return;els.push(<div key={els.length} style={{display:"flex",flexDirection:"column",gap:3,marginBottom:4}}>{buf.map((l,i)=><div key={i} style={{fontSize:13,color:"#333",lineHeight:1.7}}>{l}</div>)}</div>);buf=[];};
  lines.forEach(raw=>{
    const line=raw.trim();
    if(/^[-—]{1,2}\s*.+\s*[-—]{1,2}$/.test(line)){flushBuf();const label=line.replace(/^[-—\s]+|[-—\s]+$/g,"").trim();els.push(<div key={els.length} style={{fontSize:10,fontWeight:700,color:"#999",textTransform:"uppercase",letterSpacing:1,marginTop:els.length?12:0,marginBottom:4,paddingBottom:3,borderBottom:"1px solid #f0f0f0"}}>{label}</div>);return;}
    if(/^[•\-\*]\s/.test(line)){flushBuf();const content=line.replace(/^[•\-\*]\s+/,"");els.push(<div key={els.length} style={{display:"flex",gap:8,alignItems:"flex-start",padding:"2px 0"}}><span style={{color:"#1D9E75",fontWeight:700,flexShrink:0,marginTop:1}}>•</span><span style={{fontSize:13,color:"#333",lineHeight:1.7,flex:1}}>{content}</span></div>);return;}
    if(!line){flushBuf();return;}
    buf.push(line);
  });
  flushBuf();
  return<div>{els}</div>;
}

const SUP_CSV_FIELDS=["id","name","supIdMgt","supIdPlatform","bizModel","legalType","partnerType","industry","products","foundedYear","province","website","alibabaLink","catalogLink","channel","contactName","zalo","email","certsProduct","certsFactory","exportMarkets","capacity","moq","priceRange","leadTime","incoterm","serviceModel","paymentMethod","stage","partnerStatus","subStatus","rejectReason","inactiveReason","notes","specialNotes","source","kraljic","ca","ua"];
function exportSupCSV(sups){
  const esc=v=>{const s=String(v??"");return s.includes(",")||s.includes("\n")||s.includes('"')?`"${s.replace(/"/g,'""')}"`:s;};
  const csv=[SUP_CSV_FIELDS.join(","),...sups.map(s=>SUP_CSV_FIELDS.map(f=>esc(s[f])).join(","))].join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`VinaSources_Suppliers_${today()}.csv`;a.click();URL.revokeObjectURL(url);
}
function ImportModal({ctx,onClose}){
  const {upsS,toast2}=ctx;const [preview,setPreview]=useState(null);const [importing,setImporting]=useState(false);const [done,setDone]=useState(false);const fileRef=useRef();
  const parseCSV=text=>{
    const lines=text.split(/\r?\n/).filter(Boolean);if(lines.length<2)return[];
    const headers=lines[0].split(",").map(h=>h.replace(/^"|"$/g,"").trim());
    return lines.slice(1).map(line=>{
      const vals=[];let cur="",inQ=false;
      for(let i=0;i<line.length;i++){if(line[i]==='"'){inQ=!inQ;}else if(line[i]===","&&!inQ){vals.push(cur.trim());cur="";}else cur+=line[i];}
      vals.push(cur.trim());
      const obj={};headers.forEach((h,i)=>{obj[h]=(vals[i]||"").replace(/^"|"$/g,"").replace(/""/g,'"');});return obj;
    }).filter(r=>r.name);
  };
  const handleFile=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{const text=ev.target.result.replace(/^\uFEFF/,"");setPreview(parseCSV(text));};reader.readAsText(file,"utf-8");};
  const handleImport=async()=>{
    if(!preview?.length)return;setImporting(true);let ok=0;
    for(const row of preview){try{const s=normSup({...newS(),...row,id:row.id||newId("s"),ca:row.ca||now(),ua:now()});await upsS(s);ok++;}catch(e){console.error(e);}}
    setImporting(false);setDone(true);toast2&&toast2(`Đã import ${ok}/${preview.length} supplier`);
  };
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",zIndex:1100,display:"flex",alignItems:"flex-start",justifyContent:"center",overflowY:"auto",padding:"1rem"}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{width:"100%",maxWidth:560,marginTop:"2rem",marginBottom:"2rem",background:"#fff",borderRadius:12,border:"1px solid #e5e5e5",overflow:"hidden"}} onClick={e=>e.stopPropagation()}>
        <div style={{padding:"14px 18px",borderBottom:"1px solid #f0f0f0",display:"flex",alignItems:"center",justifyContent:"space-between"}}><span style={{fontWeight:600,fontSize:15}}>📥 Import Supplier từ CSV</span><button onClick={onClose} style={{fontSize:18,background:"none",border:"none",cursor:"pointer",color:"#aaa"}}>×</button></div>
        <div style={{padding:"16px 18px"}}>
          <div style={{background:"#F0F9F5",border:"1px solid #C5DFA8",borderRadius:8,padding:"10px 14px",marginBottom:14,fontSize:12,color:"#0F6E56",lineHeight:1.7}}>
            <b>Định dạng CSV:</b> hàng đầu là header. Tải file mẫu từ nút Export trước để xem đúng format.
          </div>
          <input ref={fileRef} type="file" accept=".csv" onChange={handleFile} style={{display:"none"}}/>
          <button onClick={()=>fileRef.current.click()} style={{...gBtn,width:"100%",marginBottom:12,padding:"10px",textAlign:"center"}}>📂 Chọn file CSV...</button>
          {preview&&<div>
            <div style={{fontSize:12,color:"#777",marginBottom:8}}>Tìm thấy <b style={{color:"#1a1a1a"}}>{preview.length} supplier</b> — xem trước 3 dòng:</div>
            <div style={{border:"1px solid #e5e5e5",borderRadius:8,overflow:"auto",maxHeight:160,marginBottom:12}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                <thead><tr style={{background:"#f5f5f5"}}>{["Tên","Ngành","Tỉnh","Stage"].map(h=><th key={h} style={{padding:"6px 10px",textAlign:"left",fontWeight:600,color:"#666",borderBottom:"1px solid #eee"}}>{h}</th>)}</tr></thead>
                <tbody>{preview.slice(0,3).map((r,i)=><tr key={i} style={{borderBottom:"1px solid #f5f5f5"}}>{[r.name,r.industry,r.province,r.stage].map((v,j)=><td key={j} style={{padding:"6px 10px",color:"#333"}}>{v||"—"}</td>)}</tr>)}</tbody>
              </table>
            </div>
            {done?<div style={{textAlign:"center",padding:"10px",color:"#1D9E75",fontWeight:600,fontSize:13}}>✅ Import hoàn tất!</div>:<button onClick={handleImport} disabled={importing} style={{...pBtn,width:"100%",padding:"10px",fontSize:13}}>{importing?<span style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8}}><Spin/>Đang import...</span>:`Import ${preview.length} supplier`}</button>}
          </div>}
        </div>
      </div>
    </div>
  );
}

function SupList({ctx,initStage}){
  const {sups,setModal,canEdit}=ctx;
  const [q,setQ]=useState("");const [fT,setFT]=useState("all");const [fI,setFI]=useState("all");const [fS,setFS]=useState(initStage||"all");const [fP,setFP]=useState("all");
  const [page,setPage]=useState(1);const [showImport,setShowImport]=useState(false);
  const PAGE_SIZE=50;
  const inds=[...new Set(sups.map(s=>s.industry).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const fl=useMemo(()=>sups.filter(s=>{
    const ti=calcTier(s.vserf);
    return(fT==="all"||ti.label.startsWith(fT))&&(fI==="all"||s.industry===fI)&&(fS==="all"||s.stage===fS)&&(fP==="all"||s.partnerType===fP)&&(!q||[s.supIdMgt,s.supIdPlatform,s.name,s.products,s.province,s.industry].some(v=>(v||"").toLowerCase().includes(q.toLowerCase())));
  }),[sups,q,fT,fI,fS,fP]);
  const setFilter=(fn)=>(...args)=>{fn(...args);setPage(1);};
  const totalPages=Math.max(1,Math.ceil(fl.length/PAGE_SIZE));
  const paginated=fl.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);

    <div>
      {showImport&&<ImportModal ctx={ctx} onClose={()=>setShowImport(false)}/>}
      <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>

        <Sel val={fT} onChange={setFilter(setFT)} opts={[["all","Tất cả Tier"],["Tier 1","Tier 1"],["Tier 2","Tier 2"],["Tier 3","Tier 3"],["Not","Not Qualified"]]}/>
        <Sel val={fI} onChange={setFilter(setFI)} opts={[["all","Tất cả ngành"],...inds.map(i=>[i,i])]}/>
        <Sel val={fP} onChange={setFilter(setFP)} opts={[["all","Tất cả hình thức"],...PARTNER_TYPES.map(p=>[p,p])]}/>
        <Sel val={fS} onChange={setFilter(setFS)} opts={[["all","Tất cả Stage"],...STAGES.map(s=>[s.id,s.label])]}/>
      </div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8,flexWrap:"wrap",gap:6}}>
        <span style={{fontSize:12,color:"#aaa"}}>{fl.length} supplier{fl.length!==sups.length?` (lọc từ ${sups.length})`:""}{totalPages>1?` · Trang ${page}/${totalPages}`:""}</span>
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>exportSupCSV(sups)} style={{...gBtn,fontSize:11,padding:"4px 10px",color:"#1D9E75",borderColor:"#1D9E75"}}>⬇ Export CSV</button>
          {canEdit&&<button onClick={()=>setShowImport(true)} style={{...gBtn,fontSize:11,padding:"4px 10px",color:"#185FA5",borderColor:"#185FA5"}}>⬆ Import CSV</button>}
        </div>
      </div>
      {fl.length===0&&<Empty text="Không tìm thấy supplier nào."/>}
      <div style={{display:"flex",flexDirection:"column",gap:7}}>
        {paginated.map(s=>{
          const ti=calcTier(s.vserf);const st=STAGES.find(x=>x.id===s.stage);
          const ps=s.prescore||{};
          const psIds=PRESCORE_CRITERIA.map(c=>c.id);
          const psAnswered=psIds.filter(id=>ps[id]!==undefined&&ps[id]!==null&&ps[id]!=="").length;
          const psTotal=psIds.reduce((a,id)=>a+(parseInt(ps[id])||0),0);
          const psV=psAnswered>=5?(psTotal>=24?{label:"Triển vọng",c:"#1D9E75",bg:"#EAF3DE",icon:"✅"}:psTotal>=15?{label:"Cần xác minh",c:"#854F0B",bg:"#FAEEDA",icon:"⚠️"}:{label:"Loại sớm",c:"#A32D2D",bg:"#FCEBEB",icon:"❌"}):null;
          return(
            <div key={s.id} onClick={()=>setModal({t:"sup-detail",d:s})} style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"11px 14px",display:"flex",alignItems:"center",gap:10,cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.boxShadow="0 2px 8px rgba(0,0,0,0.08)"} onMouseLeave={e=>e.currentTarget.style.boxShadow="none"}>
              <div style={{width:36,height:36,borderRadius:8,background:ti.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>{ti.label==="Tier 1"?"🥇":ti.label==="Tier 2"?"🥈":ti.label==="Tier 3"?"🥉":"✕"}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:6,whiteSpace:"nowrap",overflow:"hidden"}}>
                  {s.supIdMgt&&<span style={{fontSize:10,padding:"1px 6px",borderRadius:3,background:"#f0f0f0",color:"#666",fontWeight:600,fontFamily:"monospace",flexShrink:0}}>{s.supIdMgt}</span>}
                  <span style={{fontWeight:600,fontSize:13,overflow:"hidden",textOverflow:"ellipsis"}}>{s.name||<span style={{color:"#ccc"}}>Chưa đặt tên</span>}</span>
                </div>
                <div style={{fontSize:12,color:"#777",marginTop:2}}>{[s.industry,s.province,s.products].filter(Boolean).join(" · ")}</div>
              </div>
              {(()=>{const sub=getSub(s.stage,s.subStatus);return sub?<span style={{fontSize:10,padding:"2px 7px",borderRadius:4,background:sub.bg,color:sub.c,fontWeight:600,flexShrink:0}}>{sub.icon} {sub.label}</span>:null;})()}
              {psV
                ?<span title={`Pre-score: ${psTotal}/30`} style={{fontSize:10,padding:"2px 7px",borderRadius:4,background:psV.bg,color:psV.c,fontWeight:600,flexShrink:0,cursor:"help"}}>{psV.icon} {psTotal}/30</span>
                :psAnswered>0
                  ?<span title={`Pre-score: ${psAnswered}/6 tiêu chí`} style={{fontSize:10,padding:"2px 7px",borderRadius:4,background:"#f5f5f5",color:"#aaa",fontWeight:600,flexShrink:0}}>🔍 {psAnswered}/6</span>
                  :<span style={{fontSize:10,padding:"2px 7px",borderRadius:4,background:"#f5f5f5",color:"#ccc",fontWeight:400,flexShrink:0}}>Pre —</span>
              }
              <span style={{fontSize:11,padding:"2px 9px",borderRadius:4,background:ti.bg,color:ti.c,fontWeight:600,flexShrink:0}}>{ti.label}</span>
              <span style={{fontSize:11,padding:"2px 7px",borderRadius:4,background:"#f5f5f5",color:"#777",flexShrink:0}}>{st?.id}</span>
              <span style={{fontSize:12,color:"#aaa",minWidth:36,textAlign:"right",flexShrink:0}}>{ti.t}/45</span>
            </div>
          );
        })}
      </div>
      {totalPages>1&&<div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,marginTop:14,flexWrap:"wrap"}}>
        <button onClick={()=>setPage(1)} disabled={page===1} style={{...gBtn,padding:"5px 10px",fontSize:12,opacity:page===1?.4:1}}>«</button>
        <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1} style={{...gBtn,padding:"5px 12px",fontSize:12,opacity:page===1?.4:1}}>‹ Trước</button>
        {Array.from({length:totalPages},(_,i)=>i+1).filter(p=>p===1||p===totalPages||Math.abs(p-page)<=2).reduce((acc,p,i,arr)=>{if(i>0&&p-arr[i-1]>1)acc.push("...");acc.push(p);return acc;},[]).map((p,i)=>p==="..."?<span key={"e"+i} style={{fontSize:12,color:"#aaa",padding:"0 4px"}}>…</span>:<button key={p} onClick={()=>setPage(p)} style={{...gBtn,padding:"5px 10px",fontSize:12,minWidth:32,background:page===p?"#1D9E75":"none",color:page===p?"#fff":"#555",border:page===p?"none":"1px solid #ddd",fontWeight:page===p?700:400}}>{p}</button>)}
        <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={page===totalPages} style={{...gBtn,padding:"5px 12px",fontSize:12,opacity:page===totalPages?.4:1}}>Tiếp ›</button>
        <button onClick={()=>setPage(totalPages)} disabled={page===totalPages} style={{...gBtn,padding:"5px 10px",fontSize:12,opacity:page===totalPages?.4:1}}>»</button>
      </div>}
    </div>
  );
}

function VSERFChecklist({supplier,ctx}){

  const [scores,setScores]=useState(initScores);
  const total=Object.values(scores).reduce((a,b)=>a+(b??0),0);
  const answered=VSERF_CRITERIA.filter(c=>scores[c.id]!==undefined).length;
  const ti=calcTier(Object.fromEntries(Object.entries(scores).map(([k,v])=>[k,v??0])));
  const handleSave=async()=>{const merged=Object.fromEntries(VSERF_CRITERIA.map(c=>[c.id,scores[c.id]??0]));await upsS({...supplier,vserf:merged});toast2&&toast2("Đã lưu VSERF");};

      {rejEntries.length>0&&(

function SupplierCard({s,sel,setSel,rejected,setRejected,selReasons,setSelReasons,showAll,rInd}){
  const ti=calcTier(s.vserf);
  const chk=sel.includes(s.id);
  const m=s._match||0;
  const breakdown=s._breakdown||[];
  const indWarn=!!s._indWarn;
  const sr=selReasons[s.id]||[];
  const rj=rejected[s.id]||{};
  const mbg=m>=70?"#1D9E75":m>=50?"#185FA5":m>=30?"#854F0B":"#ccc";
  const mfg=m>=30?"#fff":"#777";
  const tog=()=>setSel(p=>p.includes(s.id)?p.filter(x=>x!==s.id):[...p,s.id]);
  const togReason=reason=>setSelReasons(p=>({...p,[s.id]:(p[s.id]||[]).includes(reason)?(p[s.id]||[]).filter(r=>r!==reason):[...(p[s.id]||[]),reason]}));
  const setRejR=reason=>setRejected(p=>({...p,[s.id]:{...(p[s.id]||{}),reason:p[s.id]?.reason===reason?"":reason}}));
  const setRejN=note=>setRejected(p=>({...p,[s.id]:{...(p[s.id]||{}),note}}));
  return(
    <div style={{border:`1.5px solid ${chk?"#1D9E75":rj.reason?"#E24B4A":"#e5e5e5"}`,borderRadius:10,background:"#fff",marginBottom:0}}>
      <div
        onClick={()=>{if(!rj.reason)tog();}}
        style={{padding:"10px 12px",display:"flex",gap:10,alignItems:"center",cursor:rj.reason?"default":"pointer",background:chk?"#F0FDF9":rj.reason?"#FFF5F5":"#fff",borderRadius:rj.reason||chk?"10px 10px 0 0":"10px"}}
      >
        {!rj.reason
          ?<div style={{width:20,height:20,borderRadius:4,border:`2px solid ${chk?"#1D9E75":"#ccc"}`,background:chk?"#1D9E75":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            {chk&&<span style={{color:"#fff",fontSize:11,fontWeight:700,lineHeight:1}}>✓</span>}
          </div>
          :<span style={{fontSize:14,flexShrink:0}}>🚫</span>
        }
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:600,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.name||"(Chưa tên)"}</div>
          <div style={{fontSize:11,color:"#888",marginTop:2}}>{[s.industry,s.province].filter(Boolean).join(" · ")||"—"}</div>
          {indWarn&&<div style={{fontSize:10,color:"#A32D2D",fontWeight:600,marginTop:1}}>⚠ Khác ngành RFQ{rInd?` (${rInd})`:""}</div>}
        </div>
        <span style={{fontSize:11,padding:"2px 8px",borderRadius:4,background:mbg,color:mfg,fontWeight:700,flexShrink:0}}>{m}%</span>
        <span style={{fontSize:11,padding:"2px 7px",borderRadius:4,background:ti.bg,color:ti.c,fontWeight:600,flexShrink:0}}>{ti.label}</span>
      </div>
      {breakdown.length>0&&(
        <div style={{padding:"4px 12px 6px",background:"#f9f9f9",borderTop:"1px solid #f0f0f0",display:"flex",gap:5,flexWrap:"wrap"}}>
          {breakdown.map((b,i)=>(
            <span key={i} style={{fontSize:10,padding:"1px 6px",borderRadius:3,fontWeight:600,
              background:b.includes("Khác")?"#FCEBEB":b.includes("Tier 1")?"#EAF3DE":b.includes("Tier 2")?"#E6F1FB":"#f0f0f0",
              color:b.includes("Khác")?"#A32D2D":b.includes("Tier 1")?"#3B6D11":b.includes("Tier 2")?"#185FA5":"#555"
            }}>{b}</span>
          ))}
        </div>
      )}
      {chk&&(
        <div style={{padding:"8px 12px",borderTop:"1px solid #e5e5e5",background:"#F0FDF9"}}>
          <div style={{fontSize:11,fontWeight:600,color:"#1D9E75",marginBottom:6}}>Lý do chọn:</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
            {SELECTION_REASONS.map(reason=>(
              <button key={reason} onClick={e=>{e.stopPropagation();togReason(reason);}}
                style={{fontSize:11,padding:"3px 9px",borderRadius:5,cursor:"pointer",
                  border:`1px solid ${sr.includes(reason)?"#1D9E75":"#ddd"}`,
                  background:sr.includes(reason)?"#1D9E75":"#fff",
                  color:sr.includes(reason)?"#fff":"#555"
                }}>{reason}</button>
            ))}
          </div>
        </div>
      )}
      {!chk&&(
        <div style={{padding:"6px 12px 8px",borderTop:"1px solid #f0f0f0",background:"#fafafa"}}>
          <div style={{fontSize:11,color:"#aaa",marginBottom:5}}>Loại NCC này? Chọn lý do:</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
            {REJECTION_REASONS.map(reason=>(
              <button key={reason} onClick={e=>{e.stopPropagation();setRejR(reason);}}
                style={{fontSize:10,padding:"2px 8px",borderRadius:4,cursor:"pointer",
                  border:`1px solid ${rj.reason===reason?"#E24B4A":"#e5e5e5"}`,
                  background:rj.reason===reason?"#FCEBEB":"#fff",
                  color:rj.reason===reason?"#A32D2D":"#999"
                }}>{reason}</button>
            ))}
          </div>
          {rj.reason&&(
            <input value={rj.note||""} onChange={e=>setRejN(e.target.value)}
              placeholder="Ghi chú thêm..."
              style={{...iSt,fontSize:11,marginTop:6}}/>
          )}
        </div>
      )}
    </div>
  );
}

function RFQAssign({r,ctx}){
  const {sups,upsR,setModal}=ctx;
  const [sel,setSel]=useState(parseJ(r.sids)||[]);
  const [rejected,setRejected]=useState(parseJ(r.rejected)||{});
  const [selReasons,setSelReasons]=useState(parseJ(r.selReasons)||{});
  const [q,setQ]=useState("");
  const [showAll,setShowAll]=useState(false);
  const rInd=r.industry||"";
  const scored=useMemo(()=>{
    if(!sups||!sups.length)return[];
    return sups.map(s=>{
      try{
        const res=calcMatch(s,r);
        return{...s,_match:res.score||0,_breakdown:res.breakdown||[],_indWarn:!!res.indWarn};
      }catch(e){
        return{...s,_match:0,_breakdown:[],_indWarn:false};
      }
    }).sort((a,b)=>b._match-a._match);
  },[sups,r.id,r.industry,r.isCustom]);

  const exactMatch=useMemo(()=>{
    if(!rInd)return scored;
    return scored.filter(s=>(s.industry||"")===(rInd||""));
  },[scored,rInd]);

  const related=useMemo(()=>{
    if(!rInd)return[];
    return scored.filter(s=>s.industry!==rInd&&sameGroup(rInd,s.industry));
  },[scored,rInd]);

  const others=useMemo(()=>{
    if(!rInd)return[];
    return scored.filter(s=>s.industry!==rInd&&!sameGroup(rInd,s.industry));
  },[scored,rInd]);

  const searched=useMemo(()=>{
    if(!q)return[];
    const ql=q.toLowerCase();
    return scored.filter(s=>[s.name,s.products,s.industry,s.province].some(v=>(v||"").toLowerCase().includes(ql)));
  },[scored,q]);

  const cardProps={sel,setSel,rejected,setRejected,selReasons,setSelReasons,showAll,rInd};
  return(
    <Card style={{maxHeight:"85vh",overflowY:"auto"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,flexWrap:"wrap"}}>
        <h2 style={{margin:0,fontSize:15,fontWeight:600}}>Gán NCC vào {r.code}</h2>
        {rInd&&<span style={{fontSize:11,padding:"2px 8px",borderRadius:4,background:"#E6F1FB",color:"#185FA5",fontWeight:600}}>{rInd}</span>}
        {r.isCustom&&<span style={{fontSize:11,padding:"2px 8px",borderRadius:4,background:"#FFF0D6",color:"#B35A00",fontWeight:600}}>🔧 Custom</span>}
        {r.specLink&&<a href={r.specLink} target="_blank" rel="noopener noreferrer" style={{fontSize:11,padding:"2px 9px",borderRadius:4,border:"1px solid #185FA5",color:"#185FA5",textDecoration:"none",fontWeight:600,display:"flex",alignItems:"center",gap:4}}>🔗 Product Spec</a>}
      </div>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Tìm NCC..." style={{...iSt,marginBottom:10}}/>
      <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
        <span style={{padding:"3px 10px",borderRadius:5,background:"#EAF3DE",color:"#1D9E75",fontWeight:600,fontSize:12}}>
          {rInd?`✅ Đúng ngành: ${exactMatch.length}`:`✅ Tất cả NCC: ${exactMatch.length}`}
        </span>
        {rInd&&related.length>0&&<span style={{padding:"3px 10px",borderRadius:5,background:"#E6F1FB",color:"#185FA5",fontWeight:600,fontSize:12}}>🔗 Liên quan: {related.length}</span>}
        {rInd&&!showAll&&others.length>0&&<button onClick={()=>setShowAll(true)} style={{padding:"3px 10px",borderRadius:5,border:"1px solid #ddd",background:"#fff",color:"#777",fontSize:12,cursor:"pointer"}}>+ Hiện {others.length} NCC khác ngành</button>}
        {rInd&&showAll&&<button onClick={()=>setShowAll(false)} style={{padding:"3px 10px",borderRadius:5,border:"1px solid #ddd",background:"#fff",color:"#777",fontSize:12,cursor:"pointer"}}>Ẩn bớt</button>}
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:420,overflowY:"auto"}}>
        {q?(
          searched.length===0
            ?<Empty text="Không tìm thấy NCC phù hợp."/>
            :searched.map(s=><SupplierCard key={s.id} s={s} {...cardProps}/>)
        ):(
          <>
            {exactMatch.length===0&&(!rInd||(!showAll&&related.length===0))&&<Empty text="Chưa có NCC. Thêm supplier vào DB trước."/>}
            {exactMatch.length>0&&<>
              <div style={{fontSize:11,fontWeight:600,color:"#1D9E75",padding:"4px 0",borderBottom:"1px solid #e5e5e5",marginBottom:2}}>
                {rInd?`✅ Đúng ngành — ${rInd}`:"✅ Tất cả NCC"}
              </div>
              {exactMatch.map(s=><SupplierCard key={s.id} s={s} {...cardProps}/>)}
            </>}
            {rInd&&related.length>0&&<>
              <div style={{fontSize:11,fontWeight:600,color:"#185FA5",padding:"4px 0",borderBottom:"1px solid #e5e5e5",marginTop:4,marginBottom:2}}>🔗 Ngành liên quan</div>
              {related.map(s=><SupplierCard key={s.id} s={s} {...cardProps}/>)}
            </>}
            {rInd&&showAll&&others.length>0&&<>
              <div style={{fontSize:11,fontWeight:600,color:"#777",padding:"4px 0",borderBottom:"1px solid #e5e5e5",marginTop:4,marginBottom:2}}>⚠ Khác ngành</div>
              {others.map(s=><SupplierCard key={s.id} s={s} {...cardProps}/>)}
            </>}
          </>
        )}
      </div>
      <div style={{display:"flex",gap:8,justifyContent:"space-between",marginTop:12,paddingTop:12,borderTop:"1px solid #f0f0f0"}}>
        <span style={{fontSize:13,color:"#777"}}>{sel.length} NCC được chọn · {Object.values(rejected).filter(v=>v&&v.reason).length} bị loại</span>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setModal(null)} style={gBtn}>Hủy</button>
          <button onClick={()=>{upsR({...r,sids:sel,rejected:JSON.stringify(rejected),selReasons:JSON.stringify(selReasons),status:sel.length>0?"shortlisted":r.status});setModal(null);}} style={pBtn}>Lưu</button>
        </div>
      </div>
    </Card>
  );
}

function Dash({ctx}){

  const ti={t1:0,t2:0,t3:0,nq:0};let tv=0,vc=0;

  const av=vc?Math.round(tv/vc):0;const t12=sups.length?Math.round((ti.t1+ti.t2)/sups.length*100):0;
  const ind={};sups.forEach(s=>{if(s.industry)ind[s.industry]=(ind[s.industry]||0)+1;});
  const indData=Object.entries(ind).sort((a,b)=>b[1]-a[1]);const indMax=indData.length?indData[0][1]:1;
  const stageCount=id=>sups.filter(s=>s.stage===id).length;
  const subCount=(stg,sid)=>sups.filter(s=>s.stage===stg&&(s.subStatus||"")===sid).length;
  const activeTotal=stageCount("B9");const naTotal=stageCount("B10");
  const stageMax=Math.max(1,...STAGES.map(s=>stageCount(s.id)));
  const kpis=[{l:"Tổng supplier",v:sups.length,c:"#185FA5"},{l:"Active (B9)",v:activeTotal,c:"#1D9E75"},{l:"Non-active (B10)",v:naTotal,c:"#888"},{l:"Tỷ lệ T1+T2",v:t12+"%",c:t12>=40?"#1D9E75":"#E24B4A"},{l:"Orders active",v:(orders||[]).filter(o=>o.stage!=="closed").length,c:"#534AB7"},{l:"RFQ đang mở",v:rfqs.filter(r=>!["closed","inq_closed","inq_converted"].includes(r.status)).length,c:"#854F0B"}];
  return(
    <div>
      <div style={{fontSize:15,fontWeight:600,marginBottom:14}}>Dashboard</div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:8,marginBottom:14}}>{kpis.map(k=><div key={k.l} style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"14px 16px"}}><div style={{fontSize:11,color:"#aaa",marginBottom:4}}>{k.l}</div><div style={{fontSize:22,fontWeight:700,color:k.c}}>{k.v}</div></div>)}</div>

      <div style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"1rem",marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}>
          <div><div style={{fontSize:13,fontWeight:600}}>Pipeline & Trạng thái NCC</div><div style={{fontSize:11,color:"#aaa",marginTop:2}}>Active: <b style={{color:"#1D9E75"}}>{activeTotal}</b> · Non-active: <b style={{color:"#888"}}>{naTotal}</b> · Tổng: {sups.length}</div></div>
        </div>
        <div style={{display:"grid",gap:6}}>
          {STAGES.map(st=>{
            const c=stageCount(st.id);
            const subs=SUBSTATUS[st.id];
            const isExp=expStage===st.id;
            const phC=st.ph===1?"#9FE1CB":st.ph===2?"#B5D4F4":"#C9C4F0";
            const accent=st.c||"#555";
            return(
              <div key={st.id} style={{border:`1px solid ${isExp?accent:"#eee"}`,borderRadius:9,overflow:"hidden",background:isExp&&st.bg?st.bg:"#fff"}}>
                <div onClick={()=>setExpStage(isExp?null:st.id)} style={{padding:"8px 12px",cursor:"pointer",display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:11,fontWeight:700,color:accent,minWidth:30,flexShrink:0}}>{st.id}</span>
                  <span style={{fontSize:12,color:"#444",minWidth:160,flexShrink:0}}>{st.label.replace(st.id+" ","")}</span>
                  <div style={{flex:1,height:8,background:"#f0f0f0",borderRadius:4,overflow:"hidden",minWidth:40}}><div style={{height:"100%",width:(c/stageMax*100)+"%",background:st.c||phC,borderRadius:4}}/></div>
                  <span style={{fontSize:13,fontWeight:700,minWidth:24,textAlign:"right",color:c>0?accent:"#ccc"}}>{c}</span>
                  <span style={{fontSize:11,fontWeight:600,minWidth:42,textAlign:"right",color:c>0?accent:"#ccc",opacity:.75}}>{sups.length?Math.round(c/sups.length*100):0}%</span>
                  <span style={{fontSize:10,color:"#bbb",width:14,textAlign:"center"}}>{isExp?"▲":"▼"}</span>
                </div>
                {subs&&c>0&&<div style={{padding:"0 12px 8px 50px",display:"flex",flexWrap:"wrap",gap:5}}>
                  {subs.map(sub=>{const sc2=subCount(st.id,sub.id);const pct=sups.length?Math.round(sc2/sups.length*100):0;return<span key={sub.id} style={{fontSize:10,padding:"2px 8px",borderRadius:4,background:sub.bg,color:sub.c,fontWeight:600,opacity:sc2>0?1:.4}}>{sub.icon} {sub.label}: {sc2} <span style={{fontWeight:400,opacity:.7}}>({pct}%)</span></span>;})}
                  {(()=>{const noSub=sups.filter(s=>s.stage===st.id&&!(s.subStatus||"")).length;const pct=sups.length?Math.round(noSub/sups.length*100):0;return noSub>0?<span style={{fontSize:10,padding:"2px 8px",borderRadius:4,background:"#f0f0f0",color:"#999",fontWeight:600}}>Chưa rõ: {noSub} <span style={{fontWeight:400,opacity:.7}}>({pct}%)</span></span>:null;})()}
                </div>}
                {isExp&&<div style={{borderTop:`1px solid ${accent}30`,maxHeight:240,overflowY:"auto"}}>
                  {c===0?<div style={{padding:"10px 12px",fontSize:12,color:"#aaa"}}>Chưa có NCC ở bước này</div>
                  :sups.filter(s=>s.stage===st.id).map(s=>{
                    const t=calcTier(s.vserf);const sub=getSub(s.stage,s.subStatus);
                    return(
                      <div key={s.id} onClick={()=>setModal({t:"sup-detail",d:s})} style={{padding:"8px 12px",borderTop:"1px solid #f0f0f0",cursor:"pointer",display:"flex",gap:8,alignItems:"center"}} onMouseEnter={e=>e.currentTarget.style.background="rgba(0,0,0,0.03)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:12,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.name}</div>
                          <div style={{fontSize:11,color:"#777",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.industry||"—"}{st.id==="B10"&&s.inactiveReason?` · ⏸ ${s.inactiveReason}`:""}{st.id==="B4"&&s.subStatus==="rejected"&&s.rejectReason?` · 🚫 ${s.rejectReason}`:""}</div>
                        </div>
                        {sub&&<span style={{fontSize:10,padding:"1px 6px",borderRadius:3,background:sub.bg,color:sub.c,fontWeight:600,flexShrink:0}}>{sub.icon} {sub.label}</span>}
                        <span style={{fontSize:10,padding:"1px 6px",borderRadius:3,background:t.bg,color:t.c,fontWeight:600,flexShrink:0}}>{t.label}</span>
                      </div>
                    );
                  })}
                  <div onClick={e=>{e.stopPropagation();navToStage(st.id);}} style={{padding:"8px 12px",borderTop:`1px solid ${accent}30`,cursor:"pointer",textAlign:"center",fontSize:12,fontWeight:600,color:accent,background:`${accent}10`}}>Xem trong Supplier DB →</div>
                </div>}
              </div>
            );
          })}
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
        <div style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"1rem"}}><div style={{fontSize:13,fontWeight:600,marginBottom:10}}>Phân bổ Tier</div>{[{l:"Tier 1",v:ti.t1,c:"#1D9E75"},{l:"Tier 2",v:ti.t2,c:"#185FA5"},{l:"Tier 3",v:ti.t3,c:"#854F0B"},{l:"Not Qualified",v:ti.nq,c:"#A32D2D"}].map(r=><div key={r.l} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><div style={{width:8,height:8,borderRadius:2,background:r.c,flexShrink:0}}/><span style={{fontSize:12,color:"#777",flex:1}}>{r.l}</span><span style={{fontSize:13,fontWeight:600,color:r.c}}>{r.v}</span></div>)}</div>
        <div style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"1rem"}}><div style={{fontSize:13,fontWeight:600,marginBottom:10}}>Orders theo stage</div>{ORDER_STAGES.map(st=>{const c=(orders||[]).filter(o=>o.stage===st.id).length;return<div key={st.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}><span style={{fontSize:13}}>{st.icon}</span><span style={{fontSize:12,color:"#777",flex:1}}>{st.label}</span><span style={{fontSize:13,fontWeight:600,color:st.c}}>{c}</span></div>;})}</div>
      </div>

      <div style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:10,padding:"1rem",marginBottom:12}}><div style={{fontSize:13,fontWeight:600,marginBottom:12}}>Phân bổ ngành hàng</div>{indData.length===0?<div style={{fontSize:12,color:"#aaa"}}>Chưa có dữ liệu</div>:indData.map(([k,v])=>{const pct=sups.length?Math.round(v/sups.length*100):0;const barW=Math.round(v/indMax*100);return(<div key={k} style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span style={{color:"#555",fontWeight:500}}>{k}</span><span style={{color:"#777"}}>{v} · <b style={{color:"#534AB7"}}>{pct}%</b></span></div><div style={{height:10,background:"#f0f0f0",borderRadius:5,overflow:"hidden"}}><div style={{height:"100%",width:barW+"%",background:"#534AB7",borderRadius:5}}/></div></div>);})}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
